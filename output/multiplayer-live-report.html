        --user: #0f8b8d;

        border-bottom: 1px solid var(--line);

        border-radius: 8px;
        padding: 0 10px;
        background: #fff;

      .conversation-list {

        padding: 8px;
      }
      .conversation-item {
        width: 100%;
        display: grid;
        gap: 6px;
        margin: 0 0 8px;
        padding: 12px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .conversation-item:hover {
        background: #fff;
      }
      .conversation-item.active {
        border-color: #9fb5c1;
        background: #fff;
      }
      .item-top, .chat-head-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        background: #e7ebef;
        color: #303740;
        font-size: 12px;
        white-space: nowrap;
      }
      .pill.api { background: #e6f3f3; color: #0b6f72; }
      .pill.browser { background: #fef3e6; color: #9a4c10; }
      main {
        display: grid;
        grid-template-rows: auto 1fr;
        min-width: 0;
        height: 100vh;
      }
      .chat-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
      }
      .chat-title {
        display: grid;
        gap: 4px;
      }
      .chat-title strong {
        font-size: 20px;
      }
      .chat-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .chat-area {
        overflow: auto;
        padding: 22px clamp(14px, 4vw, 42px);
      }
      .messages {
        max-width: 880px;
        margin: 0 auto;
        display: grid;
        gap: 12px;
      }
      .msg {
        display: grid;
        gap: 5px;
        max-width: min(720px, 92%);
      }
      .msg.user {
        justify-self: end;
      }
      .msg.round {
        justify-self: stretch;
        max-width: 100%;
        margin: 14px 0 4px;
      }
      .label {
        color: var(--muted);
        font-size: 12px;
        padding: 0 4px;
      }
      .bubble {
        padding: 11px 13px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--target);
        line-height: 1.65;
        white-space: pre-wrap;
      }
      .user .bubble {
        border-color: var(--user);
        background: var(--user);
        color: #fff;
      }
      .advisor .bubble {
        background: var(--advisor);
      }
      .copywriter .bubble {
        background: var(--copywriter);
      }
      .round .bubble {
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        text-align: center;
        font-size: 12px;
      }
      .round .bubble::before,
      .round .bubble::after {
        content: "";
        display: inline-block;
        width: min(120px, 18vw);
        height: 1px;
        margin: 0 10px 4px;
        background: var(--line);
      }
      .empty {
        padding: 40px;
        color: var(--muted);
      }
      @media (max-width: 860px) {
        body { height: auto; overflow: auto; }
        .app {
          grid-template-columns: 1fr;
          height: auto;
        }
        aside, main {
          height: auto;
        }
        .conversation-list {
          max-height: 320px;
        }
      }
    </style>

      let activeId = conversations[0]?.id ?? null;

      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));

      function filteredConversations() {
        const keyword = searchEl.value.trim().toLowerCase();
        const source = sourceEl.value;
        return conversations.filter((item) => {
          if (source && item.source !== source) return false;
          if (!keyword) return true;
          const text = [
            item.player_label,
            item.source,
            ...item.messages.map((message) => message.text),
          ].join(" ").toLowerCase();
          return text.includes(keyword);
        });
      }

      function renderList() {
        const items = filteredConversations();
        if (!items.some((item) => item.id === activeId)) activeId = items[0]?.id ?? null;
        listEl.innerHTML = items.map((item) => {
          const sourceClass = item.source === "Browser" ? "browser" : item.source === "API" ? "api" : "";
          return '<button class="conversation-item ' + (item.id === activeId ? "active" : "") + '" type="button" data-id="' + esc(item.id) + '">' +
            '<div class="item-top"><strong>' + esc(item.player_label) + '</strong><span class="pill ' + sourceClass + '">' + esc(item.source) + '</span></div>' +
            '<div class="muted">' + esc(item.turn_count) + ' 轮聊天</div>' +
          '</button>';
        }).join("");
        listEl.querySelectorAll("[data-id]").forEach((button) => {
          button.addEventListener("click", () => {
            activeId = button.dataset.id;
            renderList();
            renderChat();
          });
        });
        renderChat();
      }

      function renderChat() {
        const item = conversations.find((conversation) => conversation.id === activeId);
        if (!item) {
          document.getElementById("chatTitle").textContent = "没有匹配结果";
          document.getElementById("chatSubtitle").textContent = "";
          document.getElementById("chatScore").textContent = "";
          document.getElementById("chatMeta").innerHTML = "";
          document.getElementById("chatArea").innerHTML = '<div class="empty">没有匹配的聊天。</div>';
          return;
        }
        document.getElementById("chatTitle").textContent = item.player_label;
        document.getElementById("chatSubtitle").textContent = item.source + " / " + item.turn_count + " 轮聊天";
        document.getElementById("chatMeta").innerHTML = [
        ].join("");
        document.getElementById("chatArea").innerHTML =
          '<div class="messages">' + item.messages.map(renderMessage).join("") + '</div>';
      }

      function pill(text) {
        return '<span class="pill">' + esc(text) + '</span>';
      }

      function renderMessage(message) {
        if (message.role === "round") {
          return '<div class="msg round">' +
            '<div class="bubble">' + esc(message.label) + '</div>' +
          '</div>';
        }
        return '<div class="msg ' + esc(message.role) + '">' +
          '<div class="label">' + esc(message.label) + '</div>' +
          '<div class="bubble">' + esc(message.text) + '</div>' +
        '</div>';
      }

      searchEl.addEventListener("input", renderList);
      sourceEl.addEventListener("input", renderList);
      renderList();
    </script>
  </body>
</html>
