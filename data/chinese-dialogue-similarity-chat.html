而死亡的婚姻是無意義的婚姻。", "prev": "娟子呀！我不能接受你對我的愛，因爲我不願意毀掉我的家，再說我是人民教師，在婚姻問題上不能見異思遷，祝你另攀高門，永遠幸福！好嗎？", "next": "娟子，你說得對，人的婚姻是建立在兩人感情基礎上的，我和徐麗華的感情雖然有點破綻，但還沒有走到不可調和的地步，今後我還可以對她慢慢地溝通和培養。我相信我和她今後會好起來的。“人無遠慮，禍在眉睫”呀，你懂嗎？", "emotion": "neutral", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 13, "speaker": "左正鵬", "text": "娟子，你說得對，人的婚姻是建立在兩人感情基礎上的，我和徐麗華的感情雖然有點破綻，但還沒有走到不可調和的地步，今後我還可以對她慢慢地溝通和培養。我相信我和她今後會好起來的。“人無遠慮，禍在眉睫”呀，你懂嗎？", "prev": "人民教師有什麼了不起的事，我認爲人的婚姻是建立在兩人感情基礎上的，沒有感情的婚姻是死亡的婚姻，而死亡的婚姻是無意義的婚姻。", "next": "感情是可以培養的？可是你和她結婚好幾年了，你跟她培養出了什麼樣的感情？培出來的是經常相罵打架的感情是不是？", "emotion": "surprise", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 14, "speaker": "娟子", "text": "感情是可以培養的？可是你和她結婚好幾年了，你跟她培養出了什麼樣的感情？培出來的是經常相罵打架的感情是不是？", "prev": "娟子，你說得對，人的婚姻是建立在兩人感情基礎上的，我和徐麗華的感情雖然有點破綻，但還沒有走到不可調和的地步，今後我還可以對她慢慢地溝通和培養。我相信我和她今後會好起來的。“人無遠慮，禍在眉睫”呀，你懂嗎？", "next": "那是以前的事情，我相信她今後會改變的，對我會好起來的！", "emotion": "surprise", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 15, "speaker": "左正鵬", "text": "那是以前的事情，我相信她今後會改變的，對我會好起來的！", "prev": "感情是可以培養的？可是你和她結婚好幾年了，你跟她培養出了什麼樣的感情？培出來的是經常相罵打架的感情是不是？", "next": "“結婚自願，離婚自由”這是我國婚姻法賦予每個公民的權利，我覺得你只會教學，不會生活，自討苦吃。最後我還得提醒你一下，男女之間的配偶範圍相當之廣，你聽不聽我的忠告也隨你的便。", "emotion": "neutral", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 16, "speaker": "娟子", "text": "“結婚自願，離婚自由”這是我國婚姻法賦予每個公民的權利，我覺得你只會教學，不會生活，自討苦吃。最後我還得提醒你一下，男女之間的配偶範圍相當之廣，你聽不聽我的忠告也隨你的便。", "prev": "那是以前的事情，我相信她今後會改變的，對我會好起來的！", "next": "“知我者爲我心憂，不知我者謂我何求！”", "emotion": "disgust", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 17, "speaker": "左正鵬", "text": "“知我者爲我心憂，不知我者謂我何求！”", "prev": "“結婚自願，離婚自由”這是我國婚姻法賦予每個公民的權利，我覺得你只會教學，不會生活，自討苦吃。最後我還得提醒你一下，男女之間的配偶範圍相當之廣，你聽不聽我的忠告也隨你的便。", "next": "", "emotion": "neutral", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "39", "idx": 0, "speaker": "左正鵬", "text": "麗華，你回來啦，吃飯了沒有？", "prev": "", "next": "我回來了你又怎樣？我還不回來你若勾引別的女人去了，我都不知道！", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "39", "idx": 1, "speaker": "徐麗華", "text": "我回來了你又怎樣？我還不回來你若勾引別的女人去了，我都不知道！", "prev": "麗華，你回來啦，吃飯了沒有？", "next": "哎喲，你怎們老是這樣跟我說話呢！我是那號人嗎？", "emotion": "disgust", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "39", "idx": 2, "speaker": "左正鵬", "text": "哎喲，你怎們老是這樣跟我說話呢！我是那號人嗎？", "prev": "我回來了你又怎樣？我還不回來你若勾引別的女人去了，我都不知道！", "next": "你是不是那號人物，你自己心裏最清楚！", "emotion": "surprise", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "39", "idx": 3, "speaker": "徐麗華", "text": "你是不是那號人物，你自己心裏最清楚！", "prev": "哎喲，你怎們老是這樣跟我說話呢！我是那號人嗎？", "next": "麗華，我們倆是自願結婚的，應該珍惜這段感情都來不及了，我還有什麼心思去愛別的女人呢？前次我打了你，我覺得太對不起你了，可是夫妻不記隔夜仇啊！", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "39", "idx": 4, "speaker": "左正鵬", "text": "麗華，我們倆是自願結婚的，應該珍惜這段感情都來不及了，我還有什麼心思去愛別的女人呢？前次我打了你，我覺得太對不起你了，可是夫妻不記隔夜仇啊！", "prev": "你是不是那號人物，你自己心裏最清楚！", "next": "", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "40", "idx": 0, "speaker": "村姑", "text": "麗華，聽說你去了孃家，你是什麼時候回家來的？", "prev": "", "next": "今天早晨纔回來。", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "40", "idx": 1, "speaker": "徐麗華", "text": "今天早晨纔回來。", "prev": "麗華，聽說你去了孃家，你是什麼時候回家來的？", "next": "你這次去孃家怕有好幾天了吧？", "emotion": "neutral", "relation": "村姑:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "40", "idx": 2, "speaker": "村姑", "text": "你這次去孃家怕有好幾天了吧？", "prev": "今天早晨纔回來。", "next": "有一個多星期了。這幾天我不在家裏，你看見有沒有別的女人到過我家找正鵬有事嗎？", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "40", "idx": 3, "speaker": "徐麗華", "text": "有一個多星期了。這幾天我不在家裏，你看見有沒有別的女人到過我家找正鵬有事嗎？", "prev": "你這次去孃家怕有好幾天了吧？", "next": "麗華，你剛去孃家的早晨，娟子就來到了你的家門口和正鵬說說笑笑，語言甜甜的。", "emotion": "neutral", "relation": "村姑:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "40", "idx": 4, "speaker": "村姑", "text": "麗華，你剛去孃家的早晨，娟子就來到了你的家門口和正鵬說說笑笑，語言甜甜的。", "prev": "有一個多星期了。這幾天我不在家裏，你看見有沒有別的女人到過我家找正鵬有事嗎？", "next": "啊！他倆講些什麼？", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "40", "idx": 5, "speaker": "徐麗華", "text": "啊！他倆講些什麼？", "prev": "麗華，你剛去孃家的早晨，娟子就來到了你的家門口和正鵬說說笑笑，語言甜甜的。", "next": "後來我不太注意，好像娟子走進你屋裏去了有什麼事似的。不過我得提醒你，今後你要多多注意娟子這女人打你正鵬的主意嘍！", "emotion": "surprise", "relation": "村姑:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "40", "idx": 6, "speaker": "村姑", "text": "後來我不太注意，好像娟子走進你屋裏去了有什麼事似的。不過我得提醒你，今後你要多多注意娟子這女人打你正鵬的主意嘍！", "prev": "啊！他倆講些什麼？", "next": "是的，我心裏早就有了這種想法，也的確擔心他有外遇。", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "40", "idx": 7, "speaker": "徐麗華", "text": "是的，我心裏早就有了這種想法，也的確擔心他有外遇。", "prev": "後來我不太注意，好像娟子走進你屋裏去了有什麼事似的。不過我得提醒你，今後你要多多注意娟子這女人打你正鵬的主意嘍！", "next": "嗨！現在這世道真是人心難測哪！女人對自己的老公如果不管嚴些是會出問題的。你們在電視上都會經常看到嗎，那些妖里妖氣的女人想方設法去勾引別的男人，看起來都肉麻啦！", "emotion": "neutral", "relation": "村姑:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "40", "idx": 8, "speaker": "村姑", "text": "嗨！現在這世道真是人心難測哪！女人對自己的老公如果不管嚴些是會出問題的。你們在電視上都會經常看到嗎，那些妖里妖氣的女人想方設法去勾引別的男人，看起來都肉麻啦！", "prev": "是的，我心裏早就有了這種想法，也的確擔心他有外遇。", "next": "是的，你說得太對了，現在的女人都變了，你看內褲子都套在外面穿着。並且還穿着緊身衣，多難看的。今後我把正鵬一定要管嚴些。萬一他出了軌我怎麼辦呀！", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "40", "idx": 9, "speaker": "徐麗華", "text": "是的，你說得太對了，現在的女人都變了，你看內褲子都套在外面穿着。並且還穿着緊身衣，多難看的。今後我把正鵬一定要管嚴些。萬一他出了軌我怎麼辦呀！", "prev": "嗨！現在這世道真是人心難測哪！女人對自己的老公如果不管嚴些是會出問題的。你們在電視上都會經常看到嗎，那些妖里妖氣的女人想方設法去勾引別的男人，看起來都肉麻啦！", "next": "", "emotion": "angry", "relation": "村姑:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "41", "idx": 0, "speaker": "村姑", "text": "麗華，今天你也親自看見了吧，你正鵬爲什麼要替娟子挑柴，難道事情真的這麼湊巧嗎？在這放學路上他倆剛好碰上了？我看肯定是他們事先約定好了的，你說是不是？", "prev": "", "next": "是的，是的。我也是這麼想的。", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "41", "idx": 1, "speaker": "徐麗華", "text": "是的，是的。我也是這麼想的。", "prev": "麗華，今天你也親自看見了吧，你正鵬爲什麼要替娟子挑柴，難道事情真的這麼湊巧嗎？在這放學路上他倆剛好碰上了？我看肯定是他們事先約定好了的，你說是不是？", "next": "", "emotion": "neutral", "relation": "村姑:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 0, "speaker": "左正鵬", "text": "麗華，開門，我放學回來啦！你怎麼閂着門睡覺了？", "prev": "", "next": "今天你怎麼啦，你把門閂着幹什麼？身體是否不舒服？", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 1, "speaker": "左正鵬", "text": "今天你怎麼啦，你把門閂着幹什麼？身體是否不舒服？", "prev": "麗華，開門，我放學回來啦！你怎麼閂着門睡覺了？", "next": "姓左的，你今天替娟子挑柴還不到她家吃飯去，還賴在我這裏敲門幹什麼！壞東西！", "emotion": "surprise", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 2, "speaker": "徐麗華", "text": "姓左的，你今天替娟子挑柴還不到她家吃飯去，還賴在我這裏敲門幹什麼！壞東西！", "prev": "今天你怎麼啦，你把門閂着幹什麼？身體是否不舒服？", "next": "麗華，你又在胡鬧是嗎？我在放學的路上順便幫娟子挑挑柴這有什麼不好的。我們都是同村子裏的人，也應該互相幫助嘛！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 3, "speaker": "左正鵬", "text": "麗華，你又在胡鬧是嗎？我在放學的路上順便幫娟子挑挑柴這有什麼不好的。我們都是同村子裏的人，也應該互相幫助嘛！", "prev": "姓左的，你今天替娟子挑柴還不到她家吃飯去，還賴在我這裏敲門幹什麼！壞東西！", "next": "別人早就跟我說了閒話，我還不相信，今天我親眼看見你跟娟子挑柴，你還在詭辯！", "emotion": "surprise", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 4, "speaker": "徐麗華", "text": "別人早就跟我說了閒話，我還不相信，今天我親眼看見你跟娟子挑柴，你還在詭辯！", "prev": "麗華，你又在胡鬧是嗎？我在放學的路上順便幫娟子挑挑柴這有什麼不好的。我們都是同村子裏的人，也應該互相幫助嘛！", "next": "哎喲，我的天哪！我真是跳進黃河洗不清了。麗華：請你相信我，我和娟子之間是最清白的了，我沒有做出任何對不起你的事情！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 5, "speaker": "左正鵬", "text": "哎喲，我的天哪！我真是跳進黃河洗不清了。麗華：請你相信我，我和娟子之間是最清白的了，我沒有做出任何對不起你的事情！", "prev": "別人早就跟我說了閒話，我還不相信，今天我親眼看見你跟娟子挑柴，你還在詭辯！", "next": "麗華，你兩口子又在吵什麼呀？", "emotion": "surprise", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 6, "speaker": "村姑", "text": "麗華，你兩口子又在吵什麼呀？", "prev": "哎喲，我的天哪！我真是跳進黃河洗不清了。麗華：請你相信我，我和娟子之間是最清白的了，我沒有做出任何對不起你的事情！", "next": "你來得正好，正鵬今天給娟子挑柴你也看見了。我覺得裏頭一定有“鬼”。", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 7, "speaker": "徐麗華", "text": "你來得正好，正鵬今天給娟子挑柴你也看見了。我覺得裏頭一定有“鬼”。", "prev": "麗華，你兩口子又在吵什麼呀？", "next": "今天正鵬跟娟子挑柴的確也是事實。我認爲同村人互相幫助也是應該的嘛！", "emotion": "angry", "relation": "村姑:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 8, "speaker": "村姑", "text": "今天正鵬跟娟子挑柴的確也是事實。我認爲同村人互相幫助也是應該的嘛！", "prev": "你來得正好，正鵬今天給娟子挑柴你也看見了。我覺得裏頭一定有“鬼”。", "next": "那你覺得他倆之間正常嗎？", "emotion": "neutral", "relation": "徐麗華:friend，左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 9, "speaker": "徐麗華", "text": "那你覺得他倆之間正常嗎？", "prev": "今天正鵬跟娟子挑柴的確也是事實。我認爲同村人互相幫助也是應該的嘛！", "next": "傻女人，自己的老公若有了外遇要靠自己平日多多地觀察和祕密的跟蹤才能發現。不能單憑別人在你耳邊亂說。有的人是不懷好意的，你知道嗎！", "emotion": "neutral", "relation": "村姑:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 10, "speaker": "村姑", "text": "傻女人，自己的老公若有了外遇要靠自己平日多多地觀察和祕密的跟蹤才能發現。不能單憑別人在你耳邊亂說。有的人是不懷好意的，你知道嗎！", "prev": "那你覺得他倆之間正常嗎？", "next": "是的，村姑，你講得太對啦！今後我要多跟蹤左正鵬的行動。我相信狐狸的尾巴總會有一天會露出來的。今天的事我就讓他過去了算啦！", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 11, "speaker": "徐麗華", "text": "是的，村姑，你講得太對啦！今後我要多跟蹤左正鵬的行動。我相信狐狸的尾巴總會有一天會露出來的。今天的事我就讓他過去了算啦！", "prev": "傻女人，自己的老公若有了外遇要靠自己平日多多地觀察和祕密的跟蹤才能發現。不能單憑別人在你耳邊亂說。有的人是不懷好意的，你知道嗎！", "next": "對！你這就對了嗎。自己的老公要靠自己去管教！", "emotion": "neutral", "relation": "村姑:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "42", "idx": 12, "speaker": "村姑", "text": "對！你這就對了嗎。自己的老公要靠自己去管教！", "prev": "是的，村姑，你講得太對啦！今後我要多跟蹤左正鵬的行動。我相信狐狸的尾巴總會有一天會露出來的。今天的事我就讓他過去了算啦！", "next": "", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "43", "idx": 0, "speaker": "徐麗華", "text": "左正鵬，你竟敢在這光天化日之下和女老師眉飛色舞，兩人的頭部都碰到了一起，夠親熱的。我老實告訴你，你到處勾引女人，你還是不是人民教師？", "prev": "", "next": "麗華，請你講話文明點好不好，我倆是在討論一道數學難題！你知道嗎！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "43", "idx": 1, "speaker": "左正鵬", "text": "麗華，請你講話文明點好不好，我倆是在討論一道數學難題！你知道嗎！", "prev": "左正鵬，你竟敢在這光天化日之下和女老師眉飛色舞，兩人的頭部都碰到了一起，夠親熱的。我老實告訴你，你到處勾引女人，你還是不是人民教師？", "next": "討論數學難題？她不可以和女老師討論嗎？爲什麼非得和你討論呢？前次你幫娟子那臭女人挑柴，今天你又和女老師在這裏低頭交談，你認爲我看不出來是嗎！", "emotion": "surprise", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "43", "idx": 2, "speaker": "徐麗華", "text": "討論數學難題？她不可以和女老師討論嗎？爲什麼非得和你討論呢？前次你幫娟子那臭女人挑柴，今天你又和女老師在這裏低頭交談，你認爲我看不出來是嗎！", "prev": "麗華，請你講話文明點好不好，我倆是在討論一道數學難題！你知道嗎！", "next": "你夠了嗎。我告訴你，口裏不要說髒話，有話我放學後到家裏去說。", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "43", "idx": 3, "speaker": "左正鵬", "text": "你夠了嗎。我告訴你，口裏不要說髒話，有話我放學後到家裏去說。", "prev": "討論數學難題？她不可以和女老師討論嗎？爲什麼非得和你討論呢？前次你幫娟子那臭女人挑柴，今天你又和女老師在這裏低頭交談，你認爲我看不出來是嗎！", "next": "徐麗華，你這個潑婦，到處惹是生非，你可知道這辦公室裏是我們老師辦公的地方，是文明的場所，沒有你說話的份！今天我和左老師是在討論一道數學難題，這是件十分正常的事，哪個單位裏沒有女同志和男同志在一起辦公！希望你放尊重點，不然你給我滾出去。這裏沒有你說話的資格！", "emotion": "disgust", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "43", "idx": 4, "speaker": "劉豔", "text": "徐麗華，你這個潑婦，到處惹是生非，你可知道這辦公室裏是我們老師辦公的地方，是文明的場所，沒有你說話的份！今天我和左老師是在討論一道數學難題，這是件十分正常的事，哪個單位裏沒有女同志和男同志在一起辦公！希望你放尊重點，不然你給我滾出去。這裏沒有你說話的資格！", "prev": "你夠了嗎。我告訴你，口裏不要說髒話，有話我放學後到家裏去說。", "next": "小徐，怎麼又是你呀！你這是第二次鬧到學校啦，老師們的家屬都像你一樣，我們學校豈不是成了吵架的場地嗎。我們還辦什麼學嘍！", "emotion": "angry", "relation": "徐麗華:other peer", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "43", "idx": 5, "speaker": "孫校長", "text": "小徐，怎麼又是你呀！你這是第二次鬧到學校啦，老師們的家屬都像你一樣，我們學校豈不是成了吵架的場地嗎。我們還辦什麼學嘍！", "prev": "徐麗華，你這個潑婦，到處惹是生非，你可知道這辦公室裏是我們老師辦公的地方，是文明的場所，沒有你說話的份！今天我和左老師是在討論一道數學難題，這是件十分正常的事，哪個單位裏沒有女同志和男同志在一起辦公！希望你放尊重點，不然你給我滾出去。這裏沒有你說話的資格！", "next": "孫校長，她說學校是文明的地方，可是有人在這個文明的地方做了不文明的事，你怎麼不管管呢？", "emotion": "surprise", "relation": "徐麗華:unknown", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "43", "idx": 6, "speaker": "徐麗華", "text": "孫校長，她說學校是文明的地方，可是有人在這個文明的地方做了不文明的事，你怎麼不管管呢？", "prev": "小徐，怎麼又是你呀！你這是第二次鬧到學校啦，老師們的家屬都像你一樣，我們學校豈不是成了吵架的場地嗎。我們還辦什麼學嘍！", "next": "誰做了不文明的事，你又看見了什麼呢？你可不能亂說別人啊！", "emotion": "disgust", "relation": "孫校長:unknown", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "43", "idx": 7, "speaker": "孫校長", "text": "誰做了不文明的事，你又看見了什麼呢？你可不能亂說別人啊！", "prev": "孫校長，她說學校是文明的地方，可是有人在這個文明的地方做了不文明的事，你怎麼不管管呢？", "next": "", "emotion": "surprise", "relation": "徐麗華:unknown", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "44", "idx": 0, "speaker": "徐麗華", "text": "今天等你放學回到家裏來，我再來和你算賬。你在學校和女老師這樣那樣的還不準別人講你，你不配當人民教師！", "prev": "", "next": "徐妹，你不要罵野話，罵出來不好聽，你左老師的人品我們全村人都知道，其實他不是你說的那種人。他作風正派、品格優良，是我們的好老師！", "emotion": "angry", "relation": "村民丙:stranger，村民甲:stranger，村民乙:stranger", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "44", "idx": 1, "speaker": "村民甲", "text": "徐妹，你不要罵野話，罵出來不好聽，你左老師的人品我們全村人都知道，其實他不是你說的那種人。他作風正派、品格優良，是我們的好老師！", "prev": "今天等你放學回到家裏來，我再來和你算賬。你在學校和女老師這樣那樣的還不準別人講你，你不配當人民教師！", "next": "哪個單位沒有男的和女的在一起工作，小眼鬼！", "emotion": "disgust", "relation": "徐麗華:stranger", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "44", "idx": 2, "speaker": "村民乙", "text": "哪個單位沒有男的和女的在一起工作，小眼鬼！", "prev": "徐妹，你不要罵野話，罵出來不好聽，你左老師的人品我們全村人都知道，其實他不是你說的那種人。他作風正派、品格優良，是我們的好老師！", "next": "左老師討了這麼個憨婆娘，真傷腦筋，要是我寧願打一輩子光棍！", "emotion": "disgust", "relation": "村民丙:friend，村民甲:friend，徐麗華:stranger", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "44", "idx": 3, "speaker": "村民丙", "text": "左老師討了這麼個憨婆娘，真傷腦筋，要是我寧願打一輩子光棍！", "prev": "哪個單位沒有男的和女的在一起工作，小眼鬼！", "next": "", "emotion": "disgust", "relation": "村民甲:friend，村民乙:friend，徐麗華:stranger", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "45", "idx": 0, "speaker": "左正鵬", "text": "劉老師，太委屈你了，你心裏別難過。農村婦女的素質就是這麼低，我放學回去一定要教訓她的。", "prev": "", "next": "左老師，你怎麼娶了這麼個憨婆娘，她簡直是個神經病！難道天底下就沒有別的女人了嗎？", "emotion": "sadness", "relation": "劉豔:colleague", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "45", "idx": 1, "speaker": "劉豔", "text": "左老師，你怎麼娶了這麼個憨婆娘，她簡直是個神經病！難道天底下就沒有別的女人了嗎？", "prev": "劉老師，太委屈你了，你心裏別難過。農村婦女的素質就是這麼低，我放學回去一定要教訓她的。", "next": "是啊！這都是命中註定的事，沒辦法呀！", "emotion": "surprise", "relation": "左正鵬:colleague", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "45", "idx": 2, "speaker": "左正鵬", "text": "是啊！這都是命中註定的事，沒辦法呀！", "prev": "左老師，你怎麼娶了這麼個憨婆娘，她簡直是個神經病！難道天底下就沒有別的女人了嗎？", "next": "劉老師，你別生氣啊，肚量大些，我代她向你賠禮道歉行嗎", "emotion": "sadness", "relation": "劉豔:colleague", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "45", "idx": 3, "speaker": "左正鵬", "text": "劉老師，你別生氣啊，肚量大些，我代她向你賠禮道歉行嗎", "prev": "是啊！這都是命中註定的事，沒辦法呀！", "next": "我倒沒有什麼，就怕別人聽了對你有不公正的評論。", "emotion": "sadness", "relation": "劉豔:colleague", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "45", "idx": 4, "speaker": "劉豔", "text": "我倒沒有什麼，就怕別人聽了對你有不公正的評論。", "prev": "劉老師，你別生氣啊，肚量大些，我代她向你賠禮道歉行嗎", "next": "", "emotion": "neutral", "relation": "左正鵬:colleague", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "46", "idx": 0, "speaker": "左正鵬", "text": "徐麗華，你快開門，把你今天鬧到辦公室的事跟我說清楚。限你五分鐘時間若還不開門，你就回想下前次你被我痛打的情景！", "prev": "", "next": "麗華，你今天真是太誤會了。我和劉老師的確是在討論一道數學難題，我們每說出的一句話都是數學方面的術語，每寫出一行字都是數學方面的內容。你想想她是省城裏的姑娘，父母都是廳局級幹部，而我呢，卻是一位有妻有室的農村青年，她能瞧得上我嗎？你也太無知了，你今天的行動太魯莽了，損害了我的形象，今後再不能做出這種蠢事了！", "emotion": "angry", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "46", "idx": 1, "speaker": "左正鵬", "text": "麗華，你今天真是太誤會了。我和劉老師的確是在討論一道數學難題，我們每說出的一句話都是數學方面的術語，每寫出一行字都是數學方面的內容。你想想她是省城裏的姑娘，父母都是廳局級幹部，而我呢，卻是一位有妻有室的農村青年，她能瞧得上我嗎？你也太無知了，你今天的行動太魯莽了，損害了我的形象，今後再不能做出這種蠢事了！", "prev": "徐麗華，你快開門，把你今天鬧到辦公室的事跟我說清楚。限你五分鐘時間若還不開門，你就回想下前次你被我痛打的情景！", "next": "你當教師的人，嘴裏會說話，黑的會說成了白的，白的會說成黑的。這次我總算又相信了你。下次如果又發現有類似的情況出現，看你又如何向我解釋！", "emotion": "angry", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "46", "idx": 2, "speaker": "徐麗華", "text": "你當教師的人，嘴裏會說話，黑的會說成了白的，白的會說成黑的。這次我總算又相信了你。下次如果又發現有類似的情況出現，看你又如何向我解釋！", "prev": "麗華，你今天真是太誤會了。我和劉老師的確是在討論一道數學難題，我們每說出的一句話都是數學方面的術語，每寫出一行字都是數學方面的內容。你想想她是省城裏的姑娘，父母都是廳局級幹部，而我呢，卻是一位有妻有室的農村青年，她能瞧得上我嗎？你也太無知了，你今天的行動太魯莽了，損害了我的形象，今後再不能做出這種蠢事了！", "next": "", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "47", "idx": 0, "speaker": "劉豔", "text": "正鵬，今天你好像有什麼心事似的，老是不高興？", "prev": "", "next": "沒什麼，我只覺得今天照相我好像坐錯位子了。", "emotion": "surprise", "relation": "左正鵬:colleague", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "47", "idx": 1, "speaker": "左正鵬", "text": "沒什麼，我只覺得今天照相我好像坐錯位子了。", "prev": "正鵬，今天你好像有什麼心事似的，老是不高興？", "next": "大集體照相有什麼坐錯位的，你也真是的。你老是自作多情。", "emotion": "neutral", "relation": "劉豔:colleague", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "47", "idx": 2, "speaker": "劉豔", "text": "大集體照相有什麼坐錯位的，你也真是的。你老是自作多情。", "prev": "沒什麼，我只覺得今天照相我好像坐錯位子了。", "next": "", "emotion": "neutral", "relation": "左正鵬:colleague", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "48", "idx": 0, "speaker": "孫校長", "text": "左老師祝賀你班學生在這次統考中，語、數總分名列全縣同年級第一名。並且，你和劉豔老師被評爲縣優秀教師。", "prev": "", "next": "孫校長，這是真的嗎？", "emotion": "happiness", "relation": "左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "48", "idx": 1, "speaker": "劉豔", "text": "孫校長，這是真的嗎？", "prev": "左老師祝賀你班學生在這次統考中，語、數總分名列全縣同年級第一名。並且，你和劉豔老師被評爲縣優秀教師。", "next": "這麼大的事我能騙你們嗎！", "emotion": "surprise", "relation": "孫校長:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "48", "idx": 2, "speaker": "孫校長", "text": "這麼大的事我能騙你們嗎！", "prev": "孫校長，這是真的嗎？", "next": "這也是我們孫校長抓教學有方和老師們平日共同協作的結果！", "emotion": "happiness", "relation": "劉豔:boss，左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "48", "idx": 3, "speaker": "左正鵬", "text": "這也是我們孫校長抓教學有方和老師們平日共同協作的結果！", "prev": "這麼大的事我能騙你們嗎！", "next": "", "emotion": "happiness", "relation": "孫校長:subordinate，劉豔:colleague", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "49", "idx": 0, "speaker": "徐麗華", "text": "左正鵬，這次你應該承認你和劉豔老師有不正當的關繫了嗎？你看學生畢業相片上的合影這是多麼充分的證據。你們倆那麼親熱，捱得那麼緊，又是笑得那麼開心，同時還視着眼色，真是天配一雙！", "prev": "", "next": "哎喲，麗華，照畢業相是學校安排的事，至於我和劉豔老師坐在一起照嘛，這也是攝影師傅安排的。本來我就不想和劉豔老師坐在一起照，怕你有想法，但師傅早就安排好了我倆的座位，他說我和劉豔是同學們的正副班主任又是科任老師，我和她坐在一起這是名正言順的事，所以就這樣拍下來這張使你極其誤會的照片！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "49", "idx": 1, "speaker": "左正鵬", "text": "哎喲，麗華，照畢業相是學校安排的事，至於我和劉豔老師坐在一起照嘛，這也是攝影師傅安排的。本來我就不想和劉豔老師坐在一起照，怕你有想法，但師傅早就安排好了我倆的座位，他說我和劉豔是同學們的正副班主任又是科任老師，我和她坐在一起這是名正言順的事，所以就這樣拍下來這張使你極其誤會的照片！", "prev": "左正鵬，這次你應該承認你和劉豔老師有不正當的關繫了嗎？你看學生畢業相片上的合影這是多麼充分的證據。你們倆那麼親熱，捱得那麼緊，又是笑得那麼開心，同時還視着眼色，真是天配一雙！", "next": "你爲什麼和她捱得那麼緊呢？", "emotion": "surprise", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "49", "idx": 2, "speaker": "徐麗華", "text": "你爲什麼和她捱得那麼緊呢？", "prev": "哎喲，麗華，照畢業相是學校安排的事，至於我和劉豔老師坐在一起照嘛，這也是攝影師傅安排的。本來我就不想和劉豔老師坐在一起照，怕你有想法，但師傅早就安排好了我倆的座位，他說我和劉豔是同學們的正副班主任又是科任老師，我和她坐在一起這是名正言順的事，所以就這樣拍下來這張使你極其誤會的照片！", "next": "這是攝影師傅要求我們這樣做的，他說要想照出整體效果，需要大家互相配合才行！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "49", "idx": 3, "speaker": "左正鵬", "text": "這是攝影師傅要求我們這樣做的，他說要想照出整體效果，需要大家互相配合才行！", "prev": "你爲什麼和她捱得那麼緊呢？", "next": "你倆爲什麼又笑得那麼開心呢？孫校長和張主任又不像你倆那樣地笑？", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "49", "idx": 4, "speaker": "徐麗華", "text": "你倆爲什麼又笑得那麼開心呢？孫校長和張主任又不像你倆那樣地笑？", "prev": "這是攝影師傅要求我們這樣做的，他說要想照出整體效果，需要大家互相配合才行！", "next": "在拍攝的那一刻，師傅叫大家笑一點，再笑一點，所以我們就這麼笑了。關於笑嘛各有各的表情嗎！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "49", "idx": 5, "speaker": "左正鵬", "text": "在拍攝的那一刻，師傅叫大家笑一點，再笑一點，所以我們就這麼笑了。關於笑嘛各有各的表情嗎！", "prev": "你倆爲什麼又笑得那麼開心呢？孫校長和張主任又不像你倆那樣地笑？", "next": "啊！原來你們倆在表情，在互相傳遞愛情是嗎？", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "49", "idx": 6, "speaker": "徐麗華", "text": "啊！原來你們倆在表情，在互相傳遞愛情是嗎？", "prev": "在拍攝的那一刻，師傅叫大家笑一點，再笑一點，所以我們就這麼笑了。關於笑嘛各有各的表情嗎！", "next": "徐麗華這件事你要怎麼理解你就怎麼理解！反正我和劉豔之間是最清白的，今天我真是“秀才遇到兵，有理也是說不清”的事啦！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "49", "idx": 7, "speaker": "左正鵬", "text": "徐麗華這件事你要怎麼理解你就怎麼理解！反正我和劉豔之間是最清白的，今天我真是“秀才遇到兵，有理也是說不清”的事啦！", "prev": "啊！原來你們倆在表情，在互相傳遞愛情是嗎？", "next": "哎喲喲，你還先發了脾氣呢！這不是做賊人心虛了吧。你自己好好想想，全班那麼多同學你隨便找個座位坐坐不就行了嗎，爲什麼偏要和那個女妖精坐在一起照不可！這不是我說你，就是再傻的女人看了都會覺得你們倆是不正常的事！", "emotion": "disgust", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "49", "idx": 8, "speaker": "徐麗華", "text": "哎喲喲，你還先發了脾氣呢！這不是做賊人心虛了吧。你自己好好想想，全班那麼多同學你隨便找個座位坐坐不就行了嗎，爲什麼偏要和那個女妖精坐在一起照不可！這不是我說你，就是再傻的女人看了都會覺得你們倆是不正常的事！", "prev": "徐麗華這件事你要怎麼理解你就怎麼理解！反正我和劉豔之間是最清白的，今天我真是“秀才遇到兵，有理也是說不清”的事啦！", "next": "徐麗華，明天你如果又跑到學校去找劉老師胡鬧的話，我真的要和你離婚了，我覺得和你在一起生活已經失去了夫妻的意義，到那時你別後悔啊！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "49", "idx": 9, "speaker": "左正鵬", "text": "徐麗華，明天你如果又跑到學校去找劉老師胡鬧的話，我真的要和你離婚了，我覺得和你在一起生活已經失去了夫妻的意義，到那時你別後悔啊！", "prev": "哎喲喲，你還先發了脾氣呢！這不是做賊人心虛了吧。你自己好好想想，全班那麼多同學你隨便找個座位坐坐不就行了嗎，爲什麼偏要和那個女妖精坐在一起照不可！這不是我說你，就是再傻的女人看了都會覺得你們倆是不正常的事！", "next": "你別把“離婚”二次常掛在嘴邊。你別以爲我害怕和你離婚是嗎？真正離了你不一定不後悔呢！", "emotion": "disgust", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "49", "idx": 10, "speaker": "徐麗華", "text": "你別把“離婚”二次常掛在嘴邊。你別以爲我害怕和你離婚是嗎？真正離了你不一定不後悔呢！", "prev": "徐麗華，明天你如果又跑到學校去找劉老師胡鬧的話，我真的要和你離婚了，我覺得和你在一起生活已經失去了夫妻的意義，到那時你別後悔啊！", "next": "", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "50", "idx": 0, "speaker": "徐麗華", "text": "左正鵬你想和我離婚沒門兒，你的魂被劉豔那個狐狸精勾引去了是嗎？", "prev": "", "next": "你不離也得離，我被你整得太夠嗆啦，你趕快在協議上簽字吧。離了婚我們就不再是夫妻啦。你好，我也好，我們都自由了。", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "50", "idx": 1, "speaker": "左正鵬", "text": "你不離也得離，我被你整得太夠嗆啦，你趕快在協議上簽字吧。離了婚我們就不再是夫妻啦。你好，我也好，我們都自由了。", "prev": "左正鵬你想和我離婚沒門兒，你的魂被劉豔那個狐狸精勾引去了是嗎？", "next": "正鵬，我倆還是…….", "emotion": "angry", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "50", "idx": 2, "speaker": "徐麗華", "text": "正鵬，我倆還是…….", "prev": "你不離也得離，我被你整得太夠嗆啦，你趕快在協議上簽字吧。離了婚我們就不再是夫妻啦。你好，我也好，我們都自由了。", "next": "怎麼，你不願意離婚是嗎？那不行！", "emotion": "sadness", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "50", "idx": 3, "speaker": "左正鵬", "text": "怎麼，你不願意離婚是嗎？那不行！", "prev": "正鵬，我倆還是…….", "next": "請你看在我倆同學的份上吧！你有什麼要求可以向我提提吧！", "emotion": "angry", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "50", "idx": 4, "speaker": "徐麗華", "text": "請你看在我倆同學的份上吧！你有什麼要求可以向我提提吧！", "prev": "怎麼，你不願意離婚是嗎？那不行！", "next": "我的要求就是要和你徹底解除婚姻關係，你走你的陽關道，我過我的獨木橋！", "emotion": "sadness", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "50", "idx": 5, "speaker": "左正鵬", "text": "我的要求就是要和你徹底解除婚姻關係，你走你的陽關道，我過我的獨木橋！", "prev": "請你看在我倆同學的份上吧！你有什麼要求可以向我提提吧！", "next": "正鵬，我們還是不離婚吧！今後我一定聽你的話，保證不和你吵架啦，請你原諒我以前各種行爲吧！過去有些事可能是我一時想不開！使你受了委屈。今後我保證不去做使你不高興的事！", "emotion": "angry", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "50", "idx": 6, "speaker": "徐麗華", "text": "正鵬，我們還是不離婚吧！今後我一定聽你的話，保證不和你吵架啦，請你原諒我以前各種行爲吧！過去有些事可能是我一時想不開！使你受了委屈。今後我保證不去做使你不高興的事！", "prev": "我的要求就是要和你徹底解除婚姻關係，你走你的陽關道，我過我的獨木橋！", "next": "", "emotion": "sadness", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "51", "idx": 0, "speaker": "陳峯", "text": "李曉，你快過來呀！你看是誰在我箱子裏藏着兩碗熟肉！", "prev": "", "next": "陳峯，這還用問嗎？當然是我們隊長給我倆留下的，他肯定怕社員們知道，才偷偷地藏在你的衣箱裏了。", "emotion": "surprise", "relation": "李曉:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "51", "idx": 1, "speaker": "李曉", "text": "陳峯，這還用問嗎？當然是我們隊長給我倆留下的，他肯定怕社員們知道，才偷偷地藏在你的衣箱裏了。", "prev": "李曉，你快過來呀！你看是誰在我箱子裏藏着兩碗熟肉！", "next": "哎喲，隊長對我們知青太關心啦！", "emotion": "neutral", "relation": "陳峯:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "51", "idx": 2, "speaker": "陳峯", "text": "哎喲，隊長對我們知青太關心啦！", "prev": "陳峯，這還用問嗎？當然是我們隊長給我倆留下的，他肯定怕社員們知道，才偷偷地藏在你的衣箱裏了。", "next": "今天晚上我們到他家裏去道聲謝纔好！", "emotion": "happiness", "relation": "李曉:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "51", "idx": 3, "speaker": "李曉", "text": "今天晚上我們到他家裏去道聲謝纔好！", "prev": "哎喲，隊長對我們知青太關心啦！", "next": "", "emotion": "happiness", "relation": "陳峯:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "52", "idx": 0, "speaker": "左正鵬", "text": "麗華，小孩的分娩期還有多久？", "prev": "", "next": "大概在下個星期吧！", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "52", "idx": 1, "speaker": "徐麗華", "text": "大概在下個星期吧！", "prev": "麗華，小孩的分娩期還有多久？", "next": "哎喲，寶寶在動呢！", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "52", "idx": 2, "speaker": "左正鵬", "text": "哎喲，寶寶在動呢！", "prev": "大概在下個星期吧！", "next": "看你那樣子羞死人的！", "emotion": "happiness", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "52", "idx": 3, "speaker": "徐麗華", "text": "看你那樣子羞死人的！", "prev": "哎喲，寶寶在動呢！", "next": "急什麼，反正還有幾天時間，到時再說，你想早點當爸爸是嗎？", "emotion": "happiness", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "52", "idx": 4, "speaker": "徐麗華", "text": "急什麼，反正還有幾天時間，到時再說，你想早點當爸爸是嗎？", "prev": "看你那樣子羞死人的！", "next": "不行！到時候就來不及了，還是先去醫院幾天等着好些，我們這裏交通又不方便，如果真的遇上了麻煩事，困難就大了。", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "52", "idx": 5, "speaker": "左正鵬", "text": "不行！到時候就來不及了，還是先去醫院幾天等着好些，我們這裏交通又不方便，如果真的遇上了麻煩事，困難就大了。", "prev": "急什麼，反正還有幾天時間，到時再說，你想早點當爸爸是嗎？", "next": "", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "53", "idx": 0, "speaker": "徐麗華", "text": "正鵬，你快來呀，我腹部痛得難受得很呀，哎喲喲……", "prev": "", "next": "麗華，怎麼了，剛纔還好好的，怎麼一下子就壞了身子，莫非是寶寶要降臨了！", "emotion": "fear", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "53", "idx": 1, "speaker": "左正鵬", "text": "麗華，怎麼了，剛纔還好好的，怎麼一下子就壞了身子，莫非是寶寶要降臨了！", "prev": "正鵬，你快來呀，我腹部痛得難受得很呀，哎喲喲……", "next": "是的，肯定是寶寶要出生了，你快去找李婆婆，快去，趕快去呀！", "emotion": "surprise", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "53", "idx": 2, "speaker": "徐麗華", "text": "是的，肯定是寶寶要出生了，你快去找李婆婆，快去，趕快去呀！", "prev": "麗華，怎麼了，剛纔還好好的，怎麼一下子就壞了身子，莫非是寶寶要降臨了！", "next": "", "emotion": "surprise", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "54", "idx": 0, "speaker": "左正鵬", "text": "堂弟，快，快點，我妻子生小孩，難產了，快跟我幫忙將她擡到醫院去！", "prev": "", "next": "是什麼時候的事？", "emotion": "surprise", "relation": "堂弟:brothers and sisters", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "54", "idx": 1, "speaker": "堂弟", "text": "是什麼時候的事？", "prev": "堂弟，快，快點，我妻子生小孩，難產了，快跟我幫忙將她擡到醫院去！", "next": "剛發生不久，李婆婆還在我家呢！", "emotion": "surprise", "relation": "左正鵬:brothers and sisters", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "54", "idx": 2, "speaker": "左正鵬", "text": "剛發生不久，李婆婆還在我家呢！", "prev": "是什麼時候的事？", "next": "", "emotion": "surprise", "relation": "堂弟:brothers and sisters", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 0, "speaker": "向書記", "text": "正鵬，你來啦！我等你很久了。", "prev": "", "next": "您找我有事嗎？", "emotion": "neutral", "relation": "左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 1, "speaker": "左正鵬", "text": "您找我有事嗎？", "prev": "正鵬，你來啦！我等你很久了。", "next": "我早就想找你談話了，但一直沒時間，今天趁着沒事把你叫過來，如果再擱下去你的問題就大啦！", "emotion": "neutral", "relation": "向書記:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 2, "speaker": "向書記", "text": "我早就想找你談話了，但一直沒時間，今天趁着沒事把你叫過來，如果再擱下去你的問題就大啦！", "prev": "您找我有事嗎？", "next": "向書記，是不是有人向你反映我做錯了什麼事，或是我對教學工作不負責任？", "emotion": "neutral", "relation": "左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 3, "speaker": "左正鵬", "text": "向書記，是不是有人向你反映我做錯了什麼事，或是我對教學工作不負責任？", "prev": "我早就想找你談話了，但一直沒時間，今天趁着沒事把你叫過來，如果再擱下去你的問題就大啦！", "next": "這還用着別人向我反映嗎？我早就發現你的思想出現了大問題，並且，還是原則性的問題。", "emotion": "surprise", "relation": "向書記:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 4, "speaker": "向書記", "text": "這還用着別人向我反映嗎？我早就發現你的思想出現了大問題，並且，還是原則性的問題。", "prev": "向書記，是不是有人向你反映我做錯了什麼事，或是我對教學工作不負責任？", "next": "向書記，我在平日工作中有哪些做得不對，請您嚴肅批評、指正，我虛心接受，堅決改正!", "emotion": "neutral", "relation": "左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 5, "speaker": "左正鵬", "text": "向書記，我在平日工作中有哪些做得不對，請您嚴肅批評、指正，我虛心接受，堅決改正!", "prev": "這還用着別人向我反映嗎？我早就發現你的思想出現了大問題，並且，還是原則性的問題。", "next": "你不接受也得接受，不改正也得改正！左正鵬，你當上了民辦教師是因爲我們杏花村目前還沒有人才才便宜了你。可是，你不自知之明，卻忘記了自己是出生在地主家庭，你不注意自己世界觀的改造，居然還與知識青年搞起了男女關係。你可知道嗎？和女知識青年通姦與破壞軍婚的性質是同樣的嚴重。", "emotion": "neutral", "relation": "向書記:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 6, "speaker": "向書記", "text": "你不接受也得接受，不改正也得改正！左正鵬，你當上了民辦教師是因爲我們杏花村目前還沒有人才才便宜了你。可是，你不自知之明，卻忘記了自己是出生在地主家庭，你不注意自己世界觀的改造，居然還與知識青年搞起了男女關係。你可知道嗎？和女知識青年通姦與破壞軍婚的性質是同樣的嚴重。", "prev": "向書記，我在平日工作中有哪些做得不對，請您嚴肅批評、指正，我虛心接受，堅決改正!", "next": "向書記，我和知識青年沒有任何男女關係，蒼天可以爲我作證！", "emotion": "disgust", "relation": "左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 7, "speaker": "左正鵬", "text": "向書記，我和知識青年沒有任何男女關係，蒼天可以爲我作證！", "prev": "你不接受也得接受，不改正也得改正！左正鵬，你當上了民辦教師是因爲我們杏花村目前還沒有人才才便宜了你。可是，你不自知之明，卻忘記了自己是出生在地主家庭，你不注意自己世界觀的改造，居然還與知識青年搞起了男女關係。你可知道嗎？和女知識青年通姦與破壞軍婚的性質是同樣的嚴重。", "next": "混賬！你在事實面前還在狡辯！", "emotion": "neutral", "relation": "向書記:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 8, "speaker": "向書記", "text": "混賬！你在事實面前還在狡辯！", "prev": "向書記，我和知識青年沒有任何男女關係，蒼天可以爲我作證！", "next": "向書記，我是有妻之夫，再說，我是人民教師，怎麼會做出你說出的那種事來呢？請你尊重事實，調查清楚後再批評我不遲！", "emotion": "angry", "relation": "左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 9, "speaker": "左正鵬", "text": "向書記，我是有妻之夫，再說，我是人民教師，怎麼會做出你說出的那種事來呢？請你尊重事實，調查清楚後再批評我不遲！", "prev": "混賬！你在事實面前還在狡辯！", "next": "這還要浪費時間去調查嗎？無數事實已經證明你和劉豔老師有不正當關係，你還不承認，想讓貧下中農來檢舉你光彩些是嗎？不是我說你，社會上對你也早就有了不少的輿論。", "emotion": "surprise", "relation": "向書記:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 10, "speaker": "向書記", "text": "這還要浪費時間去調查嗎？無數事實已經證明你和劉豔老師有不正當關係，你還不承認，想讓貧下中農來檢舉你光彩些是嗎？不是我說你，社會上對你也早就有了不少的輿論。", "prev": "向書記，我是有妻之夫，再說，我是人民教師，怎麼會做出你說出的那種事來呢？請你尊重事實，調查清楚後再批評我不遲！", "next": "我和劉豔在工作上的交往是名正言順的事，哪個單位沒有男同志和女同志在一起談論工作？", "emotion": "angry", "relation": "左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 11, "speaker": "左正鵬", "text": "我和劉豔在工作上的交往是名正言順的事，哪個單位沒有男同志和女同志在一起談論工作？", "prev": "這還要浪費時間去調查嗎？無數事實已經證明你和劉豔老師有不正當關係，你還不承認，想讓貧下中農來檢舉你光彩些是嗎？不是我說你，社會上對你也早就有了不少的輿論。", "next": "這何止你和她談論工作？聽社員們說，前次你和劉豔在演《補鍋》時在舞臺上眉飛色舞，含情脈脈；你膀胱結石上醫院動手術，劉豔橫臥公路攔車送你去醫院；還有，星期天你爲劉豔檢修瓦面等等。這些事難道不是鐵證如山的證據嗎？這些事實不管你是主動的，或者是被動的，甚至是出於無奈。情節都是嚴重的！我老實告訴你，你的家庭出身不好，社會關係又複雜，還不注意自己身上的這些污點，還妄想欲爲，今後，你還要不要自己的前途？", "emotion": "surprise", "relation": "向書記:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 12, "speaker": "向書記", "text": "這何止你和她談論工作？聽社員們說，前次你和劉豔在演《補鍋》時在舞臺上眉飛色舞，含情脈脈；你膀胱結石上醫院動手術，劉豔橫臥公路攔車送你去醫院；還有，星期天你爲劉豔檢修瓦面等等。這些事難道不是鐵證如山的證據嗎？這些事實不管你是主動的，或者是被動的，甚至是出於無奈。情節都是嚴重的！我老實告訴你，你的家庭出身不好，社會關係又複雜，還不注意自己身上的這些污點，還妄想欲爲，今後，你還要不要自己的前途？", "prev": "我和劉豔在工作上的交往是名正言順的事，哪個單位沒有男同志和女同志在一起談論工作？", "next": "向書記，我好冤的，你指出的這些事其實都是些現象，根本不是它的本質。", "emotion": "angry", "relation": "左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 13, "speaker": "左正鵬", "text": "向書記，我好冤的，你指出的這些事其實都是些現象，根本不是它的本質。", "prev": "這何止你和她談論工作？聽社員們說，前次你和劉豔在演《補鍋》時在舞臺上眉飛色舞，含情脈脈；你膀胱結石上醫院動手術，劉豔橫臥公路攔車送你去醫院；還有，星期天你爲劉豔檢修瓦面等等。這些事難道不是鐵證如山的證據嗎？這些事實不管你是主動的，或者是被動的，甚至是出於無奈。情節都是嚴重的！我老實告訴你，你的家庭出身不好，社會關係又複雜，還不注意自己身上的這些污點，還妄想欲爲，今後，你還要不要自己的前途？", "next": "好啦，你別向我解釋了，再解釋也是沒有用的了，我已經跟你孫校長講好了，並且已經做出了決定：明天你馬上跟我回生產隊參加農業生產，不能再去當民辦教師了。你隊里正需要勞動力搞生產！", "emotion": "surprise", "relation": "向書記:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "55", "idx": 14, "speaker": "向書記", "text": "好啦，你別向我解釋了，再解釋也是沒有用的了，我已經跟你孫校長講好了，並且已經做出了決定：明天你馬上跟我回生產隊參加農業生產，不能再去當民辦教師了。你隊里正需要勞動力搞生產！", "prev": "向書記，我好冤的，你指出的這些事其實都是些現象，根本不是它的本質。", "next": "", "emotion": "angry", "relation": "左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "56", "idx": 0, "speaker": "左正鵬", "text": "劉豔，昨天，我從報紙上獲悉，今年國家已經恢復了高考招生制度，我倆去報考應試下吧！", "prev": "", "next": "我高中畢業快十一年啦，那些數、理、化，知識已經忘記完了，我沒有一點把握，同時我也沒有這個念想。你去吧！感謝你跟我透露這一消息！", "emotion": "surprise", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "56", "idx": 1, "speaker": "劉豔", "text": "我高中畢業快十一年啦，那些數、理、化，知識已經忘記完了，我沒有一點把握，同時我也沒有這個念想。你去吧！感謝你跟我透露這一消息！", "prev": "劉豔，昨天，我從報紙上獲悉，今年國家已經恢復了高考招生制度，我倆去報考應試下吧！", "next": "我也沒有多大把握，不過國家給了我們這些老三屆們的機會，我們就得珍惜。機不可失，失不再來呀！就算考不上，也沒問題的。", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "56", "idx": 2, "speaker": "左正鵬", "text": "我也沒有多大把握，不過國家給了我們這些老三屆們的機會，我們就得珍惜。機不可失，失不再來呀！就算考不上，也沒問題的。", "prev": "我高中畢業快十一年啦，那些數、理、化，知識已經忘記完了，我沒有一點把握，同時我也沒有這個念想。你去吧！感謝你跟我透露這一消息！", "next": "正鵬，你去，我幫你找複習資料！", "emotion": "happiness", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "56", "idx": 3, "speaker": "劉豔", "text": "正鵬，你去，我幫你找複習資料！", "prev": "我也沒有多大把握，不過國家給了我們這些老三屆們的機會，我們就得珍惜。機不可失，失不再來呀！就算考不上，也沒問題的。", "next": "劉豔，今後你就別跟我多來往了，免得向書記再找我的岔子。他跟我從講臺上撤了下來，我委屈得很那！", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "56", "idx": 4, "speaker": "左正鵬", "text": "劉豔，今後你就別跟我多來往了，免得向書記再找我的岔子。他跟我從講臺上撤了下來，我委屈得很那！", "prev": "正鵬，你去，我幫你找複習資料！", "next": "他那泥腿子幹部懂得什麼。心底狹窄，詭計多端，不可一世。我纔不怕他呢！", "emotion": "sadness", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "56", "idx": 5, "speaker": "劉豔", "text": "他那泥腿子幹部懂得什麼。心底狹窄，詭計多端，不可一世。我纔不怕他呢！", "prev": "劉豔，今後你就別跟我多來往了，免得向書記再找我的岔子。他跟我從講臺上撤了下來，我委屈得很那！", "next": "", "emotion": "disgust", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "57", "idx": 0, "speaker": "徐麗華", "text": "正鵬，今天你怎麼從工地上回來了，有事嗎？", "prev": "", "next": "我要去參加高考，你同意嗎？", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "57", "idx": 1, "speaker": "左正鵬", "text": "我要去參加高考，你同意嗎？", "prev": "正鵬，今天你怎麼從工地上回來了，有事嗎？", "next": "你就別想天鵝肉吃了，你已經是孩子的爸爸了還考什麼大學嘍！", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "57", "idx": 2, "speaker": "徐麗華", "text": "你就別想天鵝肉吃了，你已經是孩子的爸爸了還考什麼大學嘍！", "prev": "我要去參加高考，你同意嗎？", "next": "國家對考生的年齡放寬了，婚否也不受限制了。", "emotion": "disgust", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "57", "idx": 3, "speaker": "左正鵬", "text": "國家對考生的年齡放寬了，婚否也不受限制了。", "prev": "你就別想天鵝肉吃了，你已經是孩子的爸爸了還考什麼大學嘍！", "next": "你即使考上了大學，也是“範先生”中舉，沒多大意義了。你就死了這條心吧！", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "57", "idx": 4, "speaker": "徐麗華", "text": "你即使考上了大學，也是“範先生”中舉，沒多大意義了。你就死了這條心吧！", "prev": "國家對考生的年齡放寬了，婚否也不受限制了。", "next": "正鵬，這些資料對你很有用，你趕快抓緊時間，認真複習下，祝你高考及第！", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "57", "idx": 5, "speaker": "劉豔", "text": "正鵬，這些資料對你很有用，你趕快抓緊時間，認真複習下，祝你高考及第！", "prev": "你即使考上了大學，也是“範先生”中舉，沒多大意義了。你就死了這條心吧！", "next": "感謝你的關心和良好的祝願。我絕不辜負你的厚望！", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "57", "idx": 6, "speaker": "左正鵬", "text": "感謝你的關心和良好的祝願。我絕不辜負你的厚望！", "prev": "正鵬，這些資料對你很有用，你趕快抓緊時間，認真複習下，祝你高考及第！", "next": "", "emotion": "happiness", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "58", "idx": 0, "speaker": "左正鵬", "text": "陳峯，這次你爲什麼不去參加高考？", "prev": "", "next": "我是初中畢業生，那有資格參加，你別打擊我啦！", "emotion": "surprise", "relation": "陳峯:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "58", "idx": 1, "speaker": "陳峯", "text": "我是初中畢業生，那有資格參加，你別打擊我啦！", "prev": "陳峯，這次你爲什麼不去參加高考？", "next": "對不起，我問快了點請你不要介意！", "emotion": "neutral", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "58", "idx": 2, "speaker": "左正鵬", "text": "對不起，我問快了點請你不要介意！", "prev": "我是初中畢業生，那有資格參加，你別打擊我啦！", "next": "你考得怎樣，這一次有希望嗎？", "emotion": "surprise", "relation": "陳峯:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "58", "idx": 3, "speaker": "陳峯", "text": "你考得怎樣，這一次有希望嗎？", "prev": "對不起，我問快了點請你不要介意！", "next": "試卷都做完了，不知對錯如何，應該說沒問題吧！", "emotion": "neutral", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "58", "idx": 4, "speaker": "左正鵬", "text": "試卷都做完了，不知對錯如何，應該說沒問題吧！", "prev": "你考得怎樣，這一次有希望嗎？", "next": "", "emotion": "happiness", "relation": "陳峯:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "59", "idx": 0, "speaker": "左正鵬", "text": "小寶，真乖，長這麼大了，讓爸親親嘴嘍！", "prev": "", "next": "正鵬，你考上了沒有？", "emotion": "happiness", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "59", "idx": 1, "speaker": "徐麗華", "text": "正鵬，你考上了沒有？", "prev": "小寶，真乖，長這麼大了，讓爸親親嘴嘍！", "next": "哎喲，快三個月啦，家裏還沒有一點消息，你肯定沒有考上。告訴你不要去你不相信。大學那不是一般人能考上的。你是不到黃河心不甘！", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "59", "idx": 2, "speaker": "徐麗華", "text": "哎喲，快三個月啦，家裏還沒有一點消息，你肯定沒有考上。告訴你不要去你不相信。大學那不是一般人能考上的。你是不到黃河心不甘！", "prev": "正鵬，你考上了沒有？", "next": "看來已經是“名落孫山”了……", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "59", "idx": 3, "speaker": "左正鵬", "text": "看來已經是“名落孫山”了……", "prev": "哎喲，快三個月啦，家裏還沒有一點消息，你肯定沒有考上。告訴你不要去你不相信。大學那不是一般人能考上的。你是不到黃河心不甘！", "next": "", "emotion": "sadness", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 0, "speaker": "劉豔", "text": "誰呀？", "prev": "", "next": "哎喲！是正鵬來了，稀客，稀客。太好了，我正在跟你寫信呢，說曹操，曹操就到了！", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 1, "speaker": "劉豔", "text": "哎喲！是正鵬來了，稀客，稀客。太好了，我正在跟你寫信呢，說曹操，曹操就到了！", "prev": "誰呀？", "next": "你跟我寫信幹什麼，有事嗎？", "emotion": "happiness", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 2, "speaker": "左正鵬", "text": "你跟我寫信幹什麼，有事嗎？", "prev": "哎喲！是正鵬來了，稀客，稀客。太好了，我正在跟你寫信呢，說曹操，曹操就到了！", "next": "不就是問問你高考的情況。快三個月時間了，你的錄取通知怎麼還不下來？近來一段時間我又沒見到你，我心裏急死了。", "emotion": "neutral", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 3, "speaker": "劉豔", "text": "不就是問問你高考的情況。快三個月時間了，你的錄取通知怎麼還不下來？近來一段時間我又沒見到你，我心裏急死了。", "prev": "你跟我寫信幹什麼，有事嗎？", "next": "什麼錄取通知書，我肯定是沒考上！", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 4, "speaker": "左正鵬", "text": "什麼錄取通知書，我肯定是沒考上！", "prev": "不就是問問你高考的情況。快三個月時間了，你的錄取通知怎麼還不下來？近來一段時間我又沒見到你，我心裏急死了。", "next": "你不是說還考得可以嗎？", "emotion": "neutral", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 5, "speaker": "劉豔", "text": "你不是說還考得可以嗎？", "prev": "什麼錄取通知書，我肯定是沒考上！", "next": "那是我自己認爲的。你想想，全國那麼多考生，強中更有強中手呀！", "emotion": "surprise", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 6, "speaker": "左正鵬", "text": "那是我自己認爲的。你想想，全國那麼多考生，強中更有強中手呀！", "prev": "你不是說還考得可以嗎？", "next": "那也是，幸好我沒有去考，否則，更會出洋相的。", "emotion": "neutral", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 7, "speaker": "劉豔", "text": "那也是，幸好我沒有去考，否則，更會出洋相的。", "prev": "那是我自己認爲的。你想想，全國那麼多考生，強中更有強中手呀！", "next": "你聽見別人議論我什麼嗎？", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 8, "speaker": "左正鵬", "text": "你聽見別人議論我什麼嗎？", "prev": "那也是，幸好我沒有去考，否則，更會出洋相的。", "next": "除了我，村上其他社員都不知道你參加高考，就連向書記也矇在鼓裏頭呀！", "emotion": "neutral", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 9, "speaker": "劉豔", "text": "除了我，村上其他社員都不知道你參加高考，就連向書記也矇在鼓裏頭呀！", "prev": "你聽見別人議論我什麼嗎？", "next": "向書記不知道就好。他若知道了，那就更糟糕。", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 10, "speaker": "左正鵬", "text": "向書記不知道就好。他若知道了，那就更糟糕。", "prev": "除了我，村上其他社員都不知道你參加高考，就連向書記也矇在鼓裏頭呀！", "next": "那是爲什麼，你又不是做賊，是爲振興民族而讀書呀！", "emotion": "neutral", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 11, "speaker": "劉豔", "text": "那是爲什麼，你又不是做賊，是爲振興民族而讀書呀！", "prev": "向書記不知道就好。他若知道了，那就更糟糕。", "next": "就連民辦老師，向書記都不讓我當了，他還讓我考大學嗎？", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 12, "speaker": "左正鵬", "text": "就連民辦老師，向書記都不讓我當了，他還讓我考大學嗎？", "prev": "那是爲什麼，你又不是做賊，是爲振興民族而讀書呀！", "next": "正鵬，往後你還有什麼打算嗎？", "emotion": "disgust", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 13, "speaker": "劉豔", "text": "正鵬，往後你還有什麼打算嗎？", "prev": "就連民辦老師，向書記都不讓我當了，他還讓我考大學嗎？", "next": "明年繼續考！", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 14, "speaker": "左正鵬", "text": "明年繼續考！", "prev": "正鵬，往後你還有什麼打算嗎？", "next": "對！有恆心，事竟成！", "emotion": "neutral", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 15, "speaker": "劉豔", "text": "對！有恆心，事竟成！", "prev": "明年繼續考！", "next": "現在你立馬也開始複習，明年我們一起要參加高考，我們這些人一定要享受下黨的高等教育才行！", "emotion": "happiness", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 16, "speaker": "左正鵬", "text": "現在你立馬也開始複習，明年我們一起要參加高考，我們這些人一定要享受下黨的高等教育才行！", "prev": "對！有恆心，事竟成！", "next": "今年的高考試題難度大嗎？", "emotion": "happiness", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 17, "speaker": "劉豔", "text": "今年的高考試題難度大嗎？", "prev": "現在你立馬也開始複習，明年我們一起要參加高考，我們這些人一定要享受下黨的高等教育才行！", "next": "難度不太大，都是些基礎東西，問題是我們丟久了，又沒有很好去複習。你想到沒有，我們這些老三屆高中生，知識掌握得蠻牢固的，那些文革期的高中生，他們的知識能和我們比嗎？所以，我們也應該自信點，你說是嗎？", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 18, "speaker": "左正鵬", "text": "難度不太大，都是些基礎東西，問題是我們丟久了，又沒有很好去複習。你想到沒有，我們這些老三屆高中生，知識掌握得蠻牢固的，那些文革期的高中生，他們的知識能和我們比嗎？所以，我們也應該自信點，你說是嗎？", "prev": "今年的高考試題難度大嗎？", "next": "是，是，你把我的心說的癢癢的。明年我一定也要揮戈上陣試試，否則，枉了我讀書人的十年寒窗時間。", "emotion": "neutral", "relation": "劉豔:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "60", "idx": 19, "speaker": "劉豔", "text": "是，是，你把我的心說的癢癢的。明年我一定也要揮戈上陣試試，否則，枉了我讀書人的十年寒窗時間。", "prev": "難度不太大，都是些基礎東西，問題是我們丟久了，又沒有很好去複習。你想到沒有，我們這些老三屆高中生，知識掌握得蠻牢固的，那些文革期的高中生，他們的知識能和我們比嗎？所以，我們也應該自信點，你說是嗎？", "next": "", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "你要不要去吃午餐？", "prev": "", "next": "", "emotion": "平淡語氣", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "誒誒誒！我甄選上了！", "prev": "", "next": "", "emotion": "開心語調", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "我幾天身體好像有點不太舒服，肚子好痛", "prev": "", "next": "", "emotion": "悲傷語調", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "我的小專題組員都不做事，幹!超後悔跟他一組", "prev": "", "next": "", "emotion": "憤怒語調", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "他們是不是吵架了？不會打起來吧？", "prev": "", "next": "", "emotion": "平淡語氣", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "你知道嗎?我們班有人交女朋友誒!", "prev": "", "next": "", "emotion": "驚奇語調", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "幹！他真的有夠噁心，衛生習慣有夠差。", "prev": "", "next": "", "emotion": "厭惡語調", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "啊今天騎腳踏車你去不去？", "prev": "", "next": "", "emotion": "平淡語氣", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "我們今天班際籃球賽贏了！！！", "prev": "", "next": "", "emotion": "開心語調", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "今天我跟我朋友吵架了", "prev": "", "next": "", "emotion": "悲傷語調", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi logue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "我最喜歡的餐廳因為疫情關門了...", "prev": "", "next": "", "emotion": "悲傷語調", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "你覺得未來人類會移民火星嗎?", "prev": "", "next": "", "emotion": "平淡語氣", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "有人在網上冒充我詐騙!", "prev": "", "next": "", "emotion": "憤怒語調", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "我剛剛在舊衣服口袋裡找到一張中獎彩券!", "prev": "", "next": "", "emotion": "驚奇語調", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}, {"dataset": "Chinese Multi-Emotion Dialogue", "dialogue_id": "", "idx": 0, "speaker": "中文短句", "text": "我終於完成了我的第一本小說!", "prev": "", "next": "", "emotion": "開心語調", "relation": "", "source": "https://huggingface.co/datasets/Johnson8187/Chinese_Multi-Emotion_Dialogue_Dataset"}];
const stopChars = new Set('，。！？、,.!?：:；;“”"\'（）()[]【】\n\t 　');
const queryEl=document.getElementById('query'), datasetEl=document.getElementById('dataset'), topkEl=document.getElementById('topk'), resultsEl=document.getElementById('results'), statusEl=document.getElementById('status'), chatInput=document.getElementById('chatInput');
document.getElementById('countBadge').textContent = ITEMS.length + ' 条本地句子';
function chars(s){return Array.from(String(s||'').toLowerCase()).filter(c=>!stopChars.has(c));}
function bigrams(arr){const out=[]; for(let i=0;i<arr.length-1;i++) out.push(arr[i]+arr[i+1]); return out;}
function keywordBoost(q,t){let b=0; const groups=[['累','忙','困','休息'],['不合适','别联系','拒绝'],['失望','生气','每次'],['一起','想去','下次','店'],['喜欢','爱','想你']]; for(const g of groups){if(g.some(x=>q.includes(x))&&g.some(x=>t.includes(x))) b+=0.12;} return b;}
function score(q,item){const qc=chars(q), tc=chars(item.text+' '+item.prev+' '+item.next); if(!qc.length||!tc.length) return 0; const qset=new Set(qc), tset=new Set(tc); let inter=0; qset.forEach(c=>{if(tset.has(c)) inter++}); const charScore=inter/Math.max(qset.size,1); const qb=new Set(bigrams(qc)), tb=new Set(bigrams(tc)); let bi=0; qb.forEach(x=>{if(tb.has(x)) bi++}); const biScore=qb.size?bi/qb.size:0; const contain=item.text.includes(q)||q.includes(item.text)?0.25:0; return charScore*0.45+biScore*0.35+keywordBoost(q,item.text+item.prev+item.next)+contain;}
function search(){const q=queryEl.value.trim(); if(!q){resultsEl.innerHTML='<div class="empty">先输入一句话。</div>';return;} const ds=datasetEl.value; const pool=ITEMS.filter(x=>ds==='全部中文数据'||x.dataset===ds); const ranked=pool.map(x=>({...x,_score:score(q,x)})).filter(x=>x._score>0).sort((a,b)=>b._score-a._score).slice(0,Number(topkEl.value)); render(q,ranked);}
function render(q,rows){statusEl.textContent = rows.length ? `找到 ${rows.length} 条相似片段` : '没有找到明显相似片段'; if(!rows.length){resultsEl.innerHTML='<div class="empty">没有匹配结果。换个更短的关键词试试。</div>';return;} const best=rows[0]; const reply=best.next || best.text; resultsEl.innerHTML = `<div class="answer"><h2>参考回复</h2><p>${esc(reply)}</p><div class="warn" style="margin-top:8px">来自最相似片段的下一句/相邻句，只供参考。</div></div>` + rows.map((x,i)=>`<article class="match"><div class="match-top"><div class="source">${i+1}. ${esc(x.dataset)} · ${esc(x.dialogue_id||'短句')}</div><div class="score">${Math.round(x._score*100)}%</div></div><div class="turns">${x.prev?`<div class="bubble prev">上文：${esc(x.prev)}</div>`:''}<div class="bubble hit">命中：${esc(x.text)}</div>${x.next?`<div class="bubble next">下句：${esc(x.next)}</div>`:''}</div><div class="meta">${x.emotion?`<span class="pill">情绪 ${esc(x.emotion)}</span>`:''}${x.relation?`<span class="pill">关系 ${esc(x.relation)}</span>`:''}<span class="pill">speaker ${esc(x.speaker||'-')}</span></div></article>`).join('');}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
document.getElementById('searchBtn').onclick=search; document.getElementById('sendBtn').onclick=()=>{if(chatInput.value.trim()){queryEl.value=chatInput.value.trim(); chatInput.value=''; search();}}; chatInput.addEventListener('keydown',e=>{if(e.key==='Enter') document.getElementById('sendBtn').click();}); document.getElementById('clearBtn').onclick=()=>{queryEl.value=''; resultsEl.innerHTML='<div class="empty">已清空。</div>'; statusEl.textContent='等待输入';}; document.querySelectorAll('.sample').forEach(b=>b.onclick=()=>{queryEl.value=b.childNodes[0].textContent.trim();search();});
search();
</script>
