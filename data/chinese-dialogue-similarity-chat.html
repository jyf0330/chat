<body>
<div class="app">
  <header><div><h1>中文对话相似度聊天 Demo</h1><div class="sub">只基于本地公开样例做相似检索，不训练、不联网、不装作理解你。</div></div><div class="badge" id="countBadge"></div></header>
  <main>
    <section class="panel"><div class="head"><div><div class="title">输入</div><div class="note">一句话也可以搜</div></div></div><div class="body">
      <label>你想回复/续聊的话<textarea id="query">最近真的有点累，改天再说吧。</textarea></label>
      <div class="row"><label>数据源<select id="dataset"><option>全部中文数据</option><option>CPED 中文个性情感对话</option><option>Dialogue-MPDD 中文情绪关系对话</option><option>Chinese Multi-Emotion Dialogue</option></select></label><label>返回数量<select id="topk"><option>3</option><option selected>5</option><option>8</option><option>12</option></select></label></div>
      <div class="actions"><button class="primary" id="searchBtn">找相似对话</button><button class="ghost" id="clearBtn">清空对话</button></div>
      <div><div class="title" style="margin-bottom:8px">示例</div><div class="samples"><button class="sample">你最近是不是很忙啊<span>查冷淡/疲惫回应</span></button><button class="sample">我觉得我们不合适<span>查拒绝/边界</span></button><button class="sample">那家店我也想去<span>查邀约承接</span></button><button class="sample">你每次都这样让我很失望<span>查冲突修复</span></button></div></div>
      <div class="warn">边界：这里返回的是“相似公开样例”和“参考下一句”，不是情感判断，也不是模型生成。</div>
    </div></section>
    <section class="panel workspace"><div class="head"><div><div class="title">相似结果</div><div class="note" id="status">等待输入</div></div></div><div class="results" id="results"></div><div class="chatbar"><input id="chatInput" placeholder="继续输入一句，加入检索聊天"><button class="primary" id="sendBtn">发送</button></div></section>
  </main>
</div>

logue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "2", "idx": 0, "speaker": "堂弟", "text": "正鵬哥，聽村上人講昨天你娶了個嫂子？", "prev": "", "next": "是我的同學來我家玩玩，你不要聽他們亂說，這些人眼光淺，愛說閒話的。", "emotion": "surprise", "relation": "左正鵬:brothers and sisters", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "2", "idx": 1, "speaker": "左正鵬", "text": "是我的同學來我家玩玩，你不要聽他們亂說，這些人眼光淺，愛說閒話的。", "prev": "正鵬哥，聽村上人講昨天你娶了個嫂子？", "next": "正鵬哥，你倆有沒有那意思呀？就是有意思也沒問題吧！你反正遲早要娶媳婦的。", "emotion": "disgust", "relation": "堂弟:brothers and sisters", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "2", "idx": 2, "speaker": "堂弟", "text": "正鵬哥，你倆有沒有那意思呀？就是有意思也沒問題吧！你反正遲早要娶媳婦的。", "prev": "是我的同學來我家玩玩，你不要聽他們亂說，這些人眼光淺，愛說閒話的。", "next": "哎呀，堂弟，沒有的。我是那號人嗎？我倆是同學！同學之間只是互相走走的事嘛！", "emotion": "neutral", "relation": "左正鵬:brothers and sisters", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "2", "idx": 3, "speaker": "左正鵬", "text": "哎呀，堂弟，沒有的。我是那號人嗎？我倆是同學！同學之間只是互相走走的事嘛！", "prev": "正鵬哥，你倆有沒有那意思呀？就是有意思也沒問題吧！你反正遲早要娶媳婦的。", "next": "", "emotion": "neutral", "relation": "堂弟:brothers and sisters", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "3", "idx": 0, "speaker": "左正鵬", "text": "媽，今天是星期天我想去趕下集，可能下午才能回家，有什麼事就別等我！", "prev": "", "next": "去趕集？你別騙我！你是想去那個憨同學家我還不知道嗎？", "emotion": "neutral", "relation": "左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "3", "idx": 1, "speaker": "左母", "text": "去趕集？你別騙我！你是想去那個憨同學家我還不知道嗎？", "prev": "媽，今天是星期天我想去趕下集，可能下午才能回家，有什麼事就別等我！", "next": "我是想去麗華同學家裏一下。", "emotion": "angry", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "3", "idx": 2, "speaker": "左正鵬", "text": "我是想去麗華同學家裏一下。", "prev": "去趕集？你別騙我！你是想去那個憨同學家我還不知道嗎？", "next": "正鵬，你要給她的父母買點禮物啊！在她家裏也不要亂說話，要注意禮貌。", "emotion": "neutral", "relation": "左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "3", "idx": 3, "speaker": "左父", "text": "正鵬，你要給她的父母買點禮物啊！在她家裏也不要亂說話，要注意禮貌。", "prev": "我是想去麗華同學家裏一下。", "next": "爸，我會注意的，你放心！", "emotion": "neutral", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "3", "idx": 4, "speaker": "左正鵬", "text": "爸，我會注意的，你放心！", "prev": "正鵬，你要給她的父母買點禮物啊！在她家裏也不要亂說話，要注意禮貌。", "next": "", "emotion": "neutral", "relation": "左父:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "4", "idx": 0, "speaker": "左正鵬", "text": "伯母、您好，我是你麗華的同學呀！", "prev": "", "next": "小左，快請進，屋裏坐！屋裏坐！我早就聽到閨女講到你的情況，我們歡迎你呀！", "emotion": "happiness", "relation": "徐母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "4", "idx": 1, "speaker": "徐母", "text": "小左，快請進，屋裏坐！屋裏坐！我早就聽到閨女講到你的情況，我們歡迎你呀！", "prev": "伯母、您好，我是你麗華的同學呀！", "next": "老伴，你到代銷店裏去買瓶酒來，什麼“清明露”的都行。快去快回啊！", "emotion": "happiness", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "4", "idx": 2, "speaker": "徐母", "text": "老伴，你到代銷店裏去買瓶酒來，什麼“清明露”的都行。快去快回啊！", "prev": "小左，快請進，屋裏坐！屋裏坐！我早就聽到閨女講到你的情況，我們歡迎你呀！", "next": "", "emotion": "neutral", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "5", "idx": 0, "speaker": "徐麗華", "text": "正鵬，今天我父母說的話你都聽清楚了嗎？現在你應該向我表個明確的態纔好！", "prev": "", "next": "向你表個什麼明確的態？", "emotion": "neutral", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "5", "idx": 1, "speaker": "左正鵬", "text": "向你表個什麼明確的態？", "prev": "正鵬，今天我父母說的話你都聽清楚了嗎？現在你應該向我表個明確的態纔好！", "next": "正鵬，你還裝朦朧是嗎？你還是不是男子漢？", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "5", "idx": 2, "speaker": "徐麗華", "text": "正鵬，你還裝朦朧是嗎？你還是不是男子漢？", "prev": "向你表個什麼明確的態？", "next": "麗華，“五·四”那天，我們公社開慶祝大會。上午九點前我在公社門前公路邊等你，你不要失約，到時我倆再說吧！", "emotion": "angry", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "5", "idx": 3, "speaker": "左正鵬", "text": "麗華，“五·四”那天，我們公社開慶祝大會。上午九點前我在公社門前公路邊等你，你不要失約，到時我倆再說吧！", "prev": "正鵬，你還裝朦朧是嗎？你還是不是男子漢？", "next": "這麼簡單的事情，你爲什麼非得那天回答我？你真是婆婆媽媽的。", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "5", "idx": 4, "speaker": "徐麗華", "text": "這麼簡單的事情，你爲什麼非得那天回答我？你真是婆婆媽媽的。", "prev": "麗華，“五·四”那天，我們公社開慶祝大會。上午九點前我在公社門前公路邊等你，你不要失約，到時我倆再說吧！", "next": "麗華呀！希你對我還要作更進一步地瞭解。切莫感情用事，婚姻問題是自己人生的大問題，一旦處理不好會給自己帶來終生的痛苦！", "emotion": "disgust", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "5", "idx": 5, "speaker": "左正鵬", "text": "麗華呀！希你對我還要作更進一步地瞭解。切莫感情用事，婚姻問題是自己人生的大問題，一旦處理不好會給自己帶來終生的痛苦！", "prev": "這麼簡單的事情，你爲什麼非得那天回答我？你真是婆婆媽媽的。", "next": "正鵬，我父母表示沒意見，我自己也吃下了定心丸。我願意嫁給你。", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "5", "idx": 6, "speaker": "徐麗華", "text": "正鵬，我父母表示沒意見，我自己也吃下了定心丸。我願意嫁給你。", "prev": "麗華呀！希你對我還要作更進一步地瞭解。切莫感情用事，婚姻問題是自己人生的大問題，一旦處理不好會給自己帶來終生的痛苦！", "next": "麗華，可你還得考慮下我的百分之五十呀！", "emotion": "neutral", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "5", "idx": 7, "speaker": "左正鵬", "text": "麗華，可你還得考慮下我的百分之五十呀！", "prev": "正鵬，我父母表示沒意見，我自己也吃下了定心丸。我願意嫁給你。", "next": "麗華，小左，你倆快回去，你爸爸喝醉了，在家裏鬧酒。酒席早被他掀翻了，現在又在使勁地砸東西，“大鬧天空”。", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "5", "idx": 8, "speaker": "徐母", "text": "麗華，小左，你倆快回去，你爸爸喝醉了，在家裏鬧酒。酒席早被他掀翻了，現在又在使勁地砸東西，“大鬧天空”。", "prev": "麗華，可你還得考慮下我的百分之五十呀！", "next": "", "emotion": "surprise", "relation": "左正鵬:parent-in-law，徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "6", "idx": 0, "speaker": "徐父", "text": "是嗎，舊的不爛，新的不會來嘛！我還要繼續砸呢！", "prev": "", "next": "我怎麼不敢，你別小看我！你認爲我是一般的人嗎？", "emotion": "angry", "relation": "左正鵬:parent-in-law，徐母:spouse，徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "6", "idx": 1, "speaker": "徐父", "text": "我怎麼不敢，你別小看我！你認爲我是一般的人嗎？", "prev": "是嗎，舊的不爛，新的不會來嘛！我還要繼續砸呢！", "next": "爸，你在幹什麼呀，你怎麼這樣傻呀，廚屋裏的東西被你砸爛完了，明天媽媽怎麼做炊呢？", "emotion": "angry", "relation": "左正鵬:parent-in-law，徐母:spouse，徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "6", "idx": 2, "speaker": "徐麗華", "text": "爸，你在幹什麼呀，你怎麼這樣傻呀，廚屋裏的東西被你砸爛完了，明天媽媽怎麼做炊呢？", "prev": "我怎麼不敢，你別小看我！你認爲我是一般的人嗎？", "next": "誰說我傻呀，“酒醉聰明人，飯脹癡呆子”，你懂嗎？", "emotion": "disgust", "relation": "徐父:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "6", "idx": 3, "speaker": "徐父", "text": "誰說我傻呀，“酒醉聰明人，飯脹癡呆子”，你懂嗎？", "prev": "爸，你在幹什麼呀，你怎麼這樣傻呀，廚屋裏的東西被你砸爛完了，明天媽媽怎麼做炊呢？", "next": "伯父，你快到牀上去躺着，休息下啊！", "emotion": "neutral", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "6", "idx": 4, "speaker": "左正鵬", "text": "伯父，你快到牀上去躺着，休息下啊！", "prev": "誰說我傻呀，“酒醉聰明人，飯脹癡呆子”，你懂嗎？", "next": "小左，你還在這裏沒有走？你聽說嗎“酒中無語真君子，財上分明大丈夫”。我不是“真君子”，你是我閨女的“大丈夫”。哈哈！哈哈！大丈夫，“真君子”都是好人嘍。", "emotion": "surprise", "relation": "徐父:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "6", "idx": 5, "speaker": "徐父", "text": "小左，你還在這裏沒有走？你聽說嗎“酒中無語真君子，財上分明大丈夫”。我不是“真君子”，你是我閨女的“大丈夫”。哈哈！哈哈！大丈夫，“真君子”都是好人嘍。", "prev": "伯父，你快到牀上去躺着，休息下啊！", "next": "明天你自己做飯，反正廚屋裏沒有炊具啦！", "emotion": "happiness", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "6", "idx": 6, "speaker": "徐母", "text": "明天你自己做飯，反正廚屋裏沒有炊具啦！", "prev": "小左，你還在這裏沒有走？你聽說嗎“酒中無語真君子，財上分明大丈夫”。我不是“真君子”，你是我閨女的“大丈夫”。哈哈！哈哈！大丈夫，“真君子”都是好人嘍。", "next": "我還要忠告你們：“做官莫向前，作客莫在後”，這是“增廣賢文”書上說的！你們知道嗎？", "emotion": "disgust", "relation": "徐父:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "6", "idx": 7, "speaker": "徐父", "text": "我還要忠告你們：“做官莫向前，作客莫在後”，這是“增廣賢文”書上說的！你們知道嗎？", "prev": "明天你自己做飯，反正廚屋裏沒有炊具啦！", "next": "", "emotion": "neutral", "relation": "左正鵬:parent-in-law，徐母:spouse，徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "7", "idx": 0, "speaker": "左母", "text": "正鵬，今天你到那個憨同學家裏，她父母跟你說了些什麼？她自己呢？", "prev": "", "next": "媽，我今天去她家裏只作同學之間的正常往來，誰知道她的父母把我看成和她女兒在談戀愛。她女兒還明確表態要嫁給我，我表態不接受她。我答應她在“五·四”那天再講！", "emotion": "surprise", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "7", "idx": 1, "speaker": "左正鵬", "text": "媽，我今天去她家裏只作同學之間的正常往來，誰知道她的父母把我看成和她女兒在談戀愛。她女兒還明確表態要嫁給我，我表態不接受她。我答應她在“五·四”那天再講！", "prev": "正鵬，今天你到那個憨同學家裏，她父母跟你說了些什麼？她自己呢？", "next": "傻孩子，別人女孩子既然找上門來了，這是求之不得的好", "emotion": "neutral", "relation": "左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "7", "idx": 2, "speaker": "左母", "text": "傻孩子，別人女孩子既然找上門來了，這是求之不得的好", "prev": "媽，我今天去她家裏只作同學之間的正常往來，誰知道她的父母把我看成和她女兒在談戀愛。她女兒還明確表態要嫁給我，我表態不接受她。我答應她在“五·四”那天再講！", "next": "媽，請您彆着急，讓我認真地再考慮下。", "emotion": "surprise", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "7", "idx": 3, "speaker": "左正鵬", "text": "媽，請您彆着急，讓我認真地再考慮下。", "prev": "傻孩子，別人女孩子既然找上門來了，這是求之不得的好", "next": "", "emotion": "neutral", "relation": "左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 0, "speaker": "左父", "text": "還考慮什麼，村裏比你還小的後生家都當爸爸了，你還認爲自己還小是嗎？我同意你媽媽的意見，就這麼定下啦！", "prev": "", "next": "正鵬，你來多久啦？真是個青年積極分子！讓你久等了！", "emotion": "neutral", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 1, "speaker": "徐麗華", "text": "正鵬，你來多久啦？真是個青年積極分子！讓你久等了！", "prev": "還考慮什麼，村裏比你還小的後生家都當爸爸了，你還認爲自己還小是嗎？我同意你媽媽的意見，就這麼定下啦！", "next": "麗華，今天我約你來這裏我想好好和你談談。不然的話你真的要後悔！", "emotion": "surprise", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 2, "speaker": "左正鵬", "text": "麗華，今天我約你來這裏我想好好和你談談。不然的話你真的要後悔！", "prev": "正鵬，你來多久啦？真是個青年積極分子！讓你久等了！", "next": "我告訴你不後悔就不後悔的！不過你說你自己還有百分之五十嘛，我還是理解你的。這也是你自己的權力吧！", "emotion": "neutral", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 3, "speaker": "徐麗華", "text": "我告訴你不後悔就不後悔的！不過你說你自己還有百分之五十嘛，我還是理解你的。這也是你自己的權力吧！", "prev": "麗華，今天我約你來這裏我想好好和你談談。不然的話你真的要後悔！", "next": "麗華，我的百分之五十不是說你不配我，而是我總覺得我自身存在着許多的缺點。害怕結婚後連累你，使你受苦，過不好日子，你明白嗎？", "emotion": "neutral", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 4, "speaker": "左正鵬", "text": "麗華，我的百分之五十不是說你不配我，而是我總覺得我自身存在着許多的缺點。害怕結婚後連累你，使你受苦，過不好日子，你明白嗎？", "prev": "我告訴你不後悔就不後悔的！不過你說你自己還有百分之五十嘛，我還是理解你的。這也是你自己的權力吧！", "next": "正鵬，你就別拐彎抹角啦！你對我倆的事到底是怎麼想的，你直說出來給我聽聽！", "emotion": "fear", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 5, "speaker": "徐麗華", "text": "正鵬，你就別拐彎抹角啦！你對我倆的事到底是怎麼想的，你直說出來給我聽聽！", "prev": "麗華，我的百分之五十不是說你不配我，而是我總覺得我自身存在着許多的缺點。害怕結婚後連累你，使你受苦，過不好日子，你明白嗎？", "next": "麗華，“男大當婚，女大當嫁”，這是人間正常的事情。不過我對此有如下想法：第一、現在我倆都還年輕，正是學知識，追求理想和前途的時候，如果過早的將自己的婚姻訂了下來，今後我倆就沒有什麼奔頭了。第二、我家庭條件很差，父母都老了，我的負擔很重，我不願去拖累你呀。第三、去年我在醫院做了“胃穿孔”切除手術。醫生再三囑咐我今後不能乾重體力勞動。如果你嫁給了我，你能過着好日子嗎？第四、我家庭出生不好，我是地主家庭的子弟，而你是貧下中農的子女。從政治條件來看，我是不配你的。黨的政策也有規定：地主子弟是不能和貧下中農子女聯姻的，這在社會上已經形成了共識。這是原則問題呀！麗華，我這些缺點也就是我考慮百分之五十的內容。我如果不說給你聽，你父母是不知道的。到了那時，你父母會責備你的呀！說你是賤骨頭。", "emotion": "surprise", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 6, "speaker": "左正鵬", "text": "麗華，“男大當婚，女大當嫁”，這是人間正常的事情。不過我對此有如下想法：第一、現在我倆都還年輕，正是學知識，追求理想和前途的時候，如果過早的將自己的婚姻訂了下來，今後我倆就沒有什麼奔頭了。第二、我家庭條件很差，父母都老了，我的負擔很重，我不願去拖累你呀。第三、去年我在醫院做了“胃穿孔”切除手術。醫生再三囑咐我今後不能乾重體力勞動。如果你嫁給了我，你能過着好日子嗎？第四、我家庭出生不好，我是地主家庭的子弟，而你是貧下中農的子女。從政治條件來看，我是不配你的。黨的政策也有規定：地主子弟是不能和貧下中農子女聯姻的，這在社會上已經形成了共識。這是原則問題呀！麗華，我這些缺點也就是我考慮百分之五十的內容。我如果不說給你聽，你父母是不知道的。到了那時，你父母會責備你的呀！說你是賤骨頭。", "prev": "正鵬，你就別拐彎抹角啦！你對我倆的事到底是怎麼想的，你直說出來給我聽聽！", "next": "麗華，你別哭，我特別理解你的心情，感謝你對我的信任和真誠的愛。但你還要知道的是愛一個人是要有責任的，同時還要付出一定的代價！請你對我所說的這些三思而行吧！最好你還是另攀高門，今後你就別再提起我們這件事了！祝你幸福吧！我們往後還是最好的同學和朋友！", "emotion": "sadness", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 7, "speaker": "左正鵬", "text": "麗華，你別哭，我特別理解你的心情，感謝你對我的信任和真誠的愛。但你還要知道的是愛一個人是要有責任的，同時還要付出一定的代價！請你對我所說的這些三思而行吧！最好你還是另攀高門，今後你就別再提起我們這件事了！祝你幸福吧！我們往後還是最好的同學和朋友！", "prev": "麗華，“男大當婚，女大當嫁”，這是人間正常的事情。不過我對此有如下想法：第一、現在我倆都還年輕，正是學知識，追求理想和前途的時候，如果過早的將自己的婚姻訂了下來，今後我倆就沒有什麼奔頭了。第二、我家庭條件很差，父母都老了，我的負擔很重，我不願去拖累你呀。第三、去年我在醫院做了“胃穿孔”切除手術。醫生再三囑咐我今後不能乾重體力勞動。如果你嫁給了我，你能過着好日子嗎？第四、我家庭出生不好，我是地主家庭的子弟，而你是貧下中農的子女。從政治條件來看，我是不配你的。黨的政策也有規定：地主子弟是不能和貧下中農子女聯姻的，這在社會上已經形成了共識。這是原則問題呀！麗華，我這些缺點也就是我考慮百分之五十的內容。我如果不說給你聽，你父母是不知道的。到了那時，你父母會責備你的呀！說你是賤骨頭。", "next": "正鵬，儘管你對我怎樣解釋都改變不了我對你的愛。雖然你的出生不好這是你沒辦法的事。毛主席說過“出生不由己，道路可選擇”嗎？至於你作了“胃穿孔”切除手術這就更是我對你關心和同情的地方。我願意與你“風雨同舟”，“患難與共”。你也別認爲家庭困難而自卑。困難都是暫時的。只要我倆今後有雙勤勞的雙手，什麼困難都是能克服的。再說我村子的人都知道了我已嫁給了你，你說這話已經傳出去了誰又能收回來呢？你就不考慮下我的感受嗎？你還不知道的是：我今天早晨離家的時候，我父親再三叮囑我，叫你散會以後一定去我家一趟，說有重要事情同你商量！", "emotion": "sadness", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 8, "speaker": "徐麗華", "text": "正鵬，儘管你對我怎樣解釋都改變不了我對你的愛。雖然你的出生不好這是你沒辦法的事。毛主席說過“出生不由己，道路可選擇”嗎？至於你作了“胃穿孔”切除手術這就更是我對你關心和同情的地方。我願意與你“風雨同舟”，“患難與共”。你也別認爲家庭困難而自卑。困難都是暫時的。只要我倆今後有雙勤勞的雙手，什麼困難都是能克服的。再說我村子的人都知道了我已嫁給了你，你說這話已經傳出去了誰又能收回來呢？你就不考慮下我的感受嗎？你還不知道的是：我今天早晨離家的時候，我父親再三叮囑我，叫你散會以後一定去我家一趟，說有重要事情同你商量！", "prev": "麗華，你別哭，我特別理解你的心情，感謝你對我的信任和真誠的愛。但你還要知道的是愛一個人是要有責任的，同時還要付出一定的代價！請你對我所說的這些三思而行吧！最好你還是另攀高門，今後你就別再提起我們這件事了！祝你幸福吧！我們往後還是最好的同學和朋友！", "next": "有什麼重要事情同我商量？你傳達下不就行了嗎，何必我非去不可！", "emotion": "sadness", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 9, "speaker": "左正鵬", "text": "有什麼重要事情同我商量？你傳達下不就行了嗎，何必我非去不可！", "prev": "正鵬，儘管你對我怎樣解釋都改變不了我對你的愛。雖然你的出生不好這是你沒辦法的事。毛主席說過“出生不由己，道路可選擇”嗎？至於你作了“胃穿孔”切除手術這就更是我對你關心和同情的地方。我願意與你“風雨同舟”，“患難與共”。你也別認爲家庭困難而自卑。困難都是暫時的。只要我倆今後有雙勤勞的雙手，什麼困難都是能克服的。再說我村子的人都知道了我已嫁給了你，你說這話已經傳出去了誰又能收回來呢？你就不考慮下我的感受嗎？你還不知道的是：我今天早晨離家的時候，我父親再三叮囑我，叫你散會以後一定去我家一趟，說有重要事情同你商量！", "next": "他們大人的事情我怎麼知道！", "emotion": "surprise", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 10, "speaker": "徐麗華", "text": "他們大人的事情我怎麼知道！", "prev": "有什麼重要事情同我商量？你傳達下不就行了嗎，何必我非去不可！", "next": "麗華，我該說的都說跟你聽了，你還執迷不悟呀！", "emotion": "surprise", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 11, "speaker": "左正鵬", "text": "麗華，我該說的都說跟你聽了，你還執迷不悟呀！", "prev": "他們大人的事情我怎麼知道！", "next": "正鵬，我凡認準的事是任何人都改變不了我的決定！", "emotion": "disgust", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 12, "speaker": "徐麗華", "text": "正鵬，我凡認準的事是任何人都改變不了我的決定！", "prev": "麗華，我該說的都說跟你聽了，你還執迷不悟呀！", "next": "麗華，今天你到底要我怎樣？請你給我留點空間行嗎？", "emotion": "neutral", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 13, "speaker": "左正鵬", "text": "麗華，今天你到底要我怎樣？請你給我留點空間行嗎？", "prev": "正鵬，我凡認準的事是任何人都改變不了我的決定！", "next": "正鵬，你也應該明白，我對你死心踏地的追求也是對你的關心和呵護呀！", "emotion": "disgust", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 14, "speaker": "徐麗華", "text": "正鵬，你也應該明白，我對你死心踏地的追求也是對你的關心和呵護呀！", "prev": "麗華，今天你到底要我怎樣？請你給我留點空間行嗎？", "next": "正鵬，今天你如果不答應我，你不論走到哪裏，我就跟着你走到那裏。", "emotion": "neutral", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 15, "speaker": "徐麗華", "text": "正鵬，今天你如果不答應我，你不論走到哪裏，我就跟着你走到那裏。", "prev": "正鵬，你也應該明白，我對你死心踏地的追求也是對你的關心和呵護呀！", "next": "散會後我去你家行了吧？唉！女人給這個世界帶來了麻煩，但這個世界沒有女人又不行……", "emotion": "neutral", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 16, "speaker": "左正鵬", "text": "散會後我去你家行了吧？唉！女人給這個世界帶來了麻煩，但這個世界沒有女人又不行……", "prev": "正鵬，今天你如果不答應我，你不論走到哪裏，我就跟着你走到那裏。", "next": "女人給你們男人帶來了什麼麻煩？還不是爲了成一個家嗎？", "emotion": "disgust", "relation": "徐麗華:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "8", "idx": 17, "speaker": "徐麗華", "text": "女人給你們男人帶來了什麼麻煩？還不是爲了成一個家嗎？", "prev": "散會後我去你家行了吧？唉！女人給這個世界帶來了麻煩，但這個世界沒有女人又不行……", "next": "", "emotion": "neutral", "relation": "左正鵬:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 0, "speaker": "左正鵬", "text": "伯父、伯母，您們今天叫我來有什麼指教？", "prev": "", "next": "小左，你快坐下，事情是這樣的：昨天我和閨女她媽作了商量，你和麗華的年齡也不小啦！我們單方有個提議，你倆的婚慶吉日就定在今年的“元旦”節，你看如何？", "emotion": "neutral", "relation": "徐父:son/daughter-in-law，徐母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 1, "speaker": "徐父", "text": "小左，你快坐下，事情是這樣的：昨天我和閨女她媽作了商量，你和麗華的年齡也不小啦！我們單方有個提議，你倆的婚慶吉日就定在今年的“元旦”節，你看如何？", "prev": "伯父、伯母，您們今天叫我來有什麼指教？", "next": "現在離元旦節還有好幾個月。告訴你父母，辦婚事要儘量從簡，不要搞排場。", "emotion": "happiness", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 2, "speaker": "徐母", "text": "現在離元旦節還有好幾個月。告訴你父母，辦婚事要儘量從簡，不要搞排場。", "prev": "小左，你快坐下，事情是這樣的：昨天我和閨女她媽作了商量，你和麗華的年齡也不小啦！我們單方有個提議，你倆的婚慶吉日就定在今年的“元旦”節，你看如何？", "next": "正鵬：我也什麼都不要，越簡單越好。只要你把這件事辦順利點就行啦！", "emotion": "neutral", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 3, "speaker": "徐麗華", "text": "正鵬：我也什麼都不要，越簡單越好。只要你把這件事辦順利點就行啦！", "prev": "現在離元旦節還有好幾個月。告訴你父母，辦婚事要儘量從簡，不要搞排場。", "next": "小左，你有什麼想法請儘量說出來，不要老實悶在心裏頭。", "emotion": "happiness", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 4, "speaker": "徐父", "text": "小左，你有什麼想法請儘量說出來，不要老實悶在心裏頭。", "prev": "正鵬：我也什麼都不要，越簡單越好。只要你把這件事辦順利點就行啦！", "next": "對！我們都是一家人啦，你有什麼就講什麼吧！", "emotion": "neutral", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 5, "speaker": "徐母", "text": "對！我們都是一家人啦，你有什麼就講什麼吧！", "prev": "小左，你有什麼想法請儘量說出來，不要老實悶在心裏頭。", "next": "伯父、伯母，別的我倒沒有什麼，我最擔心的是，我倆結婚後麗華跟我會吃苦受累的。因我的家庭出生不好，我是地主的子弟呀！父親還經常受大隊幹部的批鬥！遊街，這不是跟你們臉上抹黑嗎？說不定過幾天我爸爸還要受到批斗的。", "emotion": "neutral", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 6, "speaker": "左正鵬", "text": "伯父、伯母，別的我倒沒有什麼，我最擔心的是，我倆結婚後麗華跟我會吃苦受累的。因我的家庭出生不好，我是地主的子弟呀！父親還經常受大隊幹部的批鬥！遊街，這不是跟你們臉上抹黑嗎？說不定過幾天我爸爸還要受到批斗的。", "prev": "對！我們都是一家人啦，你有什麼就講什麼吧！", "next": "小左，你這話怎講，地主的子弟就不是中國人嗎？你父親受批鬥與你有啥關係？這是階級鬥爭！這也是當前的形勢所爲。再說人的生死禍福有誰能事先料到？", "emotion": "fear", "relation": "徐父:son/daughter-in-law，徐母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 7, "speaker": "徐父", "text": "小左，你這話怎講，地主的子弟就不是中國人嗎？你父親受批鬥與你有啥關係？這是階級鬥爭！這也是當前的形勢所爲。再說人的生死禍福有誰能事先料到？", "prev": "伯父、伯母，別的我倒沒有什麼，我最擔心的是，我倆結婚後麗華跟我會吃苦受累的。因我的家庭出生不好，我是地主的子弟呀！父親還經常受大隊幹部的批鬥！遊街，這不是跟你們臉上抹黑嗎？說不定過幾天我爸爸還要受到批斗的。", "next": "正鵬，我也不相信我們今後會淪爲到哪種地步的！", "emotion": "surprise", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 8, "speaker": "徐麗華", "text": "正鵬，我也不相信我們今後會淪爲到哪種地步的！", "prev": "小左，你這話怎講，地主的子弟就不是中國人嗎？你父親受批鬥與你有啥關係？這是階級鬥爭！這也是當前的形勢所爲。再說人的生死禍福有誰能事先料到？", "next": "伯父、伯母，您們態度既然這樣明朗，我只好從命啦，從今天起我也只好改稱呼叫您們岳父、岳母啦！", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 9, "speaker": "左正鵬", "text": "伯父、伯母，您們態度既然這樣明朗，我只好從命啦，從今天起我也只好改稱呼叫您們岳父、岳母啦！", "prev": "正鵬，我也不相信我們今後會淪爲到哪種地步的！", "next": "感謝岳父、岳母對我的信任。不過我和麗華是自願相愛的，沒有媒介，關於結婚彩禮問題，您們對我就直說吧！", "emotion": "happiness", "relation": "徐父:son/daughter-in-law，徐母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 10, "speaker": "左正鵬", "text": "感謝岳父、岳母對我的信任。不過我和麗華是自願相愛的，沒有媒介，關於結婚彩禮問題，您們對我就直說吧！", "prev": "伯父、伯母，您們態度既然這樣明朗，我只好從命啦，從今天起我也只好改稱呼叫您們岳父、岳母啦！", "next": "什麼彩禮，我不是跟你說啦，辦婚事要一切從簡嗎！", "emotion": "happiness", "relation": "徐父:son/daughter-in-law，徐母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 11, "speaker": "徐父", "text": "什麼彩禮，我不是跟你說啦，辦婚事要一切從簡嗎！", "prev": "感謝岳父、岳母對我的信任。不過我和麗華是自願相愛的，沒有媒介，關於結婚彩禮問題，您們對我就直說吧！", "next": "您們怎得講個標準吧！", "emotion": "surprise", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 12, "speaker": "左正鵬", "text": "您們怎得講個標準吧！", "prev": "什麼彩禮，我不是跟你說啦，辦婚事要一切從簡嗎！", "next": "什麼標準不標準的，你的父母年紀不是都大了，家裏也不寬裕。要不就給閨女買套衣服表示表示就行啦！只要你今後不論做什麼事都能對得起她，這就是給閨女最好的彩禮！", "emotion": "neutral", "relation": "徐父:son/daughter-in-law，徐母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 13, "speaker": "徐母", "text": "什麼標準不標準的，你的父母年紀不是都大了，家裏也不寬裕。要不就給閨女買套衣服表示表示就行啦！只要你今後不論做什麼事都能對得起她，這就是給閨女最好的彩禮！", "prev": "您們怎得講個標準吧！", "next": "岳父岳母，您們胸襟這樣寬闊，處處地方能理解和關心我。今後我一定關心和照顧好麗華。你們放心吧！", "emotion": "happiness", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "9", "idx": 14, "speaker": "左正鵬", "text": "岳父岳母，您們胸襟這樣寬闊，處處地方能理解和關心我。今後我一定關心和照顧好麗華。你們放心吧！", "prev": "什麼標準不標準的，你的父母年紀不是都大了，家裏也不寬裕。要不就給閨女買套衣服表示表示就行啦！只要你今後不論做什麼事都能對得起她，這就是給閨女最好的彩禮！", "next": "", "emotion": "happiness", "relation": "徐父:son/daughter-in-law，徐母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "10", "idx": 0, "speaker": "左正鵬", "text": "爸、媽，我今天五·四開會。麗華同學按預約到了那裏。我拒絕她的求愛，誰知她死纏着我不放。散會後要我到她家裏一趟。她父母單方向我提出了建議：要求我和她閨女在今年元旦節結婚。他們表示不要任何彩禮，一切從簡。並囑咐我回家向您們彙報，您倆意見如何？", "prev": "", "next": "老婆子，你看，別人比我們還急些，我們老實被動着。", "emotion": "neutral", "relation": "左父:child，左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "10", "idx": 1, "speaker": "左父", "text": "老婆子，你看，別人比我們還急些，我們老實被動着。", "prev": "爸、媽，我今天五·四開會。麗華同學按預約到了那裏。我拒絕她的求愛，誰知她死纏着我不放。散會後要我到她家裏一趟。她父母單方向我提出了建議：要求我和她閨女在今年元旦節結婚。他們表示不要任何彩禮，一切從簡。並囑咐我回家向您們彙報，您倆意見如何？", "next": "什麼？她們不要任何彩禮，一切從簡？", "emotion": "neutral", "relation": "左母:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "10", "idx": 2, "speaker": "左母", "text": "什麼？她們不要任何彩禮，一切從簡？", "prev": "老婆子，你看，別人比我們還急些，我們老實被動着。", "next": "是的，她媽說就給麗華買兩套衣服表示表示就行了！", "emotion": "surprise", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "10", "idx": 3, "speaker": "左正鵬", "text": "是的，她媽說就給麗華買兩套衣服表示表示就行了！", "prev": "什麼？她們不要任何彩禮，一切從簡？", "next": "世上哪有這麼好的事兒，討媳婦不要彩禮的道理！", "emotion": "neutral", "relation": "左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "10", "idx": 4, "speaker": "左母", "text": "世上哪有這麼好的事兒，討媳婦不要彩禮的道理！", "prev": "是的，她媽說就給麗華買兩套衣服表示表示就行了！", "next": "媽，今後比這事還好的可多着呢！", "emotion": "surprise", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "10", "idx": 5, "speaker": "左正鵬", "text": "媽，今後比這事還好的可多着呢！", "prev": "世上哪有這麼好的事兒，討媳婦不要彩禮的道理！", "next": "那好，那好吧！就這樣定下了，等着瞧你們的！", "emotion": "happiness", "relation": "左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "10", "idx": 6, "speaker": "左母", "text": "那好，那好吧！就這樣定下了，等着瞧你們的！", "prev": "媽，今後比這事還好的可多着呢！", "next": "", "emotion": "happiness", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "11", "idx": 0, "speaker": "馬父", "text": "老婆子，我們來到親家這裏快兩個月了，他倆的歲數比我們還略大些，我們還讓他倆來伺候，真不好意思！", "prev": "", "next": "是呀！再說，我們的生活費也是他們付，我們付錢他又極力拒絕，這樣長期下去我看是不行的。", "emotion": "neutral", "relation": "馬母:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "11", "idx": 1, "speaker": "馬母", "text": "是呀！再說，我們的生活費也是他們付，我們付錢他又極力拒絕，這樣長期下去我看是不行的。", "prev": "老婆子，我們來到親家這裏快兩個月了，他倆的歲數比我們還略大些，我們還讓他倆來伺候，真不好意思！", "next": "老婆子，要不這樣吧，我們每天都搶先去買菜，這樣他們就不會去啦", "emotion": "neutral", "relation": "馬父:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "11", "idx": 2, "speaker": "馬父", "text": "老婆子，要不這樣吧，我們每天都搶先去買菜，這樣他們就不會去啦", "prev": "是呀！再說，我們的生活費也是他們付，我們付錢他又極力拒絕，這樣長期下去我看是不行的。", "next": "這樣爭着也不是事呀！總得有個合理的安排才行。", "emotion": "neutral", "relation": "馬母:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "11", "idx": 3, "speaker": "馬母", "text": "這樣爭着也不是事呀！總得有個合理的安排才行。", "prev": "老婆子，要不這樣吧，我們每天都搶先去買菜，這樣他們就不會去啦", "next": "", "emotion": "neutral", "relation": "馬父:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 0, "speaker": "徐麗華", "text": "正鵬，箱子裏200元錢你拿了沒有？", "prev": "", "next": "對了，昨天晚上，你不在家，我來不及同你商量，我拿給隊長買耕牛去了。", "emotion": "neutral", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 1, "speaker": "左正鵬", "text": "對了，昨天晚上，你不在家，我來不及同你商量，我拿給隊長買耕牛去了。", "prev": "正鵬，箱子裏200元錢你拿了沒有？", "next": "怎麼？你拿給生產隊買耕牛去了？！好！好！你逞什麼能？我問問你，生產隊裏有那麼多戶，他們爲什麼不獻出錢來，難道他們沒有嗎？人家比你聰明得多，姓左的，我被你氣死了！", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 2, "speaker": "徐麗華", "text": "怎麼？你拿給生產隊買耕牛去了？！好！好！你逞什麼能？我問問你，生產隊裏有那麼多戶，他們爲什麼不獻出錢來，難道他們沒有嗎？人家比你聰明得多，姓左的，我被你氣死了！", "prev": "對了，昨天晚上，你不在家，我來不及同你商量，我拿給隊長買耕牛去了。", "next": "麗華，你情緒別高漲，聽我解釋，生產隊是我們大家，我們自己纔是小家，只有大家富裕，我們小家才能富起來，你說是不是？", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 3, "speaker": "左正鵬", "text": "麗華，你情緒別高漲，聽我解釋，生產隊是我們大家，我們自己纔是小家，只有大家富裕，我們小家才能富起來，你說是不是？", "prev": "怎麼？你拿給生產隊買耕牛去了？！好！好！你逞什麼能？我問問你，生產隊裏有那麼多戶，他們爲什麼不獻出錢來，難道他們沒有嗎？人家比你聰明得多，姓左的，我被你氣死了！", "next": "什麼大家、小家的，我只知道“人不爲己天誅地滅”。", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 4, "speaker": "徐麗華", "text": "什麼大家、小家的，我只知道“人不爲己天誅地滅”。", "prev": "麗華，你情緒別高漲，聽我解釋，生產隊是我們大家，我們自己纔是小家，只有大家富裕，我們小家才能富起來，你說是不是？", "next": "這是哪個時代人說的話，你可知道嗎？現在我們是社會主義社會了，人人要講奉獻，大家要關心集體，熱愛集體，生產隊就是我們的大家庭，我們只是大家庭中的一分子。", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 5, "speaker": "左正鵬", "text": "這是哪個時代人說的話，你可知道嗎？現在我們是社會主義社會了，人人要講奉獻，大家要關心集體，熱愛集體，生產隊就是我們的大家庭，我們只是大家庭中的一分子。", "prev": "什麼大家、小家的，我只知道“人不爲己天誅地滅”。", "next": "左正鵬，你別說了，你當初當着我父母的面說得好聽，今後一定關心我，絕不做對不起我的事，今天我去扯布都沒錢啦，你對得起我嗎？你說呀！你背信棄義，表裏不一，我打死你！", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 6, "speaker": "徐麗華", "text": "左正鵬，你別說了，你當初當着我父母的面說得好聽，今後一定關心我，絕不做對不起我的事，今天我去扯布都沒錢啦，你對得起我嗎？你說呀！你背信棄義，表裏不一，我打死你！", "prev": "這是哪個時代人說的話，你可知道嗎？現在我們是社會主義社會了，人人要講奉獻，大家要關心集體，熱愛集體，生產隊就是我們的大家庭，我們只是大家庭中的一分子。", "next": "你買布放在下次不就行了嗎！反正布票還在我們手裏。生產隊買耕牛耕田是大事呀！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 7, "speaker": "左正鵬", "text": "你買布放在下次不就行了嗎！反正布票還在我們手裏。生產隊買耕牛耕田是大事呀！", "prev": "左正鵬，你別說了，你當初當着我父母的面說得好聽，今後一定關心我，絕不做對不起我的事，今天我去扯布都沒錢啦，你對得起我嗎？你說呀！你背信棄義，表裏不一，我打死你！", "next": "正鵬，你這個地主崽子，你竟敢和我們貧下中農子女作對，是嗎？你反對貧下中農就是反對革命。", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 8, "speaker": "徐麗華", "text": "正鵬，你這個地主崽子，你竟敢和我們貧下中農子女作對，是嗎？你反對貧下中農就是反對革命。", "prev": "你買布放在下次不就行了嗎！反正布票還在我們手裏。生產隊買耕牛耕田是大事呀！", "next": "麗華，不是我說你，正鵬從地裏回來，你飯也沒給他做，我認爲家裏錢給生產隊買耕牛是正事，你沒錢買布有什麼了不起的事情，你這不是胡鬧嗎？做妻子的總要講點道理嘛！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 9, "speaker": "左母", "text": "麗華，不是我說你，正鵬從地裏回來，你飯也沒給他做，我認爲家裏錢給生產隊買耕牛是正事，你沒錢買布有什麼了不起的事情，你這不是胡鬧嗎？做妻子的總要講點道理嘛！", "prev": "正鵬，你這個地主崽子，你竟敢和我們貧下中農子女作對，是嗎？你反對貧下中農就是反對革命。", "next": "死老鬼，多管閒事！", "emotion": "disgust", "relation": "徐麗華:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 10, "speaker": "徐麗華", "text": "死老鬼，多管閒事！", "prev": "麗華，不是我說你，正鵬從地裏回來，你飯也沒給他做，我認爲家裏錢給生產隊買耕牛是正事，你沒錢買布有什麼了不起的事情，你這不是胡鬧嗎？做妻子的總要講點道理嘛！", "next": "不是我多管閒事，這是我應該管的“閒事”！", "emotion": "angry", "relation": "左母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 11, "speaker": "左母", "text": "不是我多管閒事，這是我應該管的“閒事”！", "prev": "死老鬼，多管閒事！", "next": "家務事難道正鵬不能做嗎？非得我去做才行！", "emotion": "angry", "relation": "徐麗華:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 12, "speaker": "徐麗華", "text": "家務事難道正鵬不能做嗎？非得我去做才行！", "prev": "不是我多管閒事，這是我應該管的“閒事”！", "next": "這是農忙時節，正鵬既要教書，又要種田，夠辛苦的，早晨你在家裏應該把他的飯煮好嘛，你看他快要到學校上課去了，現在飯也沒有吃。", "emotion": "angry", "relation": "左母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 13, "speaker": "左母", "text": "這是農忙時節，正鵬既要教書，又要種田，夠辛苦的，早晨你在家裏應該把他的飯煮好嘛，你看他快要到學校上課去了，現在飯也沒有吃。", "prev": "家務事難道正鵬不能做嗎？非得我去做才行！", "next": "媽：你別和她辯啦！她那沒有教養的東西能懂得什麼道理！", "emotion": "disgust", "relation": "徐麗華:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 14, "speaker": "左正鵬", "text": "媽：你別和她辯啦！她那沒有教養的東西能懂得什麼道理！", "prev": "這是農忙時節，正鵬既要教書，又要種田，夠辛苦的，早晨你在家裏應該把他的飯煮好嘛，你看他快要到學校上課去了，現在飯也沒有吃。", "next": "誰說我沒有教養？我做了什麼虧人的事，你快說呀！", "emotion": "disgust", "relation": "左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "12", "idx": 15, "speaker": "徐麗華", "text": "誰說我沒有教養？我做了什麼虧人的事，你快說呀！", "prev": "媽：你別和她辯啦！她那沒有教養的東西能懂得什麼道理！", "next": "", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "13", "idx": 0, "speaker": "左正鵬", "text": "同學們，很抱歉！今天家裏有點事遲來了一步。下面請翻開課本45頁。我們再來學習一篇新的課文。", "prev": "", "next": "左正鵬，你這個砍頭的，今天你一定要跟我賠個不是，否則，我沒完沒了的！", "emotion": "neutral", "relation": "孫校長:subordinate，徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "13", "idx": 1, "speaker": "徐麗華", "text": "左正鵬，你這個砍頭的，今天你一定要跟我賠個不是，否則，我沒完沒了的！", "prev": "同學們，很抱歉！今天家裏有點事遲來了一步。下面請翻開課本45頁。我們再來學習一篇新的課文。", "next": "這是學校，是我工作的地方，請你注意點場合行嗎！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "13", "idx": 2, "speaker": "左正鵬", "text": "這是學校，是我工作的地方，請你注意點場合行嗎！", "prev": "左正鵬，你這個砍頭的，今天你一定要跟我賠個不是，否則，我沒完沒了的！", "next": "小徐，你有什麼事在家裏講得清的，不要到學校來鬧，影響不好，你快到外面來講給我聽聽。", "emotion": "surprise", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "13", "idx": 3, "speaker": "孫校長", "text": "小徐，你有什麼事在家裏講得清的，不要到學校來鬧，影響不好，你快到外面來講給我聽聽。", "prev": "這是學校，是我工作的地方，請你注意點場合行嗎！", "next": "", "emotion": "surprise", "relation": "徐麗華:unknown", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "14", "idx": 0, "speaker": "徐麗華", "text": "孫校長，昨天晚上左正鵬把家裏的錢給生產隊買耕牛去了，弄得家裏沒有一分錢；我跟他母親頂嘴，他又說我沒有教養；我去合作社扯布也去不成了。你說，我的氣往哪兒消呀！他還是不是我的男人？", "prev": "", "next": "小徐呀！這是件很小的事情。你別生氣。我叫左老師放學後給你溝通溝通下就行啦！哪有夫妻倆不吵架的？快回去啊！站在這裏不好看。", "emotion": "angry", "relation": "孫校長:unknown", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "14", "idx": 1, "speaker": "孫校長", "text": "小徐呀！這是件很小的事情。你別生氣。我叫左老師放學後給你溝通溝通下就行啦！哪有夫妻倆不吵架的？快回去啊！站在這裏不好看。", "prev": "孫校長，昨天晚上左正鵬把家裏的錢給生產隊買耕牛去了，弄得家裏沒有一分錢；我跟他母親頂嘴，他又說我沒有教養；我去合作社扯布也去不成了。你說，我的氣往哪兒消呀！他還是不是我的男人？", "next": "孫校長，就拜託了，你要給他嚴厲地批評批評啊！使他心服口服。", "emotion": "neutral", "relation": "徐麗華:unknown", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "14", "idx": 2, "speaker": "徐麗華", "text": "孫校長，就拜託了，你要給他嚴厲地批評批評啊！使他心服口服。", "prev": "小徐呀！這是件很小的事情。你別生氣。我叫左老師放學後給你溝通溝通下就行啦！哪有夫妻倆不吵架的？快回去啊！站在這裏不好看。", "next": "你們都要多作自我批評，少說別人缺點，要放下電筒拿起鏡子。你快點回去吧。", "emotion": "angry", "relation": "孫校長:unknown", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "14", "idx": 3, "speaker": "孫校長", "text": "你們都要多作自我批評，少說別人缺點，要放下電筒拿起鏡子。你快點回去吧。", "prev": "孫校長，就拜託了，你要給他嚴厲地批評批評啊！使他心服口服。", "next": "", "emotion": "neutral", "relation": "徐麗華:unknown", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "15", "idx": 0, "speaker": "左正鵬", "text": "麗華，你這在幹什麼？你這不是在糟塌糧食嗎？再說我今天肚裏還沒吃下一粒糧食呢！你忍心做出這種缺德的事來，能對得住我嗎？你還有沒有良心？", "prev": "", "next": "良心！你有多大的良心？我今天打了一天的撲克，同樣沒有吃一口飯，你關心了嗎？你問過我一聲嗎？你還有臉說我沒良心，呸！左父在一旁聽不下去了，他走了過來。", "emotion": "angry", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "15", "idx": 1, "speaker": "徐麗華", "text": "良心！你有多大的良心？我今天打了一天的撲克，同樣沒有吃一口飯，你關心了嗎？你問過我一聲嗎？你還有臉說我沒良心，呸！左父在一旁聽不下去了，他走了過來。", "prev": "麗華，你這在幹什麼？你這不是在糟塌糧食嗎？再說我今天肚裏還沒吃下一粒糧食呢！你忍心做出這種缺德的事來，能對得住我嗎？你還有沒有良心？", "next": "麗華，正鵬在學校上課，聽說早飯還沒有吃，可你自己說了今天打了一天的撲克。你家務事不做，飯也不給男人煮，還要找他胡鬧。天下有這樣的道理嗎？你自己好好想想吧！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "15", "idx": 2, "speaker": "左父", "text": "麗華，正鵬在學校上課，聽說早飯還沒有吃，可你自己說了今天打了一天的撲克。你家務事不做，飯也不給男人煮，還要找他胡鬧。天下有這樣的道理嗎？你自己好好想想吧！", "prev": "良心！你有多大的良心？我今天打了一天的撲克，同樣沒有吃一口飯，你關心了嗎？你問過我一聲嗎？你還有臉說我沒良心，呸！左父在一旁聽不下去了，他走了過來。", "next": "我就是想好啦纔不給他煮飯的。", "emotion": "angry", "relation": "徐麗華:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "15", "idx": 3, "speaker": "徐麗華", "text": "我就是想好啦纔不給他煮飯的。", "prev": "麗華，正鵬在學校上課，聽說早飯還沒有吃，可你自己說了今天打了一天的撲克。你家務事不做，飯也不給男人煮，還要找他胡鬧。天下有這樣的道理嗎？你自己好好想想吧！", "next": "這種女人太好強了。村子裏有誰的女人像她那樣對待自己的男人。兒呀！你的命好苦的，討了這麼個不講道理的女人，今後你的日子怎麼過下去呀！", "emotion": "angry", "relation": "左父:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "15", "idx": 4, "speaker": "左母", "text": "這種女人太好強了。村子裏有誰的女人像她那樣對待自己的男人。兒呀！你的命好苦的，討了這麼個不講道理的女人，今後你的日子怎麼過下去呀！", "prev": "我就是想好啦纔不給他煮飯的。", "next": "我不講道理，你叫他去討別的女人我一點也不稀罕！", "emotion": "sadness", "relation": "左正鵬:parent，徐麗華:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "15", "idx": 5, "speaker": "徐麗華", "text": "我不講道理，你叫他去討別的女人我一點也不稀罕！", "prev": "這種女人太好強了。村子裏有誰的女人像她那樣對待自己的男人。兒呀！你的命好苦的，討了這麼個不講道理的女人，今後你的日子怎麼過下去呀！", "next": "爸、媽，您們倆就少說幾句行嗎！和她講沒多大意思的。", "emotion": "angry", "relation": "左母:son/daughter-in-law，左父:son/daughter-in-law，左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "15", "idx": 6, "speaker": "左正鵬", "text": "爸、媽，您們倆就少說幾句行嗎！和她講沒多大意思的。", "prev": "我不講道理，你叫他去討別的女人我一點也不稀罕！", "next": "", "emotion": "disgust", "relation": "左父:child，左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "16", "idx": 0, "speaker": "徐母", "text": "閨女，你和正鵬倆又吵架了是嗎？", "prev": "", "next": "是的，爲了一點小事又和他吵了大嘴！", "emotion": "surprise", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "16", "idx": 1, "speaker": "徐麗華", "text": "是的，爲了一點小事又和他吵了大嘴！", "prev": "閨女，你和正鵬倆又吵架了是嗎？", "next": "你們爲點什麼小事吵了大嘴？快說給媽聽聽。", "emotion": "angry", "relation": "徐母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "16", "idx": 2, "speaker": "徐母", "text": "你們爲點什麼小事吵了大嘴？快說給媽聽聽。", "prev": "是的，爲了一點小事又和他吵了大嘴！", "next": "媽，昨天他把家裏的錢給生產隊買耕牛去了，我去扯布沒有錢了。還說我對他沒有良心。就是爲了這兩句話我們就吵起來啦！", "emotion": "surprise", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "16", "idx": 3, "speaker": "徐麗華", "text": "媽，昨天他把家裏的錢給生產隊買耕牛去了，我去扯布沒有錢了。還說我對他沒有良心。就是爲了這兩句話我們就吵起來啦！", "prev": "你們爲點什麼小事吵了大嘴？快說給媽聽聽。", "next": "我不信。正鵬不讓你去扯布，一定有他的理由；說你對他沒有良心肯定有事實！", "emotion": "angry", "relation": "徐母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "16", "idx": 4, "speaker": "徐父", "text": "我不信。正鵬不讓你去扯布，一定有他的理由；說你對他沒有良心肯定有事實！", "prev": "媽，昨天他把家裏的錢給生產隊買耕牛去了，我去扯布沒有錢了。還說我對他沒有良心。就是爲了這兩句話我們就吵起來啦！", "next": "好啦！就別問她那麼多了。既然閨女回了孃家就讓她多住上幾天消消氣也好。世上哪有夫妻倆不吵架的事。反正孃家就是女兒的“根據地”。", "emotion": "surprise", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "16", "idx": 5, "speaker": "徐母", "text": "好啦！就別問她那麼多了。既然閨女回了孃家就讓她多住上幾天消消氣也好。世上哪有夫妻倆不吵架的事。反正孃家就是女兒的“根據地”。", "prev": "我不信。正鵬不讓你去扯布，一定有他的理由；說你對他沒有良心肯定有事實！", "next": "誰說孃家是女兒的“根據地”？俗話說“嫁出去的女就是點出去的兵”！麗華，你明天應立即給我回去，不能久住！", "emotion": "neutral", "relation": "徐父:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "16", "idx": 6, "speaker": "徐父", "text": "誰說孃家是女兒的“根據地”？俗話說“嫁出去的女就是點出去的兵”！麗華，你明天應立即給我回去，不能久住！", "prev": "好啦！就別問她那麼多了。既然閨女回了孃家就讓她多住上幾天消消氣也好。世上哪有夫妻倆不吵架的事。反正孃家就是女兒的“根據地”。", "next": "老伴，你的心腸怎麼這麼狠呢？閨女剛來你就要趕她走，這也不近情理嗎！", "emotion": "neutral", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "16", "idx": 7, "speaker": "徐母", "text": "老伴，你的心腸怎麼這麼狠呢？閨女剛來你就要趕她走，這也不近情理嗎！", "prev": "誰說孃家是女兒的“根據地”？俗話說“嫁出去的女就是點出去的兵”！麗華，你明天應立即給我回去，不能久住！", "next": "老婆子，我不是心狠，你要知道“夫妻不記隔夜仇”的，你把閨女留在家裏，她倆的感情不就越來越鬆懈了嗎！", "emotion": "disgust", "relation": "徐父:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "16", "idx": 8, "speaker": "徐父", "text": "老婆子，我不是心狠，你要知道“夫妻不記隔夜仇”的，你把閨女留在家裏，她倆的感情不就越來越鬆懈了嗎！", "prev": "老伴，你的心腸怎麼這麼狠呢？閨女剛來你就要趕她走，這也不近情理嗎！", "next": "", "emotion": "neutral", "relation": "徐母:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "17", "idx": 0, "speaker": "左正鵬", "text": "媽，麗華這次回到孃家有幾天啦。明天是星期天，我想去岳母家把情況跟她父母講講聽，不然她父母只聽她一面之詞，反說我們無道理呀！", "prev": "", "next": "你去趟也好，不過你要維護自己的尊嚴，講話要把握好分寸，決不能讓她得寸進尺！騎在你的頭上。", "emotion": "fear", "relation": "左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "17", "idx": 1, "speaker": "左父", "text": "你去趟也好，不過你要維護自己的尊嚴，講話要把握好分寸，決不能讓她得寸進尺！騎在你的頭上。", "prev": "媽，麗華這次回到孃家有幾天啦。明天是星期天，我想去岳母家把情況跟她父母講講聽，不然她父母只聽她一面之詞，反說我們無道理呀！", "next": "那個憨女人，正鵬你還順着她幹什麼？你就別去啦，看她回來不回來，如果不回來你就此了結了，反正又不是你給她攆走的。", "emotion": "neutral", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "17", "idx": 2, "speaker": "左母", "text": "那個憨女人，正鵬你還順着她幹什麼？你就別去啦，看她回來不回來，如果不回來你就此了結了，反正又不是你給她攆走的。", "prev": "你去趟也好，不過你要維護自己的尊嚴，講話要把握好分寸，決不能讓她得寸進尺！騎在你的頭上。", "next": "老婆子，你的話也不能那樣講。女人的見識比較短淺嘛，心底也狹窄。男人的胸襟要寬闊些。不是原則問題，當遷就的事就得遷就，不能和她論個高低，分個輸贏。只有這樣家庭才能和睦起來。你年輕時不也經常與我吵嘴嗎？要不是我有大海的胸懷，你早就在別人家裏吃飯去啦！我就是爲了家庭的團結和睦，處處地方對你的讓步，我們纔會一起走到今天，你知道嗎！", "emotion": "disgust", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "17", "idx": 3, "speaker": "左父", "text": "老婆子，你的話也不能那樣講。女人的見識比較短淺嘛，心底也狹窄。男人的胸襟要寬闊些。不是原則問題，當遷就的事就得遷就，不能和她論個高低，分個輸贏。只有這樣家庭才能和睦起來。你年輕時不也經常與我吵嘴嗎？要不是我有大海的胸懷，你早就在別人家裏吃飯去啦！我就是爲了家庭的團結和睦，處處地方對你的讓步，我們纔會一起走到今天，你知道嗎！", "prev": "那個憨女人，正鵬你還順着她幹什麼？你就別去啦，看她回來不回來，如果不回來你就此了結了，反正又不是你給她攆走的。", "next": "", "emotion": "neutral", "relation": "左母:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "18", "idx": 0, "speaker": "徐父", "text": "正鵬，你來得正好。我們也準備將閨女送回來。這幾天你在家裏夠辛苦了。既要教學又要種田，你就原諒她些啊，都怪我們從小沒教育好她，使你受了氣，你就別往心裏頭想啊！", "prev": "", "next": "岳父，事物都是一分爲二的。只要你知道我沒有欺負她，沒有做出對不起她的事就行了。", "emotion": "neutral", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "18", "idx": 1, "speaker": "左正鵬", "text": "岳父，事物都是一分爲二的。只要你知道我沒有欺負她，沒有做出對不起她的事就行了。", "prev": "正鵬，你來得正好。我們也準備將閨女送回來。這幾天你在家裏夠辛苦了。既要教學又要種田，你就原諒她些啊，都怪我們從小沒教育好她，使你受了氣，你就別往心裏頭想啊！", "next": "正鵬，你不要跟女人一般見識，肚量要大些，麗華這幾天委", "emotion": "neutral", "relation": "徐父:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "18", "idx": 2, "speaker": "徐母", "text": "正鵬，你不要跟女人一般見識，肚量要大些，麗華這幾天委", "prev": "岳父，事物都是一分爲二的。只要你知道我沒有欺負她，沒有做出對不起她的事就行了。", "next": "媽，我一定要正鵬當着您們的面賠個不是，我才能跟着他走，否則我是不回去的！", "emotion": "neutral", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "18", "idx": 3, "speaker": "徐麗華", "text": "媽，我一定要正鵬當着您們的面賠個不是，我才能跟着他走，否則我是不回去的！", "prev": "正鵬，你不要跟女人一般見識，肚量要大些，麗華這幾天委", "next": "傻閨女，誰家兩口子沒有吵架的事，凡事都要互相忍讓，不能任性。聽見了沒有！賠什麼理，你都對！是嗎？", "emotion": "disgust", "relation": "徐母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "18", "idx": 4, "speaker": "徐母", "text": "傻閨女，誰家兩口子沒有吵架的事，凡事都要互相忍讓，不能任性。聽見了沒有！賠什麼理，你都對！是嗎？", "prev": "媽，我一定要正鵬當着您們的面賠個不是，我才能跟着他走，否則我是不回去的！", "next": "", "emotion": "surprise", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "19", "idx": 0, "speaker": "左正鵬", "text": "麗華，你也快三十歲的人啦！也應該改改自己的個性，任性是要不得的。今後我保證不跟你吵嘴了。我們要互相謙讓，互相尊重，過好我們的小日子。", "prev": "", "next": "今後我們吵不吵嘴也隨你的便，反正我要怎麼做，你非得順從我！這纔算得上我們互相融洽，互相包容，你懂嗎？", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "19", "idx": 1, "speaker": "徐麗華", "text": "今後我們吵不吵嘴也隨你的便，反正我要怎麼做，你非得順從我！這纔算得上我們互相融洽，互相包容，你懂嗎？", "prev": "麗華，你也快三十歲的人啦！也應該改改自己的個性，任性是要不得的。今後我保證不跟你吵嘴了。我們要互相謙讓，互相尊重，過好我們的小日子。", "next": "", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "20", "idx": 0, "speaker": "左父", "text": "麗華，今天你把600斤穀子稱給我行嗎？", "prev": "", "next": "你把籮筐拿來，稱給你，還不行嗎，反正遲早也要稱給你的。", "emotion": "neutral", "relation": "徐麗華:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "20", "idx": 1, "speaker": "徐麗華", "text": "你把籮筐拿來，稱給你，還不行嗎，反正遲早也要稱給你的。", "prev": "麗華，今天你把600斤穀子稱給我行嗎？", "next": "", "emotion": "disgust", "relation": "左父:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "21", "idx": 0, "speaker": "左正鵬", "text": "麗華，你這樣做能行嗎？這不是欺騙父母嗎？", "prev": "", "next": "誰說這穀子是扁穀子？我們平日不也是吃這些穀子嗎？", "emotion": "angry", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "21", "idx": 1, "speaker": "徐麗華", "text": "誰說這穀子是扁穀子？我們平日不也是吃這些穀子嗎？", "prev": "麗華，你這樣做能行嗎？這不是欺騙父母嗎？", "next": "別人不勞動，還想上等的穀子吃，休想！", "emotion": "disgust", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "21", "idx": 2, "speaker": "徐麗華", "text": "別人不勞動，還想上等的穀子吃，休想！", "prev": "誰說這穀子是扁穀子？我們平日不也是吃這些穀子嗎？", "next": "穀子的質量好壞都無所謂的，你們只要把數量稱足就行了！反正人人都會老的。", "emotion": "angry", "relation": "左正鵬:spouse，左父:son/daughter-in-law，左母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "21", "idx": 3, "speaker": "左父", "text": "穀子的質量好壞都無所謂的，你們只要把數量稱足就行了！反正人人都會老的。", "prev": "別人不勞動，還想上等的穀子吃，休想！", "next": "麗華，你這個不懂倫理道德的女人，對父母這樣不忠孝，今後會遭到報應的！", "emotion": "neutral", "relation": "徐麗華:parent-in-law，左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "21", "idx": 4, "speaker": "左正鵬", "text": "麗華，你這個不懂倫理道德的女人，對父母這樣不忠孝，今後會遭到報應的！", "prev": "穀子的質量好壞都無所謂的，你們只要把數量稱足就行了！反正人人都會老的。", "next": "你們不勞而獲，比過去地主剝削農民還過餘！今後你們沒有好死！", "emotion": "angry", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "21", "idx": 5, "speaker": "徐麗華", "text": "你們不勞而獲，比過去地主剝削農民還過餘！今後你們沒有好死！", "prev": "麗華，你這個不懂倫理道德的女人，對父母這樣不忠孝，今後會遭到報應的！", "next": "正鵬，你不要再擢了，我們寧願少吃的，只圖個安寧的日子呀！", "emotion": "angry", "relation": "左正鵬:spouse，左父:son/daughter-in-law，左母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "21", "idx": 6, "speaker": "左母", "text": "正鵬，你不要再擢了，我們寧願少吃的，只圖個安寧的日子呀！", "prev": "你們不勞而獲，比過去地主剝削農民還過餘！今後你們沒有好死！", "next": "", "emotion": "sadness", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "22", "idx": 0, "speaker": " DD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "23", "idx": 0, "speaker": "左正鵬", "text": "麗華，明天學校組織全體老師去芷江參觀抗日受降紀念坊。孫校長同意帶家屬，我也帶你去，不過一切費用自理。你看怎樣？", "prev": "", "next": "什麼？明天你要去芷江玩，你天天在學校還玩得不夠嗎？那天我去打撲克、扯布你說家裏沒有錢，明天去芷江你就有錢啦！不行，你不能去！", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "23", "idx": 1, "speaker": "徐麗華", "text": "什麼？明天你要去芷江玩，你天天在學校還玩得不夠嗎？那天我去打撲克、扯布你說家裏沒有錢，明天去芷江你就有錢啦！不行，你不能去！", "prev": "麗華，明天學校組織全體老師去芷江參觀抗日受降紀念坊。孫校長同意帶家屬，我也帶你去，不過一切費用自理。你看怎樣？", "next": "這是學校組織的政治學習，教育老師們不忘國恥，“弘揚抗戰精神”。老師們都是兩口子去呀！我倆還是一起去下，你不要太固執啦！", "emotion": "surprise", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "23", "idx": 2, "speaker": "左正鵬", "text": "這是學校組織的政治學習，教育老師們不忘國恥，“弘揚抗戰精神”。老師們都是兩口子去呀！我倆還是一起去下，你不要太固執啦！", "prev": "什麼？明天你要去芷江玩，你天天在學校還玩得不夠嗎？那天我去打撲克、扯布你說家裏沒有錢，明天去芷江你就有錢啦！不行，你不能去！", "next": "不忘國恥，弘揚抗戰精神，你說的好聽！你們分明是遊山玩水，還打着政治旗號呢！", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "23", "idx": 3, "speaker": "徐麗華", "text": "不忘國恥，弘揚抗戰精神，你說的好聽！你們分明是遊山玩水，還打着政治旗號呢！", "prev": "這是學校組織的政治學習，教育老師們不忘國恥，“弘揚抗戰精神”。老師們都是兩口子去呀！我倆還是一起去下，你不要太固執啦！", "next": "", "emotion": "disgust", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "24", "idx": 0, "speaker": "左正鵬", "text": "麗華，這是一次難得的機會，我們還是一齊去吧！你怎麼都不理解我的感受呢？", "prev": "", "next": "昨天我不是跟你說了，你不能去芷江嗎，今天你又來煩我是嗎？快跟我滾開！", "emotion": "sadness", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "24", "idx": 1, "speaker": "徐麗華", "text": "昨天我不是跟你說了，你不能去芷江嗎，今天你又來煩我是嗎？快跟我滾開！", "prev": "麗華，這是一次難得的機會，我們還是一齊去吧！你怎麼都不理解我的感受呢？", "next": "這是學校安排的政治活動，也是我的正常工作，你管不着！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "24", "idx": 2, "speaker": "左正鵬", "text": "這是學校安排的政治活動，也是我的正常工作，你管不着！", "prev": "昨天我不是跟你說了，你不能去芷江嗎，今天你又來煩我是嗎？快跟我滾開！", "next": "", "emotion": "disgust", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "25", "idx": 0, "speaker": "孫校長", "text": "左老師，你真的沒有把妻子帶來？", "prev": "", "next": "今天她到孃家有事去了。", "emotion": "neutral", "relation": "左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "25", "idx": 1, "speaker": "左正鵬", "text": "今天她到孃家有事去了。", "prev": "左老師，你真的沒有把妻子帶來？", "next": "", "emotion": "neutral", "relation": "孫校長:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "26", "idx": 0, "speaker": "左正鵬", "text": "喂，孫校長，真對不起，我先回家了，沒有當面向您請假，請原諒，你們離開芷江了沒有？", "prev": "", "next": "正鵬，你怎麼回家了呢？只要你在家裏就好。老師們不知道你去了哪裏，都在爲你擔心呀。都以爲你出了什麼事。正鵬，你爲什麼一個人要先回家呢？", "emotion": "neutral", "relation": "孫校長:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "26", "idx": 1, "speaker": "孫校長", "text": "正鵬，你怎麼回家了呢？只要你在家裏就好。老師們不知道你去了哪裏，都在爲你擔心呀。都以爲你出了什麼事。正鵬，你爲什麼一個人要先回家呢？", "prev": "喂，孫校長，真對不起，我先回家了，沒有當面向您請假，請原諒，你們離開芷江了沒有？", "next": "孫校長，你們都是夫妻雙雙在一起玩，多開心呀，而我卻打着單邊，心裏不是滋味。與其和你們在一起十分掃興，不如提前回家還好些。", "emotion": "surprise", "relation": "左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "26", "idx": 2, "speaker": "左正鵬", "text": "孫校長，你們都是夫妻雙雙在一起玩，多開心呀，而我卻打着單邊，心裏不是滋味。與其和你們在一起十分掃興，不如提前回家還好些。", "prev": "正鵬，你怎麼回家了呢？只要你在家裏就好。老師們不知道你去了哪裏，都在爲你擔心呀。都以爲你出了什麼事。正鵬，你爲什麼一個人要先回家呢？", "next": "啊！你原來還是這種想法，那又何必呢，我們在一起玩不是一樣的嗎！", "emotion": "sadness", "relation": "孫校長:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "26", "idx": 3, "speaker": "孫校長", "text": "啊！你原來還是這種想法，那又何必呢，我們在一起玩不是一樣的嗎！", "prev": "孫校長，你們都是夫妻雙雙在一起玩，多開心呀，而我卻打着單邊，心裏不是滋味。與其和你們在一起十分掃興，不如提前回家還好些。", "next": "孫校長，感謝你們的關心，祝你們玩得痛快，好啦，回家後我們再聊吧！再見！", "emotion": "surprise", "relation": "左正鵬:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "26", "idx": 4, "speaker": "左正鵬", "text": "孫校長，感謝你們的關心，祝你們玩得痛快，好啦，回家後我們再聊吧！再見！", "prev": "啊！你原來還是這種想法，那又何必呢，我們在一起玩不是一樣的嗎！", "next": "校長，你把電話給我，讓我也說幾句。", "emotion": "neutral", "relation": "孫校長:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "26", "idx": 5, "speaker": "劉豔", "text": "校長，你把電話給我，讓我也說幾句。", "prev": "孫校長，感謝你們的關心，祝你們玩得痛快，好啦，回家後我們再聊吧！再見！", "next": "他已經掛了。", "emotion": "neutral", "relation": "孫校長:subordinate", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "26", "idx": 6, "speaker": "孫校長", "text": "他已經掛了。", "prev": "校長，你把電話給我，讓我也說幾句。", "next": "", "emotion": "neutral", "relation": "劉豔:boss", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 0, "speaker": "徐母", "text": "正鵬，前次我告訴你倆今後不要再吵架了，誰知只隔幾天時間你們又吵起來了，真是太丟人了。這次你倆到底又是爲了什麼事快跟我說清楚！", "prev": "", "next": "岳母，你問問她自己吧！", "emotion": "angry", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 1, "speaker": "左正鵬", "text": "岳母，你問問她自己吧！", "prev": "正鵬，前次我告訴你倆今後不要再吵架了，誰知只隔幾天時間你們又吵起來了，真是太丟人了。這次你倆到底又是爲了什麼事快跟我說清楚！", "next": "她早就跟我說了，講你要到芷江去旅遊是不是？現在你家裏沒有錢還旅什麼遊嘍，你也真是的！", "emotion": "angry", "relation": "徐母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 2, "speaker": "徐母", "text": "她早就跟我說了，講你要到芷江去旅遊是不是？現在你家裏沒有錢還旅什麼遊嘍，你也真是的！", "prev": "岳母，你問問她自己吧！", "next": "岳母呀！這是學校組織的政治學習，孫校長要求老師們都去，我能不去嗎？", "emotion": "angry", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 3, "speaker": "左正鵬", "text": "岳母呀！這是學校組織的政治學習，孫校長要求老師們都去，我能不去嗎？", "prev": "她早就跟我說了，講你要到芷江去旅遊是不是？現在你家裏沒有錢還旅什麼遊嘍，你也真是的！", "next": "啊！原來是這樣？麗華，這就是你的不對了，學校組織的政治學習，正鵬當然要參加嘛，你怎麼能干涉他呢？我打死你不可，原來你跟我匯的是假報——說他是去遊山玩水，我認爲是真的呢！", "emotion": "surprise", "relation": "徐母:son/daughter-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 4, "speaker": "徐母", "text": "啊！原來是這樣？麗華，這就是你的不對了，學校組織的政治學習，正鵬當然要參加嘛，你怎麼能干涉他呢？我打死你不可，原來你跟我匯的是假報——說他是去遊山玩水，我認爲是真的呢！", "prev": "岳母呀！這是學校組織的政治學習，孫校長要求老師們都去，我能不去嗎？", "next": "媽，這明顯是他的錯，你怎麼還爲他辯護呢？", "emotion": "surprise", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 5, "speaker": "徐麗華", "text": "媽，這明顯是他的錯，你怎麼還爲他辯護呢？", "prev": "啊！原來是這樣？麗華，這就是你的不對了，學校組織的政治學習，正鵬當然要參加嘛，你怎麼能干涉他呢？我打死你不可，原來你跟我匯的是假報——說他是去遊山玩水，我認爲是真的呢！", "next": "傻閏女，這怎麼是他錯了呢？事實勝於雄辯嘛！你可知道“芷江受降紀念坊”是什麼地方嗎？它是中國人民打敗日本帝國主義，我國人民爲它舉行紀唸的地方，你知道嗎？", "emotion": "surprise", "relation": "徐母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 6, "speaker": "徐母", "text": "傻閏女，這怎麼是他錯了呢？事實勝於雄辯嘛！你可知道“芷江受降紀念坊”是什麼地方嗎？它是中國人民打敗日本帝國主義，我國人民爲它舉行紀唸的地方，你知道嗎？", "prev": "媽，這明顯是他的錯，你怎麼還爲他辯護呢？", "next": "媽，他們是打着政治旗號去遊山玩水的呀！", "emotion": "surprise", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 7, "speaker": "徐麗華", "text": "媽，他們是打着政治旗號去遊山玩水的呀！", "prev": "傻閏女，這怎麼是他錯了呢？事實勝於雄辯嘛！你可知道“芷江受降紀念坊”是什麼地方嗎？它是中國人民打敗日本帝國主義，我國人民爲它舉行紀唸的地方，你知道嗎？", "next": "你還在絞辯是嗎？他們去芷江“受降紀念坊”參觀學習叫做紅色旅遊你知道嗎？你這種社會見識都沒有，怪不得你經常和正鵬吵架！", "emotion": "disgust", "relation": "徐母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 8, "speaker": "徐母", "text": "你還在絞辯是嗎？他們去芷江“受降紀念坊”參觀學習叫做紅色旅遊你知道嗎？你這種社會見識都沒有，怪不得你經常和正鵬吵架！", "prev": "媽，他們是打着政治旗號去遊山玩水的呀！", "next": "媽，什麼叫做紅色旅遊？", "emotion": "angry", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 9, "speaker": "徐麗華", "text": "媽，什麼叫做紅色旅遊？", "prev": "你還在絞辯是嗎？他們去芷江“受降紀念坊”參觀學習叫做紅色旅遊你知道嗎？你這種社會見識都沒有，怪不得你經常和正鵬吵架！", "next": "紅色旅遊就是有革命歷史意義，值得後人學習紀唸的地方。", "emotion": "surprise", "relation": "徐母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 10, "speaker": "徐母", "text": "紅色旅遊就是有革命歷史意義，值得後人學習紀唸的地方。", "prev": "媽，什麼叫做紅色旅遊？", "next": "你看，她理虧還要翹“尾巴”呢！正鵬你不要和她一般見識啊，這次你就原諒她，看她今後又會怎樣。中國有句古話：叫着“讓老婆，同自在”她的個性不好，這是沒有辦法的事。", "emotion": "neutral", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 11, "speaker": "徐母", "text": "你看，她理虧還要翹“尾巴”呢！正鵬你不要和她一般見識啊，這次你就原諒她，看她今後又會怎樣。中國有句古話：叫着“讓老婆，同自在”她的個性不好，這是沒有辦法的事。", "prev": "紅色旅遊就是有革命歷史意義，值得後人學習紀唸的地方。", "next": "媽，你住一夜再走吧！", "emotion": "neutral", "relation": "左正鵬:parent-in-law", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 12, "speaker": "徐麗華", "text": "媽，你住一夜再走吧！", "prev": "你看，她理虧還要翹“尾巴”呢！正鵬你不要和她一般見識啊，這次你就原諒她，看她今後又會怎樣。中國有句古話：叫着“讓老婆，同自在”她的個性不好，這是沒有辦法的事。", "next": "我沒有好心情在你家裏住！", "emotion": "neutral", "relation": "徐母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "27", "idx": 13, "speaker": "徐母", "text": "我沒有好心情在你家裏住！", "prev": "媽，你住一夜再走吧！", "next": "", "emotion": "angry", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "28", "idx": 0, "speaker": "左正鵬", "text": "媽，你怎麼啦？好像有什麼心事似的。", "prev": "", "next": "正鵬，昨天晚上你姨媽已經去世了。明天下午我們一起去致哀啊！", "emotion": "neutral", "relation": "左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "28", "idx": 1, "speaker": "左母", "text": "正鵬，昨天晚上你姨媽已經去世了。明天下午我們一起去致哀啊！", "prev": "媽，你怎麼啦？好像有什麼心事似的。", "next": "哎喲！姨媽太可憐了。但是，得了絕症這是誰也沒辦法的事，媽，你心裏也別難過。明天你們先去，我放學後再來。", "emotion": "sadness", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "28", "idx": 2, "speaker": "左正鵬", "text": "哎喲！姨媽太可憐了。但是，得了絕症這是誰也沒辦法的事，媽，你心裏也別難過。明天你們先去，我放學後再來。", "prev": "正鵬，昨天晚上你姨媽已經去世了。明天下午我們一起去致哀啊！", "next": "正鵬，這件事你一定要跟你麗華商量，可你一定要去啊。姨媽死只有這一次。你就是再忙也要擠時間去呀！", "emotion": "sadness", "relation": "左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "28", "idx": 3, "speaker": "左母", "text": "正鵬，這件事你一定要跟你麗華商量，可你一定要去啊。姨媽死只有這一次。你就是再忙也要擠時間去呀！", "prev": "哎喲！姨媽太可憐了。但是，得了絕症這是誰也沒辦法的事，媽，你心裏也別難過。明天你們先去，我放學後再來。", "next": "媽，你放心，我一定會去的。", "emotion": "sadness", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "28", "idx": 4, "speaker": "左正鵬", "text": "媽，你放心，我一定會去的。", "prev": "正鵬，這件事你一定要跟你麗華商量，可你一定要去啊。姨媽死只有這一次。你就是再忙也要擠時間去呀！", "next": "", "emotion": "neutral", "relation": "左母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "29", "idx": 0, "speaker": "左正鵬", "text": "麗華，聽母親說姨媽昨天晚上與世長辭了。媽媽叫我們明天和她一起去向姨媽致哀。明天你和他們先去，我放學後再來，怎麼樣？", "prev": "", "next": "什麼？你姨媽去世了要我們去致哀！她是你媽媽的妹妹，與我們有什麼關係？再說你媽長期對我們是怎樣的態度你還不知道嗎？明天，我們不能去！", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "29", "idx": 1, "speaker": "徐麗華", "text": "什麼？你姨媽去世了要我們去致哀！她是你媽媽的妹妹，與我們有什麼關係？再說你媽長期對我們是怎樣的態度你還不知道嗎？明天，我們不能去！", "prev": "麗華，聽母親說姨媽昨天晚上與世長辭了。媽媽叫我們明天和她一起去向姨媽致哀。明天你和他們先去，我放學後再來，怎麼樣？", "next": "麗華，姨媽是我們的親人，她老人家走了我們都感到悲哀。至於我媽和你的關係不好那是另一回事嘛！", "emotion": "surprise", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "29", "idx": 2, "speaker": "左正鵬", "text": "麗華，姨媽是我們的親人，她老人家走了我們都感到悲哀。至於我媽和你的關係不好那是另一回事嘛！", "prev": "什麼？你姨媽去世了要我們去致哀！她是你媽媽的妹妹，與我們有什麼關係？再說你媽長期對我們是怎樣的態度你還不知道嗎？明天，我們不能去！", "next": "我說不能去就是不能去。明天你如果去了我會馬上追到她的靈堂去，到時你別說我不講道理！", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "29", "idx": 3, "speaker": "徐麗華", "text": "我說不能去就是不能去。明天你如果去了我會馬上追到她的靈堂去，到時你別說我不講道理！", "prev": "麗華，姨媽是我們的親人，她老人家走了我們都感到悲哀。至於我媽和你的關係不好那是另一回事嘛！", "next": "麗華，姨媽的去世是我們親戚中最大的事，我同你商量是對你最大的尊重，你在我跟前別老是好着強，明天我非去致哀不可！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "29", "idx": 4, "speaker": "左正鵬", "text": "麗華，姨媽的去世是我們親戚中最大的事，我同你商量是對你最大的尊重，你在我跟前別老是好着強，明天我非去致哀不可！", "prev": "我說不能去就是不能去。明天你如果去了我會馬上追到她的靈堂去，到時你別說我不講道理！", "next": "你去就是，你去就是！明天你看我的厲害！", "emotion": "neutral", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "29", "idx": 5, "speaker": "徐麗華", "text": "你去就是，你去就是！明天你看我的厲害！", "prev": "麗華，姨媽的去世是我們親戚中最大的事，我同你商量是對你最大的尊重，你在我跟前別老是好着強，明天我非去致哀不可！", "next": "", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "30", "idx": 0, "speaker": "左正鵬", "text": "徐麗華，你這個潑婦，今天你真的追到姨媽家裏來了，幸好親戚們不知其意，要不我被你丟盡了臉。好吧，回家去，老賬新賬我跟你一起算清！", "prev": "", "next": "左正鵬，你這個砍頭的，昨天我是怎麼交待你的，叫你不要去，你爲什麼不聽我的話！你把我說的話當成耳邊風是嗎？", "emotion": "angry", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "30", "idx": 1, "speaker": "徐麗華", "text": "左正鵬，你這個砍頭的，昨天我是怎麼交待你的，叫你不要去，你爲什麼不聽我的話！你把我說的話當成耳邊風是嗎？", "prev": "徐麗華，你這個潑婦，今天你真的追到姨媽家裏來了，幸好親戚們不知其意，要不我被你丟盡了臉。好吧，回家去，老賬新賬我跟你一起算清！", "next": "你還想返回去是嗎？", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "30", "idx": 2, "speaker": "徐麗華", "text": "你還想返回去是嗎？", "prev": "左正鵬，你這個砍頭的，昨天我是怎麼交待你的，叫你不要去，你爲什麼不聽我的話！你把我說的話當成耳邊風是嗎？", "next": "左正鵬，你竟敢打我，回家去你才知道我的厲害！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "30", "idx": 3, "speaker": "徐麗華", "text": "左正鵬，你竟敢打我，回家去你才知道我的厲害！", "prev": "你還想返回去是嗎？", "next": "", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "31", "idx": 0, "speaker": "徐麗華", "text": "左正鵬，你要幹什麼？", "prev": "", "next": "我要幹什麼！今天你跟我說清楚，你爲什麼要干涉我向姨媽去致哀？", "emotion": "surprise", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "31", "idx": 1, "speaker": "左正鵬", "text": "我要幹什麼！今天你跟我說清楚，你爲什麼要干涉我向姨媽去致哀？", "prev": "左正鵬，你要幹什麼？", "next": "這就說明我說話算話你知道嗎？", "emotion": "angry", "relation": "徐麗華:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "31", "idx": 2, "speaker": "徐麗華", "text": "這就說明我說話算話你知道嗎？", "prev": "我要幹什麼！今天你跟我說清楚，你爲什麼要干涉我向姨媽去致哀？", "next": "救命呀！左正鵬打人啦！", "emotion": "angry", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "31", "idx": 3, "speaker": "徐麗華", "text": "救命呀！左正鵬打人啦！", "prev": "這就說明我說話算話你知道嗎？", "next": "", "emotion": "surprise", "relation": "左正鵬:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "32", "idx": 0, "speaker": "左母", "text": "老伴，麗華把正鵬從這裏叫回家去了，說家裏有急事，不會吧？", "prev": "", "next": "誰知道她倆內裏搞的是什麼鬼門堂！", "emotion": "surprise", "relation": "左父:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "32", "idx": 1, "speaker": "左父", "text": "誰知道她倆內裏搞的是什麼鬼門堂！", "prev": "老伴，麗華把正鵬從這裏叫回家去了，說家裏有急事，不會吧？", "next": "可能他們爲了什麼事又鬧起來了！", "emotion": "disgust", "relation": "左母:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "32", "idx": 2, "speaker": "左母", "text": "可能他們爲了什麼事又鬧起來了！", "prev": "誰知道她倆內裏搞的是什麼鬼門堂！", "next": "他們要吵要鬧也隨他們自己了，反正我們也管不着。", "emotion": "neutral", "relation": "左父:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "32", "idx": 3, "speaker": "左父", "text": "他們要吵要鬧也隨他們自己了，反正我們也管不着。", "prev": "可能他們爲了什麼事又鬧起來了！", "next": "老伴，怎麼管不着呢！我們趕快回去看看。", "emotion": "disgust", "relation": "左母:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "32", "idx": 4, "speaker": "左母", "text": "老伴，怎麼管不着呢！我們趕快回去看看。", "prev": "他們要吵要鬧也隨他們自己了，反正我們也管不着。", "next": "", "emotion": "surprise", "relation": "左父:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "33", "idx": 0, "speaker": "徐母", "text": "麗華，我被你氣死啦！你怎麼阻止正鵬去向姨母致哀呢？今天我在他家裏不好當着他們批評你，你知道嗎？你當我真的同情你啊！這是你的大錯特錯，你這樣做，他村子裏的人知道了是怎麼評論的你可知道嗎？再說，正鵬在他親戚眼裏還有沒有一點臉面？", "prev": "", "next": "啊！麗華，你原來還是這樣的，難怪正鵬會打你的，我也認爲他打得應該，今後你如果還是這樣的態度對待他家里人，我叫他狠狠地打！你這樣做是給我們臉上抹黑你知道嗎？你叫我們今後怎麼好意思去你家裏，再說，左家又還會有誰歡迎我們呢？你說呀！", "emotion": "surprise", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "33", "idx": 1, "speaker": "徐父", "text": "啊！麗華，你原來還是這樣的，難怪正鵬會打你的，我也認爲他打得應該，今後你如果還是這樣的態度對待他家里人，我叫他狠狠地打！你這樣做是給我們臉上抹黑你知道嗎？你叫我們今後怎麼好意思去你家裏，再說，左家又還會有誰歡迎我們呢？你說呀！", "prev": "麗華，我被你氣死啦！你怎麼阻止正鵬去向姨母致哀呢？今天我在他家裏不好當着他們批評你，你知道嗎？你當我真的同情你啊！這是你的大錯特錯，你這樣做，他村子裏的人知道了是怎麼評論的你可知道嗎？再說，正鵬在他親戚眼裏還有沒有一點臉面？", "next": "爸，我還是不是你女兒呀？你怎麼老是幫他們說話呢！", "emotion": "angry", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "33", "idx": 2, "speaker": "徐麗華", "text": "爸，我還是不是你女兒呀？你怎麼老是幫他們說話呢！", "prev": "啊！麗華，你原來還是這樣的，難怪正鵬會打你的，我也認爲他打得應該，今後你如果還是這樣的態度對待他家里人，我叫他狠狠地打！你這樣做是給我們臉上抹黑你知道嗎？你叫我們今後怎麼好意思去你家裏，再說，左家又還會有誰歡迎我們呢？你說呀！", "next": "老伴，你就別見人落井下石啦，自己的閨女我們不是不知道，今後叫她注意點就行了，以前我說孃家就是女兒的“根據地”現在看來可不能這麼說了，過幾天叫她回去就是！", "emotion": "surprise", "relation": "徐父:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "33", "idx": 3, "speaker": "徐母", "text": "老伴，你就別見人落井下石啦，自己的閨女我們不是不知道，今後叫她注意點就行了，以前我說孃家就是女兒的“根據地”現在看來可不能這麼說了，過幾天叫她回去就是！", "prev": "爸，我還是不是你女兒呀？你怎麼老是幫他們說話呢！", "next": "媽，我們做女人的好難啊！從孃家走到婆家，是女人人生里程的轉折點，誰知婆家有很多事情與我在孃家不一樣，我真是適應不了！", "emotion": "neutral", "relation": "徐父:spouse", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "33", "idx": 4, "speaker": "徐麗華", "text": "媽，我們做女人的好難啊！從孃家走到婆家，是女人人生里程的轉折點，誰知婆家有很多事情與我在孃家不一樣，我真是適應不了！", "prev": "老伴，你就別見人落井下石啦，自己的閨女我們不是不知道，今後叫她注意點就行了，以前我說孃家就是女兒的“根據地”現在看來可不能這麼說了，過幾天叫她回去就是！", "next": "傻閨女，你在孃家還是黃花閨女，成天過着無憂無慮的生活，有父母這棵大樹爲你遮風擋雨；可是你結了婚，就要扛起家庭的大梁，爲自己的小日子奔波操勞，這當然不一樣嗎！今後你一定要改改個性，不然會要出事的呀！", "emotion": "sadness", "relation": "徐母:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "33", "idx": 5, "speaker": "徐父", "text": "傻閨女，你在孃家還是黃花閨女，成天過着無憂無慮的生活，有父母這棵大樹爲你遮風擋雨；可是你結了婚，就要扛起家庭的大梁，爲自己的小日子奔波操勞，這當然不一樣嗎！今後你一定要改改個性，不然會要出事的呀！", "prev": "媽，我們做女人的好難啊！從孃家走到婆家，是女人人生里程的轉折點，誰知婆家有很多事情與我在孃家不一樣，我真是適應不了！", "next": "", "emotion": "neutral", "relation": "徐麗華:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "34", "idx": 0, "speaker": "娟子", "text": "左老師在家嗎？我虎子有道數學題不懂，麻煩你今天晚上來我家一趟給他輔導下有時間嗎？", "prev": "", "next": "啊！不要緊，今天晚上我到你家來趟就是。", "emotion": "neutral", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "34", "idx": 1, "speaker": "左正鵬", "text": "啊！不要緊，今天晚上我到你家來趟就是。", "prev": "左老師在家嗎？我虎子有道數學題不懂，麻煩你今天晚上來我家一趟給他輔導下有時間嗎？", "next": "", "emotion": "neutral", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "35", "idx": 0, "speaker": "村姑", "text": "娟子，今天你心裏像有什麼喜事似的，看你挺高興的樣子！", "prev": "", "next": "人就是要高高興興的過日子嗎！整天愁眉苦臉是不行的。", "emotion": "surprise", "relation": "娟子:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "35", "idx": 1, "speaker": "娟子", "text": "人就是要高高興興的過日子嗎！整天愁眉苦臉是不行的。", "prev": "娟子，今天你心裏像有什麼喜事似的，看你挺高興的樣子！", "next": "你可能找到了男朋友了是嗎？開始走“桃花運”了！", "emotion": "happiness", "relation": "村姑:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "35", "idx": 2, "speaker": "村姑", "text": "你可能找到了男朋友了是嗎？開始走“桃花運”了！", "prev": "人就是要高高興興的過日子嗎！整天愁眉苦臉是不行的。", "next": "我打死你，亂說話。", "emotion": "surprise", "relation": "娟子:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "35", "idx": 3, "speaker": "娟子", "text": "我打死你，亂說話。", "prev": "你可能找到了男朋友了是嗎？開始走“桃花運”了！", "next": "", "emotion": "neutral", "relation": "村姑:friend", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "36", "idx": 0, "speaker": "左正鵬", "text": "嗨，做男人真難哪！既要對付自己的老婆，又要防範外界女人對自己“人身”的侵犯！", "prev": "", "next": "正鵬，你剛纔說什麼？跟我再說一遍！", "emotion": "sadness", "relation": "左父:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "36", "idx": 1, "speaker": "左父", "text": "正鵬，你剛纔說什麼？跟我再說一遍！", "prev": "嗨，做男人真難哪！既要對付自己的老婆，又要防範外界女人對自己“人身”的侵犯！", "next": "爸，我沒有說什麼，我只說我們男人做事好難爲人的。別的沒說什麼呀！", "emotion": "surprise", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "36", "idx": 2, "speaker": "左正鵬", "text": "爸，我沒有說什麼，我只說我們男人做事好難爲人的。別的沒說什麼呀！", "prev": "正鵬，你剛纔說什麼？跟我再說一遍！", "next": "正鵬我老實告訴你，你麗華不在家裏，晚上不能躥女人的門呀！", "emotion": "neutral", "relation": "左父:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "36", "idx": 3, "speaker": "左父", "text": "正鵬我老實告訴你，你麗華不在家裏，晚上不能躥女人的門呀！", "prev": "爸，我沒有說什麼，我只說我們男人做事好難爲人的。別的沒說什麼呀！", "next": "爸，你這是什麼意思，你好像看到我什麼似的。", "emotion": "surprise", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "36", "idx": 4, "speaker": "左正鵬", "text": "爸，你這是什麼意思，你好像看到我什麼似的。", "prev": "正鵬我老實告訴你，你麗華不在家裏，晚上不能躥女人的門呀！", "next": "我能看到你什麼？我只是提醒提醒你而已！今後要注意下男女之間的是非！", "emotion": "neutral", "relation": "左父:child", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "36", "idx": 5, "speaker": "左父", "text": "我能看到你什麼？我只是提醒提醒你而已！今後要注意下男女之間的是非！", "prev": "爸，你這是什麼意思，你好像看到我什麼似的。", "next": "", "emotion": "neutral", "relation": "左正鵬:parent", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "37", "idx": 0, "speaker": "娟子", "text": "正鵬老師你麗華嫂子回來了嗎？", "prev": "", "next": "沒有回來，她可能還要住上好幾天纔回吧！", "emotion": "neutral", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "37", "idx": 1, "speaker": "左正鵬", "text": "沒有回來，她可能還要住上好幾天纔回吧！", "prev": "正鵬老師你麗華嫂子回來了嗎？", "next": "那道數學難題你跟我虎子講了沒有？", "emotion": "neutral", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "37", "idx": 2, "speaker": "娟子", "text": "那道數學難題你跟我虎子講了沒有？", "prev": "沒有回來，她可能還要住上好幾天纔回吧！", "next": "我一到學校就跟他講解了，他已經知道怎樣列式計算了。", "emotion": "neutral", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "37", "idx": 3, "speaker": "左正鵬", "text": "我一到學校就跟他講解了，他已經知道怎樣列式計算了。", "prev": "那道數學難題你跟我虎子講了沒有？", "next": "啊！太感謝你了，你還是說話算話，不過你在生活上也有很多不明白的地方需要我給你指教指教才行呢！", "emotion": "neutral", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "37", "idx": 4, "speaker": "娟子", "text": "啊！太感謝你了，你還是說話算話，不過你在生活上也有很多不明白的地方需要我給你指教指教才行呢！", "prev": "我一到學校就跟他講解了，他已經知道怎樣列式計算了。", "next": "我的生活很愉快，思想也很純潔，對自己的人生態度也很明確，沒有什麼不明白的地方，不需要你來指教我。", "emotion": "neutral", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "37", "idx": 5, "speaker": "左正鵬", "text": "我的生活很愉快，思想也很純潔，對自己的人生態度也很明確，沒有什麼不明白的地方，不需要你來指教我。", "prev": "啊！太感謝你了，你還是說話算話，不過你在生活上也有很多不明白的地方需要我給你指教指教才行呢！", "next": "你“不識廬山真面目，只緣身在此山中”啊！", "emotion": "disgust", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "37", "idx": 6, "speaker": "娟子", "text": "你“不識廬山真面目，只緣身在此山中”啊！", "prev": "我的生活很愉快，思想也很純潔，對自己的人生態度也很明確，沒有什麼不明白的地方，不需要你來指教我。", "next": "", "emotion": "neutral", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 0, "speaker": "左正鵬", "text": "娟子你有什麼話請到外面講，在內屋兩人說話，男女受授不清。", "prev": "", "next": "你自己的事情難道還不清楚？", "emotion": "neutral", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 1, "speaker": "娟子", "text": "你自己的事情難道還不清楚？", "prev": "娟子你有什麼話請到外面講，在內屋兩人說話，男女受授不清。", "next": "你不說我當然不知道！", "emotion": "surprise", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 2, "speaker": "左正鵬", "text": "你不說我當然不知道！", "prev": "你自己的事情難道還不清楚？", "next": "正鵬，一個人的婚姻如果處理不好那是一輩子最痛苦的事情，我如果是男同志的話早就和你妻子離婚了，還拖到今天。我覺得你把自己捆得太緊，你妻子對你是那樣的態度，你還堅持着和她在一起過日子，你真傻！", "emotion": "angry", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 3, "speaker": "娟子", "text": "正鵬，一個人的婚姻如果處理不好那是一輩子最痛苦的事情，我如果是男同志的話早就和你妻子離婚了，還拖到今天。我覺得你把自己捆得太緊，你妻子對你是那樣的態度，你還堅持着和她在一起過日子，你真傻！", "prev": "你不說我當然不知道！", "next": "啊！你原來還是爲這件事而來的，我還以爲你有件什麼國家大事，神神祕祕的。", "emotion": "surprise", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 4, "speaker": "左正鵬", "text": "啊！你原來還是爲這件事而來的，我還以爲你有件什麼國家大事，神神祕祕的。", "prev": "正鵬，一個人的婚姻如果處理不好那是一輩子最痛苦的事情，我如果是男同志的話早就和你妻子離婚了，還拖到今天。我覺得你把自己捆得太緊，你妻子對你是那樣的態度，你還堅持着和她在一起過日子，你真傻！", "next": "正鵬老師，我覺得你活得太苦太累了你承認嗎？", "emotion": "neutral", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 5, "speaker": "娟子", "text": "正鵬老師，我覺得你活得太苦太累了你承認嗎？", "prev": "啊！你原來還是爲這件事而來的，我還以爲你有件什麼國家大事，神神祕祕的。", "next": "活得苦和累這或許是一個人對自己家庭完全負責任的具體表現吧！", "emotion": "neutral", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 6, "speaker": "左正鵬", "text": "活得苦和累這或許是一個人對自己家庭完全負責任的具體表現吧！", "prev": "正鵬老師，我覺得你活得太苦太累了你承認嗎？", "next": "看來你還會自我解脫和安慰呢！", "emotion": "neutral", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 7, "speaker": "娟子", "text": "看來你還會自我解脫和安慰呢！", "prev": "活得苦和累這或許是一個人對自己家庭完全負責任的具體表現吧！", "next": "你不用再說了，我徹底明白了你的意思。請你放尊重點，不要再胡來。我對自己的婚姻有着自己的觀點。我需要什麼樣的婚姻和家庭我早就考慮好了。也用不着你來說教。雖然我妻子在某些方面不講道理。但她作風正派，從來沒有背叛過我，我就是需要這樣的女人爲妻子。", "emotion": "neutral", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 8, "speaker": "左正鵬", "text": "你不用再說了，我徹底明白了你的意思。請你放尊重點，不要再胡來。我對自己的婚姻有着自己的觀點。我需要什麼樣的婚姻和家庭我早就考慮好了。也用不着你來說教。雖然我妻子在某些方面不講道理。但她作風正派，從來沒有背叛過我，我就是需要這樣的女人爲妻子。", "prev": "看來你還會自我解脫和安慰呢！", "next": "正鵬，我們都是過來的人啦，我也不瞞你說，我太喜歡你了，我的心在燃燒呀！請你接受我的愛好嗎？", "emotion": "neutral", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 9, "speaker": "娟子", "text": "正鵬，我們都是過來的人啦，我也不瞞你說，我太喜歡你了，我的心在燃燒呀！請你接受我的愛好嗎？", "prev": "你不用再說了，我徹底明白了你的意思。請你放尊重點，不要再胡來。我對自己的婚姻有着自己的觀點。我需要什麼樣的婚姻和家庭我早就考慮好了。也用不着你來說教。雖然我妻子在某些方面不講道理。但她作風正派，從來沒有背叛過我，我就是需要這樣的女人爲妻子。", "next": "娟子，請你冷靜點，不要衝動。這是萬萬幹不得的事，請你原諒我行嗎？", "emotion": "happiness", "relation": "左正鵬:student", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 10, "speaker": "左正鵬", "text": "娟子，請你冷靜點，不要衝動。這是萬萬幹不得的事，請你原諒我行嗎？", "prev": "正鵬，我們都是過來的人啦，我也不瞞你說，我太喜歡你了，我的心在燃燒呀！請你接受我的愛好嗎？", "next": "娟子呀！我不能接受你對我的愛，因爲我不願意毀掉我的家，再說我是人民教師，在婚姻問題上不能見異思遷，祝你另攀高門，永遠幸福！好嗎？", "emotion": "surprise", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 11, "speaker": "左正鵬", "text": "娟子呀！我不能接受你對我的愛，因爲我不願意毀掉我的家，再說我是人民教師，在婚姻問題上不能見異思遷，祝你另攀高門，永遠幸福！好嗎？", "prev": "娟子，請你冷靜點，不要衝動。這是萬萬幹不得的事，請你原諒我行嗎？", "next": "人民教師有什麼了不起的事，我認爲人的婚姻是建立在兩人感情基礎上的，沒有感情的婚姻是死亡的婚姻，而死亡的婚姻是無意義的婚姻。", "emotion": "neutral", "relation": "娟子:teacher", "source": "https://github.com/ntunlplab/Dialogue-MPDD"}, {"dataset": "Dialogue-MPDD 中文情绪关系对话", "dialogue_id": "38", "idx": 12, "speaker": "娟子", "text": "人民教師有什麼了不起的事，我認爲人的婚姻是建立在兩人感情基礎上的，沒有感情的婚姻是死亡的婚姻，
