。", "row_idx": 66, "dialogue_id": "a438b751ab9997cdb35f07bfe3dfb010b96365f4762d77f87e5f41290ff61c3d_66", "emotion_codes": [1, 6, 1, 0, 1, 0, 0, 0, 0, 6, 0, 0, 0, 0, 0, 0, 0, 0, 0], "act_codes": [1, 2, 1, 2, 1, 2, 1, 2, 1, 2, 1, 1, 1, 2, 1, 1, 1, 1, 1], "turns": [{"speaker": "S1", "text": "Oh , my God ! I've been cheated !"}, {"speaker": "S2", "text": "What ? What did you buy ?"}, {"speaker": "S1", "text": "It's a brick ! I can't believe how stupid I was . Damn it !"}, {"speaker": "S2", "text": "What is it ? Why did you buy a brick ?"}, {"speaker": "S1", "text": "There was a guy on the sidewalk.He had three new boxes , Panasonic video camera boxes.He said he had to get rid of them quick ."}, {"speaker": "S2", "text": "And ?"}, {"speaker": "S1", "text": "So he said he'd sell me one for twenty dollars . A four-hundred-dollar camera for twenty bucks ."}, {"speaker": "S2", "text": "And it's a brick ?"}, {"speaker": "S1", "text": "Yes ."}, {"speaker": "S2", "text": "I can't believe how stupid you are . Why didn't you open the box ?"}, {"speaker": "S1", "text": "I wanted to . But he said , no , the box is still in its plastic wrap from the store.If it's opened , other people won't believe it's new ."}, {"speaker": "S2", "text": "So he had the boxes wrapped in plastic ."}, {"speaker": "S1", "text": "Yes , it was the kind of perfect plastic wrap that comes with new products.Look , it even had a bar-code price sticker on it ! It looked brand new ."}, {"speaker": "S2", "text": "But why would a guy be selling new video cameras for twenty dollars ?"}, {"speaker": "S1", "text": "He said he had to get rid of them . They were stolen ."}, {"speaker": "S2", "text": "Aha ! Now I understand.You were trying to buy stolen goods on the sidewalk.So , what I think is , you deserve to get cheated !"}, {"speaker": "S1", "text": "C'mon , don't blame me ! I thought it was a new camera . We could use it.We were even thinking about buying a camera . I don't understand how he could have such a perfect-looking box ."}, {"speaker": "S2", "text": "That's no problem.He just has a friend who works in a shop that can do plastic wrap . That's easy.And probably it's the same shop he got the boxes from.Maybe his friend works in an electronics store . They sell video cameras there.Probably they had a couple video camera boxes lying around.So they get the idea of wrapping bricks to sell to fools like you.Twenty dollars a brick . That's a good profit if they can sell enough bricks ."}, {"speaker": "S1", "text": "You're right , Sarah . I was a fool . I can't believe it . How could I fall for such a trick ?"}]}, {"dataset": "DailyDialog", "license": "CC BY-NC-SA 4.0; non-commercial/share-alike", "source": "https://huggingface.co/datasets/roskoN/dailydialog", "why_useful": "体验日常多轮对话结构、话题转接和自然短句。", "row_idx": 67, "dialogue_id": "a438b751ab9997cdb35f07bfe3dfb010b96365f4762d77f87e5f41290ff61c3d_67", "emotion_codes": [0, 0, 0, 0], "act_codes": [2, 1, 2, 1], "turns": [{"speaker": "S1", "text": "Is the clock right ?"}, {"speaker": "S2", "text": "I'm afraid it gains a little ."}, {"speaker": "S1", "text": "By how many minutes ?"}, {"speaker": "S2", "text": "Two ."}]}, {"dataset": "DailyDialog", "license": "CC BY-NC-SA 4.0; non-commercial/share-alike", "source": "https://huggingface.co/datasets/roskoN/dailydialog", "why_useful": "体验日常多轮对话结构、话题转接和自然短句。", "row_idx": 68, "dialogue_id": "a438b751ab9997cdb35f07bfe3dfb010b96365f4762d77f87e5f41290ff61c3d_68", "emotion_codes": [0, 0, 4, 0, 4, 0, 6, 0, 0], "act_codes": [2, 1, 2, 1, 2, 1, 1, 1, 1], "turns": [{"speaker": "S1", "text": "Hey , Mary , what's up ?"}, {"speaker": "S2", "text": "Just so so . Last night I met this great guy at the bar and we had such a wonderful time , so we decided to meet again tonight ."}, {"speaker": "S1", "text": "Oh , that's exciting . What does this guy look like ? Is he hot ?"}, {"speaker": "S2", "text": "Well , I didn't think so at first . But as we started talking , I found him extremely funny and witty . I couldn't stop laughing at his jokes ! And we have so much in common . We like the same team , music , and most amazingly , we both love Chinese food ! I have the feeling that we are going to be great friends ."}, {"speaker": "S1", "text": "It seems you two are a good match . What qualities do you look for in a friend ?"}, {"speaker": "S2", "text": "There's nothing definite I think . I don't have a list or anything , but when I first meet somebody , I can usually tell whether or not that person is going to be a good friend . It seems I have radar helping me spot new friends ."}, {"speaker": "S1", "text": "Well , that's something I've never heard of . But if you ask me what I value most in a friend , I would say honesty ."}, {"speaker": "S2", "text": "I agree . You can't expect a close relationship with a dishonest person . Those are the people that will turn their back on you when you are in need ."}, {"speaker": "S1", "text": "Yeah , I know . A friend in need is a friend indeed . I don't need fair-weather friends either ."}]}, {"dataset": "DailyDialog", "license": "CC BY-NC-SA 4.0; non-commercial/share-alike", "source": "https://huggingface.co/datasets/roskoN/dailydialog", "why_useful": "体验日常多轮对话结构、话题转接和自然短句。", "row_idx": 69, "dialogue_id": "a438b751ab9997cdb35f07bfe3dfb010b96365f4762d77f87e5f41290ff61c3d_69", "emotion_codes": [0, 2, 0, 0, 0, 0, 0, 0, 0, 0, 0], "act_codes": [2, 1, 1, 1, 1, 1, 1, 2, 1, 2, 1], "turns": [{"speaker": "S1", "text": "What ’ s up ? You don ’ t look too good ."}, {"speaker": "S2", "text": "Yeah , my head hurts , that ’ s all . I ’ Ve been in physics class all day . It ’ s killer !"}, {"speaker": "S1", "text": "I liked physics . It ’ s all math , really . arcs , curves , velocity , cool stuff ."}, {"speaker": "S2", "text": "Yeah , yeah , but today ’ s lesson was all about the creation of the universe ."}, {"speaker": "S1", "text": "A physics class about the creation of the universe ? That ’ s some pretty unscientific language there . Sounds more religious to me ."}, {"speaker": "S2", "text": "It ’ s all religion . Take the theory of the Big Bang.How is it possible that all of the stuff in the universe comes from an explosion ? That ’ s no better than Atlas carrying the globe on his back or African myths about turtles and stuff ."}, {"speaker": "S1", "text": "Turtles ? Whatever ... Look , all that ’ s required for the creation of matter an imbalance of particles and anti-particles . At least , that ’ s what the math says ."}, {"speaker": "S2", "text": "Math , sheath . What ’ s the evidence ?"}, {"speaker": "S1", "text": "There is evidence ! You know Edwin Hubble ? He ’ s the guy who in the early twentieth century was the first scientist to measure the drift of matter in the universe , thus advancing notions of an expanding universe . What would it be expanding from ? Well , the Big Bang ... DUH !"}, {"speaker": "S2", "text": "Anyway , it ’ s just a theory . Why do people go around touting theories ? Where ’ s the scientific rigor in that ?"}, {"speaker": "S1", "text": "Dude , don ’ t equivocate . A theory only becomes a theory after withstanding rigorous testing . You slept through class , didn ’ t you ?"}]}, {"dataset": "DailyDialog", "license": "CC BY-NC-SA 4.0; non-commercial/share-alike", "source": "https://huggingface.co/datasets/roskoN/dailydialog", "why_useful": "体验日常多轮对话结构、话题转接和自然短句。", "row_idx": 70, "dialogue_id": "a438b751ab9997cdb35f07bfe3dfb010b96365f4762d77f87e5f41290ff61c3d_70", "emotion_codes": [0, 0, 0, 0, 0, 0, 0, 0, 0, 6, 0], "act_codes": [2, 1, 2, 1, 1, 1, 1, 1, 2, 1, 1], "turns": [{"speaker": "S1", "text": "Today more and more people advocate lifelong learning . But people have different views about lifelong learning . How do you understand lifelong learning ?"}, {"speaker": "S2", "text": "I think lifelong learning is the concept that it's never too soon or too late for learning"}, {"speaker": "S1", "text": "Does that mean studying all the time ?"}, {"speaker": "S2", "text": "I don't think so . I think it's about your attitude towards learning . One should be open to new ideas , decisions , skills or behaviors ."}, {"speaker": "S1", "text": "Then the axiom - ' You can't teach an old dog new tricks ' doesn't work any longer ."}, {"speaker": "S2", "text": "You're right . Lifelong learning is about finding learning opportunities at all ages and in numerous contexts"}, {"speaker": "S1", "text": "Yes , I agree with you . When I retired I will participate in programs to keep momentally active ."}, {"speaker": "S2", "text": "Me too . To keep up with the changing world , one must be involved in lifelong learning and be ready to accept new things ."}, {"speaker": "S1", "text": "You know what ? I've recently been teaching myself French ."}, {"speaker": "S2", "text": "Really ? That's great ! I know that your company has a lot of clients in France ."}, {"speaker": "S1", "text": "Yes , so I want to learn French to develop my career ."}]}, {"dataset": "DailyDialog", "license": "CC BY-NC-SA 4.0; non-commercial/share-alike", "source": "https://huggingface.co/datasets/roskoN/dailydialog", "why_useful": "体验日常多轮对话结构、话题转接和自然短句。", "row_idx": 71, "dialogue_id": "a438b751ab9997cdb35f07bfe3dfb010b96365f4762d77f87e5f41290ff61c3d_71", "emotion_codes": [0, 0, 0, 0, 0], "act_codes": [2, 2, 1, 2, 1], "turns": [{"speaker": "S1", "text": "How old are you ?"}, {"speaker": "S2", "text": "Nine ... but I'll be ten on May 1st.When is your birthday ?"}, {"speaker": "S1", "text": "I'm older than you ! I'll be ten on April 14th ."}, {"speaker": "S2", "text": "Are you going to have a birthday party ?"}, {"speaker": "S1", "text": "Maybe . I'll have to ask my mother ."}]}, {"dataset": "DailyDialog", "license": "CC BY-NC-SA 4.0; non-commercial/share-alike", "source": "https://huggingface.co/datasets/roskoN/dailydialog", "why_useful": "体验日常多轮对话结构、话题转接和自然短句。", "row_idx": 72, "dialogue_id": "a438b751ab9997cdb35f07bfe3dfb010b96365f4762d77f87e5f41290ff61c3d_72", "emotion_codes": [1, 0, 1, 0, 1, 0, 1], "act_codes": [1, 2, 1, 1, 1, 1, 1], "turns": [{"speaker": "S1", "text": "It smells like an ashtray in here !"}, {"speaker": "S2", "text": "Hi honey ! What ’ s wrong ? Why do you have that look on your face ?"}, {"speaker": "S1", "text": "What ’ s wrong ? I thought we agreed that you were gonna quit smoking ."}, {"speaker": "S2", "text": "No ! I said I was going to cut down which is very different . You can ’ t just expect me to go cold turkey overnight !"}, {"speaker": "S1", "text": "Look , there are other ways to quit . You can try the nicotine patch , or nicotine chewing gum . We spend a fortune on cigarettes every month and now laws are cracking down and not allowing smoking in any public place . It ’ s not like you can just light up like before ."}, {"speaker": "S2", "text": "I know , I know . I am trying but , I don ’ t have the willpower to just quit . I can ’ t fight with the urge to reach for my pack of smokes in the morning with coffee or after lunch ! Please understand ?"}, {"speaker": "S1", "text": "Fine ! I want a divorce !"}]}, {"dataset": "DailyDialog", "license": "CC BY-NC-SA 4.0; non-commercial/share-alike", "source": "https://huggingface.co/datasets/roskoN/dailydialog", "why_useful": "体验日常多轮对话结构、话题转接和自然短句。", "row_idx": 73, "dialogue_id": "a438b751ab9997cdb35f07bfe3dfb010b96365f4762d77f87e5f41290ff61c3d_73", "emotion_codes": [0, 0], "act_codes": [2, 1], "turns": [{"speaker": "S1", "text": "Why are you shivering ?"}, {"speaker": "S2", "text": "It's freezing ."}]}, {"dataset": "DailyDialog", "license": "CC BY-NC-SA 4.0; non-commercial/share-alike", "source": "https://huggingface.co/datasets/roskoN/dailydialog", "why_useful": "体验日常多轮对话结构、话题转接和自然短句。", "row_idx": 74, "dialogue_id": "a438b751ab9997cdb35f07bfe3dfb010b96365f4762d77f87e5f41290ff61c3d_74", "emotion_codes": [0, 2, 0, 2, 0, 1, 0, 6], "act_codes": [1, 1, 2, 1, 1, 2, 1, 2], "turns": [{"speaker": "S1", "text": "It seems that you get antsy when you hear I praise another guy ."}, {"spea
