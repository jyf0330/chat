<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关系策略师 Demo</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --ink: #161b26;
      --muted: #626b7a;
      --line: #dfe3ea;
      --accent: #2f6f68;
      --accent-2: #7a4f2d;
      --danger: #a33a2a;
      --good: #1d6b43;
      --soft: #edf4f2;
      --warn: #fff4e8;
      --shadow: 0 18px 44px rgba(25, 31, 43, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    button, textarea, input, select { font: inherit; }
    button {
      border: 0;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, border-color .16s ease, color .16s ease;
    }
    button:active { transform: translateY(1px); }

    .app {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 24px;
      background: rgba(255, 255, 255, .86);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 4;
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .sub {
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .ghost, .primary {
      height: 36px;
      padding: 0 13px;
      border-radius: 8px;
      font-weight: 750;
      font-size: 13px;
    }

    .ghost {
      background: #fff;
      color: #293241;
      border: 1px solid var(--line);
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    main {
      display: grid;
      grid-template-columns: minmax(300px, 390px) minmax(360px, 1fr) minmax(280px, 370px);
      gap: 16px;
      padding: 16px;
      min-height: 0;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      min-height: 0;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title {
      font-weight: 850;
      font-size: 14px;
    }

    .panel-note {
      font-size: 12px;
      color: var(--muted);
    }

    .panel-body {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 750;
    }

    textarea, input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfd;
      color: var(--ink);
      outline: none;
      padding: 10px 11px;
      line-height: 1.5;
    }

    textarea {
      resize: vertical;
      min-height: 86px;
    }

    textarea:focus, input:focus, select:focus {
      border-color: rgba(47, 111, 104, .75);
      box-shadow: 0 0 0 3px rgba(47, 111, 104, .12);
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .samples {
      display: grid;
      gap: 8px;
    }

    .sample {
      text-align: left;
      background: #f8fafb;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      color: #26313f;
    }

    .sample b {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .sample span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .workspace {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
    }

    .status-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }

    .metric {
      padding: 10px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .metric small {
      color: var(--muted);
      font-size: 11px;
      display: block;
      margin-bottom: 4px;
    }

    .metric strong {
      font-size: 13px;
      line-height: 1.25;
      display: block;
    }

    .output {
      padding: 16px;
      display: grid;
      gap: 12px;
      align-content: start;
      overflow: auto;
    }

    .block {
      border-left: 3px solid var(--accent);
      padding: 9px 0 9px 12px;
      animation: rise .22s ease both;
    }

    .block h3 {
      margin: 0 0 6px;
      font-size: 13px;
    }

    .block p, .block li {
      margin: 0;
      line-height: 1.58;
      color: #26313f;
      font-size: 14px;
    }

    .block ul {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 5px;
    }

    .reply {
      background: var(--soft);
      border: 1px solid #cfe1dc;
      border-radius: 10px;
      padding: 13px;
      animation: rise .24s ease both;
    }

    .reply h3 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 13px;
    }

    .reply p {
      margin: 0;
      line-height: 1.65;
      font-size: 16px;
      font-weight: 700;
    }

    .risk {
      border-left-color: var(--danger);
      background: #fffafa;
      padding-right: 10px;
    }

    .footer-actions {
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: #fff;
    }

    .chat {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
    }

    .thread {
      padding: 14px;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 10px;
      background: linear-gradient(#fff, #fbfcfd);
    }

    .msg {
      max-width: 86%;
      padding: 9px 11px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      animation: pop .18s ease both;
    }

    .msg.them {
      background: #eef1f5;
      justify-self: start;
    }

    .msg.me {
      background: var(--accent);
      color: #fff;
      justify-self: end;
    }

    .msg.system {
      background: #fff7ed;
      color: #8a4b16;
      border: 1px solid #f6d5ae;
      justify-self: center;
      max-width: 100%;
      font-size: 12px;
    }

    .composer {
      padding: 12px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }

    .composer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .chips {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: #344052;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
    }

    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    small {
      color: var(--muted);
      line-height: 1.35;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(.98); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 1120px) {
      main {
        grid-template-columns: 360px 1fr;
      }
      .chat {
        grid-column: 1 / -1;
        min-height: 360px;
      }
    }

    @media (max-width: 760px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }
      .header-actions {
        width: 100%;
        justify-content: stretch;
      }
      .header-actions button {
        flex: 1;
      }
      main {
        grid-template-columns: 1fr;
        padding: 10px;
      }
      .status-row {
        grid-template-columns: 1fr 1fr;
      }
      .grid2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="mark">策</div>
        <div>
          <h1>关系策略师 Demo</h1>
          <div class="sub">离线规则版，用来体验产品形态；后续可接模型 API。</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="ghost" id="resetBtn">重置</button>
        <button class="primary" id="generateTopBtn">生成策略</button>
      </div>
    </header>

    <main>
      <section>
        <div class="panel-head">
          <div>
            <div class="panel-title">输入</div>
            <div class="panel-note">把对方最新一句放这里</div>
          </div>
        </div>
        <div class="panel-body">
          <label>
            对方最新消息
            <textarea id="latestMessage">最近真的有点累，改天再说吧。</textarea>
          </label>
          <label>
            最近上下文
            <textarea id="contextText">我：那今晚还聊吗？
对方：最近真的有点累，改天再说吧。</textarea>
          </label>
          <div class="grid2">
            <label>
              关系阶段
              <select id="stage">
                <option>自动判断</option>
                <option>陌生破冰</option>
                <option>普通朋友</option>
                <option selected>暧昧初期</option>
                <option>热聊升温</option>
                <option>冷淡降温</option>
                <option>冲突修复</option>
                <option>明确拒绝/边界期</option>
              </select>
            </label>
            <label>
              当前目标
              <select id="goal">
                <option>保持连接</option>
                <option selected>稳定升温</option>
                <option>自然约见面</option>
                <option>修复误会</option>
                <option>体面退出</option>
              </select>
            </label>
          </div>
          <label>
            对象档案
            <textarea id="profileText">回复偏慢，表达克制；不喜欢被连续追问；最近工作累；喜欢轻松聊天和电影。</textarea>
          </label>
          <div>
            <div class="panel-title" style="margin-bottom:8px;">示例</div>
            <div class="samples">
              <button class="sample" data-sample="tired"><b>疲惫撤退</b><span>最近真的有点累，改天再说吧。</span></button>
              <button class="sample" data-sample="cold"><b>冷淡短回</b><span>还行。</span></button>
              <button class="sample" data-sample="date"><b>热聊邀约</b><span>哈哈那家店我也一直想去。</span></button>
              <button class="sample" data-sample="conflict"><b>冲突修复</b><span>你每次都这样，我真的有点失望。</span></button>
              <button class="sample" data-sample="reject"><b>明确拒绝</b><span>我觉得我们不合适，之后还是别联系了。</span></button>
            </div>
          </div>
        </div>
      </section>

      <section class="workspace">
        <div class="panel-head">
          <div>
            <div class="panel-title">策略输出</div>
            <div class="panel-note">先判断，再给回复</div>
          </div>
          <small id="modeNote">自由策略 + 底线拦截</small>
        </div>
        <div class="status-row">
          <div class="metric"><small>关系阶段</small><strong id="stageMetric">暧昧初期</strong></div>
          <div class="metric"><small>对方情绪</small><strong id="emotionMetric">疲惫</strong></div>
          <div class="metric"><small>风险等级</small><strong id="riskMetric">中</strong></div>
          <div class="metric"><small>策略方向</small><strong id="strategyMetric">降压</strong></div>
        </div>
        <div class="output" id="output"></div>
        <div class="footer-actions">
          <button class="primary" id="generateBtn">生成策略</button>
          <button class="ghost" id="softerBtn">更克制</button>
          <button class="ghost" id="warmerBtn">更温柔</button>
          <button class="ghost" id="bolderBtn">更主动</button>
        </div>
      </section>

      <section class="chat">
        <div class="panel-head">
          <div>
            <div class="panel-title">陪聊预演</div>
            <div class="panel-note">把建议回复放进对话里看效果</div>
          </div>
        </div>
        <div class="thread" id="thread"></div>
        <div class="composer">
          <div class="chips">
            <button class="chip active" data-tone="balanced">稳妥</button>
            <button class="chip" data-tone="warm">温柔</button>
            <button class="chip" data-tone="bold">主动</button>
            <button class="chip" data-tone="short">短句</button>
          </div>
          <div class="composer-row">
            <input id="draftInput" placeholder="这里会出现首推回复，也可以自己改">
            <button class="primary" id="sendBtn">加入预演</button>
          </div>
          <small>这个页面是离线 Demo，不会把内容发到外部服务。</small>
        </div>
      </section>
    </main>
  </div>

  <script>
    const samples = {
      tired: {
        latest: '最近真的有点累，改天再说吧。',
        context: '我：那今晚还聊吗？\n对方：最近真的有点累，改天再说吧。',
        stage: '暧昧初期',
        goal: '稳定升温',
        profile: '回复偏慢，表达克制；不喜欢被连续追问；最近工作累；喜欢轻松聊天和电影。'
      },
      cold: {
        latest: '还行。',
        context: '我：今天怎么样？\n对方：还行。',
        stage: '冷淡降温',
        goal: '保持连接',
        profile: '最近互动变少；对方不喜欢被查户口；轻松话题更容易接。'
      },
      date: {
        latest: '哈哈那家店我也一直想去。',
        context: '我：上次路过那家日料，看起来还不错。\n对方：哈哈那家店我也一直想去。',
        stage: '热聊升温',
        goal: '自然约见面',
        profile: '对方喜欢美食和轻松安排；不喜欢太正式的邀约。'
      },
      conflict: {
        latest: '你每次都这样，我真的有点失望。',
        context: '我：我不是那个意思，你别想太多。\n对方：你每次都这样，我真的有点失望。',
        stage: '冲突修复',
        goal: '修复误会',
        profile: '对方在冲突里更在意态度；讨厌辩解和翻旧账。'
      },
      reject: {
        latest: '我觉得我们不合适，之后还是别联系了。',
        context: '我：我还想再解释一下。\n对方：我觉得我们不合适，之后还是别联系了。',
        stage: '明确拒绝/边界期',
        goal: '体面退出',
        profile: '对方已经表达明确边界；继续推进会造成压力。'
      }
    };

    const els = {
      latest: document.getElementById('latestMessage'),
      context: document.getElementById('contextText'),
      stage: document.getElementById('stage'),
      goal: document.getElementById('goal'),
      profile: document.getElementById('profileText'),
      output: document.getElementById('output'),
      draft: document.getElementById('draftInput'),
      thread: document.getElementById('thread'),
      stageMetric: document.getElementById('stageMetric'),
      emotionMetric: document.getElementById('emotionMetric'),
      riskMetric: document.getElementById('riskMetric'),
      strategyMetric: document.getElementById('strategyMetric')
    };

    let selectedTone = 'balanced';
    let currentPlan = null;

    function includesAny(text, words) {
      return words.some(word => text.includes(word));
    }

    function inferStage(text, selected) {
      if (selected && selected !== '自动判断') return selected;
      if (includesAny(text, ['不合适', '别联系', '不要再', '没感觉', '算了'])) return '明确拒绝/边界期';
      if (includesAny(text, ['失望', '每次都这样', '生气', '道歉', '吵'])) return '冲突修复';
      if (includesAny(text, ['还行', '嗯', '哦', '随便', '忙'])) return '冷淡降温';
      if (includesAny(text, ['也想去', '哈哈', '下次', '一起', '好呀'])) return '热聊升温';
      return '暧昧初期';
    }

    function analyze() {
      const text = els.latest.value.trim();
      const stage = inferStage(text, els.stage.value);
      let emotion = '中性表达';
      let intent = '维持对话';
      let risk = '低';
      let strategy = '轻连接';
      let wrongMoves = ['连续追问', '过度解释'];

      if (includesAny(text, ['累', '困', '忙', '改天', '没空'])) {
        emotion = '疲惫/撤退';
        intent = '暂时没精力互动';
        risk = '中';
        strategy = '降压 + 体贴 + 保留连接';
        wrongMoves = ['追问原因', '表达委屈', '要求解释', '连续补消息'];
      }
      if (includesAny(text, ['还行', '嗯', '哦', '随便'])) {
        emotion = '冷淡/低能量';
        intent = '低负担回应';
        risk = '中';
        strategy = '降低提问压力 + 轻收束';
        wrongMoves = ['查户口式追问', '阴阳怪气', '立刻质问态度'];
      }
      if (includesAny(text, ['也想去', '一起', '好呀', '哈哈'])) {
        emotion = '感兴趣';
        intent = '愿意延展话题';
        risk = '低';
        strategy = '轻邀约 + 给选择';
        wrongMoves = ['突然表白', '把邀约说得太正式', '过度承诺'];
      }
      if (includesAny(text, ['失望', '每次都这样', '难受', '生气'])) {
        emotion = '失望/受伤';
        intent = '希望被理解';
        risk = '高';
        strategy = '承认感受 + 承担自己部分 + 暂缓争辩';
        wrongMoves = ['辩论输赢', '翻旧账', '假道歉', '解释压过感受'];
      }
      if (includesAny(text, ['不合适', '别联系', '别再', '没感觉', '不要找我'])) {
        emotion = '拒绝/设边界';
        intent = '结束关系推进';
        risk = '高';
        strategy = '尊重边界 + 体面退出';
        wrongMoves = ['挽回轰炸', '道德绑架', '继续试探', '自我伤害威胁'];
      }

      return { stage, emotion, intent, risk, strategy, wrongMoves };
    }

    function replySet(plan, tone = selectedTone) {
      const stage = plan.stage;
      if (stage === '明确拒绝/边界期') {
        return {
          main: '我明白了，也尊重你的决定。之前如果有让你不舒服的地方，抱歉。之后我不会再打扰你，祝你一切顺利。',
          alternatives: [
            '好，我尊重你的感受，也谢谢你说清楚。之后我不会再打扰你。',
            '我知道了。虽然有点遗憾，但我尊重你的选择，之后不再打扰。',
            '明白。谢谢你坦诚说出来，我会收住，也祝你之后都好。'
          ],
          next: '不要继续补消息。把边界写入对象档案，后续不再推进。'
        };
      }
      if (stage === '冲突修复') {
        return {
          main: '我听到了，你失望不是没理由的。刚才我确实只顾着解释，没有先顾到你的感受。让我认真想想，晚点给你一个具体回应。',
          alternatives: [
            '你这么说我会认真听。刚才我处理得不好，不该急着解释。',
            '我能理解你为什么失望。先不争对错，我想先把你的感受接住。',
            '对不起，刚才我没有把你的感受放在前面。我会具体改，不只嘴上说。'
          ],
          next: '先暂停辩解，等情绪降下来后给一个具体修复动作。'
        };
      }
      if (stage === '热聊升温') {
        const main = tone === 'short'
          ? '那我们眼光挺同步。要不这周一起去试试？'
          : '那我们眼光还挺同步。要不这周找个不赶的时间一起去试试？';
        return {
          main,
          alternatives: [
            '你也想去就好办了。找天我们一起去踩个点？',
            '那这家店可以先进入我们的待办清单了。你这周哪天比较轻松？',
            '看来不是我一个人惦记。要不我们把“想去”变成“去过”？'
          ],
          next: '如果对方接住邀约，给两个可选时间，不要一次抛太多安排。'
        };
      }
      if (plan.emotion.includes('冷淡')) {
        return {
          main: '那就先不拷问你今天了。希望你今晚能轻松一点。',
          alternatives: [
            '收到，那今天先放过你。等你想聊的时候再说。',
            '好，那我不追问啦。你先忙自己的。',
            '明白。那我换个轻松点的：今天有没有一件还算不糟的小事？'
          ],
          next: '如果对方仍然短回，就收束，不继续加码。'
        };
      }
      if (plan.emotion.includes('疲惫')) {
        const mainByTone = {
          balanced: '那你先好好休息，别硬撑。等你缓过来我们再聊，我不催你。',
          warm: '辛苦了，先把自己照顾好。聊天不急，我在。',
          bold: '那今天先放过你。等你回血了，我再来领取一点聊天时间。',
          short: '好，你先休息。等你缓过来再聊。'
        };
        return {
          main: mainByTone[tone] || mainByTone.balanced,
          alternatives: [
            '收到，那今天先放过你。记得早点休息，我晚点不吵你。',
            '好，那你先休息，别勉强聊天。',
            '辛苦了。先照顾好自己，聊天可以改天。'
          ],
          next: '今晚不要连续补消息。明天中午可以发一个低负担问候。'
        };
      }
      return {
        main: '我懂你的意思。那我先不把话说满，我们轻松聊就好。',
        alternatives: [
          '收到，我先顺着你的节奏来。',
          '好，那我不急着推进，我们慢慢来。',
          '明白。那今天就先轻松一点。'
        ],
        next: '观察对方下一轮是否主动延展，再决定是否推进。'
      };
    }

    function generate() {
      currentPlan = analyze();
      const replies = replySet(currentPlan);
      updateMetrics(currentPlan);
      els.output.innerHTML = `
        <div class="block">
          <h3>局势判断</h3>
          <p>关系阶段是 <b>${escapeHtml(currentPlan.stage)}</b>。对方这句话更像 <b>${escapeHtml(currentPlan.emotion)}</b>，意图倾向于：${escapeHtml(currentPlan.intent)}。</p>
        </div>
        <div class="block">
          <h3>策略判断</h3>
          <p>${escapeHtml(currentPlan.strategy)}。现在先稳住对方感受，再决定是否推进。</p>
        </div>
        <div class="reply">
          <h3>首推回复</h3>
          <p>${escapeHtml(replies.main)}</p>
        </div>
        <div class="block">
          <h3>备选回复</h3>
          <ul>${replies.alternatives.map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>
        </div>
        <div class="block risk">
          <h3>风险提醒</h3>
          <p>别这样回：${currentPlan.wrongMoves.map(escapeHtml).join('、')}。</p>
        </div>
        <div class="block">
          <h3>下一步</h3>
          <p>${escapeHtml(replies.next)}</p>
        </div>
      `;
      els.draft.value = replies.main;
      seedThread();
    }

    function updateMetrics(plan) {
      els.stageMetric.textContent = plan.stage;
      els.emotionMetric.textContent = plan.emotion;
      els.riskMetric.textContent = plan.risk;
      els.strategyMetric.textContent = plan.strategy.split(' + ')[0];
    }

    function seedThread() {
      const lines = els.context.value.split('\n').map(x => x.trim()).filter(Boolean).slice(-4);
      els.thread.innerHTML = lines.map(line => {
        const isMe = line.startsWith('我');
        const text = line.replace(/^我[:：]/, '').replace(/^对方[:：]/, '').trim();
        return `<div class="msg ${isMe ? 'me' : 'them'}">${escapeHtml(text)}</div>`;
      }).join('') + '<div class="msg system">已生成一条建议回复，可加入预演。</div>';
      els.thread.scrollTop = els.thread.scrollHeight;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
    }

    function loadSample(name) {
      const sample = samples[name];
      els.latest.value = sample.latest;
      els.context.value = sample.context;
      els.stage.value = sample.stage;
      els.goal.value = sample.goal;
      els.profile.value = sample.profile;
      generate();
    }

    document.querySelectorAll('[data-sample]').forEach(button => {
      button.addEventListener('click', () => loadSample(button.dataset.sample));
    });

    document.querySelectorAll('[data-tone]').forEach(button => {
      button.addEventListener('click', () => {
        selectedTone = button.dataset.tone;
        document.querySelectorAll('[data-tone]').forEach(x => x.classList.remove('active'));
        button.classList.add('active');
        generate();
      });
    });

    document.getElementById('generateBtn').addEventListener('click', generate);
    document.getElementById('generateTopBtn').addEventListener('click', generate);
    document.getElementById('softerBtn').addEventListener('click', () => { selectedTone = 'short'; generate(); });
    document.getElementById('warmerBtn').addEventListener('click', () => { selectedTone = 'warm'; generate(); });
    document.getElementById('bolderBtn').addEventListener('click', () => { selectedTone = 'bold'; generate(); });
    document.getElementById('resetBtn').addEventListener('click', () => loadSample('tired'));
    document.getElementById('sendBtn').addEventListener('click', () => {
      const text = els.draft.value.trim();
      if (!text) return;
      const node = document.createElement('div');
      node.className = 'msg me';
      node.textContent = text;
      els.thread.appendChild(node);
      els.thread.scrollTop = els.thread.scrollHeight;
    });

    generate();
  </script>
</body>
</html>
